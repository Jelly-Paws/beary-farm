  });
}

/* ---------- 小熊投喂页 ---------- */
function paintBear(){
  if(!feedGrid) return;
  var pct=Math.max(0,Math.min(100,Math.round(S.full||0)));
  var ff=$('fullFill'); if(ff) ff.style.width=pct+'%';
  var ft=$('fullTxt');
  if(ft){
    var txt;
    if(S.bears<=0) txt='还没有小熊呢，先去农场请一只吧 🧸';
    else if(S.full>=BEAR_FULL_OK) txt='饱饱的 '+pct+'% · 正在帮你捡地上的粑粑 🧹';
    else if(S.full>0) txt='有点饿 '+pct+'% · 吃饱 '+BEAR_FULL_OK+'% 就会帮你干活';
    else txt='肚子空空的 0% · 喂点小熊料理给它吧';
    if(ft.textContent!==txt) ft.textContent=txt;
  }

  /* 小京探险回来的叹号：现在挂在左侧导航栏的「小京」按钮上 */
  var bearBadge = $('bearBadge');
  if(bearBadge) bearBadge.classList.toggle('is-on', !!S.lootPending);

  var lootBtn = $('lootBtn');
  if(lootBtn) lootBtn.style.display = S.lootPending ? 'block' : 'none';

  var bf=$('bearFace');
  if(bf) bf.classList.toggle('happy', S.bears>0 && S.full>=BEAR_FULL_OK);

  var expBox = $('expeditionBox');
  if(expBox){
    if(S.expedition){
      expBox.style.display = 'block';
      var now = Date.now();
      var remain = Math.max(0, S.expedition.endTime - now);
      var percent = Math.min(100, (1 - remain / S.expedition.duration) * 100);
      var progEl = $('expProgress');
      if(progEl) progEl.style.width = percent + '%';
      var titleEl = $('expTitle');
      if(titleEl) titleEl.textContent = '🧸 小京正在' + getSeasonName(S.expedition.season) + '探险中...';
      var timeEl = $('expTimeLeft');
      if(timeEl) timeEl.textContent = '剩余 ' + Math.ceil(remain / 1000) + ' 秒';
    } else {
      expBox.style.display = 'none';
    }
  }

  BEAR_DISHES.forEach(function(d,i){
    var b=feedGrid.children[i];
    if(!b) return;
    var n=S.dish[d.id]||0;
    var key=d.id+'|'+n;
    if(b.getAttribute('data-k')!==key){
      b.innerHTML='<span class="e">'+itemIcon(d.id,d.e)+'</span><span class="info"><span class="n">'+d.n+'</span><span class="p">有 '+n+' 份 · 饱食 +'+d.feed+'</span></span>';
      b.setAttribute('data-k',key);
    }
    b.classList.toggle('poor', n<=0);
  });
}

/* ============================================================
   吃东西的特殊效果表
   ------------------------------------------------------------
   分工是这样的：
     · 菜品表（DISHES）里只写「哪个效果」→  onEat:'fullBelly'
     · 具体这个效果做什么，写在这张表里 ↓

   好处：以后有 20 道菜带效果，也**不用把菜品表改成一堆开关**，
        只需要往下面这张表里加一条，然后在菜上写个名字。
        加效果 = 加一行，不用动别的任何东西。

   要加新效果，照抄这个格式：
     effectName: function(d){ ... }
   d 就是这道菜本身（d.n 名字、d.e 图标、d.feed 饱食度……）
   ============================================================ */
var EAT_EFFECTS = {

  /* 超级起泡酒：饱食度直接拉满，并且 3 分钟不掉 */
  fullBelly: function(d){
    S.bubbleBuffT = Date.now() + 3*60*1000;
    S.full = BEAR_FULL_MAX;
    toast(d.n+' 小京把它喝光了，饱食度瞬间回满，3分钟不掉！');
  }

};

/* 跑一道菜的 onEat 效果。返回 true 表示"有特殊效果，已经处理过了" */
function runEatEffect(d){
  if(!d.onEat) return false;
  var fx = EAT_EFFECTS[d.onEat];
  if(!fx){
    /* 名字写错了不静默失败 —— 直接在控制台吼一声，方便排查 */
    console.warn('菜品 '+d.id+' 的 onEat 写了不存在的效果："'+d.onEat+'"，请在 EAT_EFFECTS 里补上');
    return false;
  }
  fx(d);
  return true;
}

/* ============================================================
   小京吃掉一道菜
   ------------------------------------------------------------
   （2026-09-22 抽出来的）
   以前这段逻辑写在 feedBear() 里，只有「抽屉里点投喂」这一条路能走到。
   现在厨房里「把熊料理拖给熊头垃圾桶」也要喂小京，
   所以把它单独拎出来 —— **两条路走同一份规则**，
   以后改饱食度、改打嗝概率，只改这一个地方，不会两边不一致。
   ============================================================ */
function eatDish(d){
  /* ⚠️ `(d.feed || 0)` 那个保护不能去掉：
     2026-09-24 之后，普通菜在笔记里是【不写 feed 的】（只有小熊料理才需要它），
     所以普通菜的 d.feed 是 undefined。虽然按设计只有 bear 菜会走到这里，
     但万一哪天有人在别处调了这个函数，没有这个兜底就会变成 NaN。 */
  S.full=Math.min(BEAR_FULL_MAX,(S.full||0)+(d.feed||0));
  S.fullT=Date.now();
  var hadEffect = runEatEffect(d);   /* 有特殊效果就让它自己提示，不再说普通台词 */
  if(!hadEffect){
    if(S.full>=BEAR_FULL_OK) toast('小京吃得饱饱的，开始帮你捡粑粑啦 🧸');
    else toast('小京吃掉了'+d.n+'，肚子暖暖的');
  }
  if(S.full >= BEAR_FULL_MAX && Math.random() < 0.2){
    setTimeout(burpEvent, 500);
  }
}

/* 抽屉里「投喂小京」：从仓库里扣掉一份小熊料理，然后喂下去。
   小熊料理是唯一能加饱食度的东西 ——
   厨房里拖给熊头的普通菜和黑暗料理都不加（原因见 feedToBear）。
   而且 2026-09-24 之后，普通菜连「被熊头吃掉」都不行了，
   拖上去只会被拒绝：小京才不要吃这个呢。 */
function feedBear(id){
  var d=byDish(id);
  if(!d||!d.bear){ toast('这个不是小熊料理，小京不吃哦'); return; }
  if(S.bears<=0){ toast('还没有小熊呢，先去农场请一只吧'); return; }
  var n=S.dish[d.id]||0;
  if(n<=0){ toast('还没有'+d.n+'呢，先去厨房做一份吧'); return; }
  S.dish[d.id]=n-1;
  eatDish(d);
  save(); paint();
}

var tempPack = {honey:0, dishes:{}};

function openOuting(){
  tempPack = {honey:0, dishes:{}};
  renderPackUI();
}

function renderPackUI(){
  var totalFeed = 0;
  for(var k in tempPack.dishes){
    var d = byDish(k);
    if(d) totalFeed += d.feed * tempPack.dishes[k];
  }

  var html = '<div class="ttl">🎒 小京的旅行背包</div>'+
    '<div class="hintline" style="margin-bottom:14px">需要：总饱食度 ≥ 100 的小熊料理 + 1 罐蜂蜜</div>'+
    '<div style="font-size:14px;font-weight:700;color:#e2789f;margin-bottom:12px">'+
    itemIcon('honey','🍯')+' 蜂蜜：'+tempPack.honey+' / 1<br>'+
    itemIcon('donut','🍩')+' 总饱食度：'+totalFeed+' / 100</div>'+
    '<div class="seeds" style="max-height:180px;overflow-y:auto;margin-bottom:12px">';

  // 蜂蜜：只要装满了1个，就变灰不能再点
  var honeyFull = tempPack.honey >= 1;
  html += '<button class="seed'+(honeyFull ? ' poor' : '')+'" id="packHoney">'+
    '<span class="e">'+itemIcon('honey','🍯')+'</span><span class="info"><span class="n">蜂蜜</span><span class="p">'+(honeyFull ? '已经装好啦' : '点击装 1 罐')+'</span></span></button>';

  BEAR_DISHES.forEach(function(d){
    var n = S.dish[d.id] || 0;
    var packed = tempPack.dishes[d.id] || 0;
    if(n <= 0) return;

    // 判断加上这个料理会不会超过100
    var willExceed = (totalFeed >= 100);
    var canPack = (packed < n) && !willExceed;

    html += '<button class="seed'+(canPack ? '' : ' poor')+'" id="pack_'+d.id+'">'+
      '<span class="e">'+itemIcon(d.id,d.e)+'</span><span class="info"><span class="n">'+d.n+'</span><span class="p">有 '+n+' 份 · 装了 '+packed+' · 饱食 +'+d.feed+'</span></span></button>';
  });

  html += '</div>';

  var canGo = totalFeed >= 100 && tempPack.honey >= 1;
  html += '<button class="catb" id="packGo" '+(canGo ? '' : 'disabled')+'>'+(canGo ? '出发去森林' : '还没装满哦')+'</button>';
  html += '<div class="hintline" style="margin-top:10px">点空白处关闭</div>';

  panel.innerHTML = html;
  overlay.classList.add('on');

  // 蜂蜜的点击逻辑：最多只能装1个
  var bh = $('packHoney');
  if(bh) bh.addEventListener('click', function(){
    if(honeyFull){
      toast('蜂蜜只需要 1 罐就够啦，不能再装啦');
      return;
    }
    if(S.honey >= 1){
      tempPack.honey = 1;
      renderPackUI();
    } else {
      toast('仓库里没有蜂蜜啦，先去种地收集一点吧');
    }
  });

  // 料理的点击逻辑：达到100饱食度就锁定，不让手滑多塞
  BEAR_DISHES.forEach(function(d){
    var b = $('pack_'+d.id);
    if(b) b.addEventListener('click', function(){
      var packed = tempPack.dishes[d.id] || 0;
      var have = S.dish[d.id] || 0;

      if(packed >= have){
        toast('仓库里没有多余的'+d.n+'啦');
        return;
      }

      if(totalFeed >= 100){
        toast('呜……带不下那么多啦，吃多了要走不动了……');
        return;
      }

      tempPack.dishes[d.id] = packed + 1;
      renderPackUI();
    });
  });

  var pg = $('packGo');
  if(pg) pg.addEventListener('click', function(){
    if(totalFeed >= 100 && tempPack.honey >= 1){
      showSeasonSelect();
    }
  });
}

function showSeasonSelect(){
  panel.innerHTML='<div class="ttl">🍃 去哪个森林探险呢？</div>'+
    '<button class="catb" id="outSpring" style="margin-top:8px;background:#f7c8dc;box-shadow:0 4px 0 #dd89a8">🌸 春季森林</button>'+
    '<button class="catb" id="outSummer" style="margin-top:8px;background:#8fd0e8;box-shadow:0 4px 0 #6fb4d0">🏝️ 夏季森林</button>'+
    '<button class="catb" id="outAutumn" style="margin-top:8px;background:#c9a9e0;box-shadow:0 4px 0 #ab8ac4">🍂 秋季森林</button>'+
    '<button class="catb" id="outWinter" style="margin-top:8px;background:#b6d99a;box-shadow:0 4px 0 #9bc47e">❄️ 冬季森林</button>'+
    '<div class="hintline" style="margin-top:12px">点空白处关闭</div>';
  overlay.classList.add('on');

  $('outSpring').addEventListener('click', function(){ startExpedition('spring'); });
  $('outSummer').addEventListener('click', function(){ startExpedition('summer'); });
  $('outAutumn').addEventListener('click', function(){ startExpedition('autumn'); });
  $('outWinter').addEventListener('click', function(){ startExpedition('winter'); });
}

function getSeasonName(season){
  if(season==='spring') return '春季森林';
  if(season==='summer') return '夏季森林';
  if(season==='autumn') return '秋季森林';
  if(season==='winter') return '冬季森林';
  return '';
}

function startExpedition(season){
  if(S.lootPending){
    toast('小京还有礼物没领呢，先领了再出发吧 🧸');
    return;
  }
  overlay.classList.remove('on');
  panel.innerHTML='';

  S.honey -= tempPack.honey;
  for(var k in tempPack.dishes){
    S.dish[k] = (S.dish[k]||0) - tempPack.dishes[k];
  }

  S.expedition = {
    season: season,
    endTime: Date.now() + 60000,
    duration: 60000
  };

  toast('小京出发去' + getSeasonName(season) + '探险了，要一分钟才回来哦');
  save(); paint();
}

function finishExpedition(){
  if(!S.expedition) return;
  var season = S.expedition.season;
  S.expedition = null;
  S.lootPending = true; // 标记有待领取的战利品

  var loot = {};
  var total = 12;

  function addLoot(id, n){
    if(id === 'skewer'){
      S.dish[id] = (S.dish[id]||0) + n;
    } else {
      S.store[id] = (S.store[id]||0) + n;
    }
    S.seen[id] = 1;
    loot[id] = (loot[id]||0) + n;
  }

  for(var i=0;i<10;i++){
    var r = Math.random();
    if(r < 0.3){
      addLoot('meat', 1);
    } else if(r < 0.5){
      var crop = CROPS[Math.floor(Math.random()*CROPS.length)];
      addLoot(crop.id, 1);
    } else if(r < 0.7){
      var craftGoods = ['sugar','flour','butter','ketchup','oil','jam','mayo'];
      var cg = craftGoods[Math.floor(Math.random()*craftGoods.length)];
      addLoot(cg, 1);
    } else {
      var seasonRoll = Math.random();
      if(season==='spring'){
        if(seasonRoll < 0.7) addLoot('lemon', 1);
        else addLoot('skewer', 1);
      } else if(season==='summer'){
        if(seasonRoll < 0.5) addLoot('alcohol', 1);
        else addLoot('shrimp', 1);
      } else if(season==='autumn'){
        if(seasonRoll < 0.3) addLoot('honey', 1);
        else addLoot('cheese', 1);
      } else if(season==='winter'){
        if(seasonRoll < 0.9) addLoot('ice', 1);
        else if(seasonRoll < 0.999) addLoot('snowman', 1);
        else addLoot('sparkle_snowman', 1);
      }
    }
  }

  var summary = [];
  for(var k2 in loot){
    var g = byGood(k2);
    summary.push(itemIcon(g.id,g.e)+' '+g.n+' ×'+loot[k2]);
  }

  S.lootSummary = summary.join('，');
  save(); paint();
}

function burpEvent(){

/* ============================================================
   统一拖拽骨架（2026-09-22 泛化）
   ------------------------------------------------------------
   以前这套骨架是专为「把💩拖进垃圾桶」长出来的，
   里面把 💩 和 #trash 写死在了逻辑里。
   现在打通过之后，四种拖拽共用同一套骨架（没有抄第二份）：

     ① 💩 → 🗑️            payload = {kind:'poop', i:地块号}
     ② 食材 → 锅           payload = {kind:'ing',  id:'tomato'}
     ③ 成品 → 订单/熊头/小京按钮
                           payload = {kind:'out'}
     ④ 锅里那格 → 别处      payload = {kind:'pot',  i:格子号}
        拖到别的空格 = 挪位置；拖出锅外 = 拿掉（库存还回来）

   怎么找到「手指底下那个投放区」：
     每个能接东西的元素上都写了 data-drop="xxx"。
     拖拽替身是 pointer-events:none，所以 elementFromPoint
     直接就能拿到它底下的元素，然后顺着 parentElement 往上找。

   为什么不用「比层级」那一套：
     跟当初解决「导航栏 vs 抽屉」是同一个思路 —— 不重叠就不用比火候。
     熊头垃圾桶那个写死的 999，就是被这一条干掉的。

   ⚠️ 以后要加第五种拖拽 / 新的投放区，只需要：
        在元素上写 data-drop="你的名字"，
        然后到 zoneAccepts 和 doDrop 里各加一行。
        骨架本身一个字都不用改。
   ============================================================ */
var dragPayload=null, dragGhost=null, dragMoved=false, dragSX=0, dragSY=0, dragBlock=0;

function dragStart(e, payload){
  if(!payload) return;
  /* 不该拖的东西直接拦掉，别让玩家白拖一趟 */
  if(payload.kind==='poop'    && S.poops.indexOf(payload.i)<0) return;
  if(payload.kind==='ing'     && haveMat(payload.id)<=0) return;      /* 仓库里没有这个食材 */
  if(payload.kind==='pot'     && !S.pot[payload.i]) return;
  if(payload.kind==='bagdish' && (S.dish[payload.id]||0)<=0) return;  /* 背包里没有这道菜 */
  dragPayload=payload; dragMoved=false; dragSX=e.clientX; dragSY=e.clientY;
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd);
  document.addEventListener('pointercancel',dragEnd);
}

/* 跟手的那个替身该显示什么 icon */
function dragIconOf(p){
  if(p.kind==='poop')    return '💩';
  if(p.kind==='ing'){
    var ing=ingInfo(p.id); return ing ? itemIcon(ing.id,ing.e) : '?';
  }
  if(p.kind==='pot'){
    var potIng=ingInfo(S.pot[p.i]); return potIng ? itemIcon(potIng.id,potIng.e) : '?';
  }
  if(p.kind==='bagdish'){
    var dish=byDish(p.id); return dish ? itemIcon(dish.id,dish.e) : '?';
  }     /* 从厨房菜肴列表拖出来的菜 */
  if(p.kind==='out'){
    var o=S.potOut;
    if(!o) return '?';
    if(o.kind==='dark') return DARK_DISH.e;
    var outDish=byDish(o.id); return outDish ? itemIcon(outDish.id,outDish.e) : '?';
  }
  return '?';
}

/* 手指底下是哪个投放区（都不是就返回 null） */
function dropZoneAt(x,y){
  var el=document.elementFromPoint(x,y);
  while(el && el!==document.body){
    if(el.getAttribute && el.getAttribute('data-drop')) return el;
    el=el.parentElement;
  }
  /* 🗑️ 垃圾桶的兜底判定。
     ⚠️ 这段代码是【历史遗留的保险】，2026-09-24 之后其实已经用不上了 ——
        它当初固定在屏幕右下角、装着 pointer-events:none（怕挡住页脚按钮），
        所以 elementFromPoint 找不到它，只能靠算坐标。
        现在它搬进导航栏了、也改成 pointer-events:auto，
        上面那圈 while 循环就能正常找到它。
     **留着不删**：万一以后有人又给它加回 pointer-events:none，
     这里还有一层保险，不至于"拖到桶上却没反应"。
     多花的那点开销可以忽略（只在松手的那一瞬间算一次）。 */
  var tr=$('trash');
  if(tr){
    var r=tr.getBoundingClientRect();
    if(x>=r.left-22 && x<=r.right+22 && y>=r.top-22 && y<=r.bottom+22) return tr;
  }
  return null;
}

/* 这个投放区接不接得住手上这件东西。
   接得住 → 一拖起来它就亮粉圈，玩家一眼知道该往哪拖。 */
function zoneAccepts(zone, p){
  var t=zone.getAttribute('data-drop');
  if(t==='trash')   return p.kind==='poop';

  /* 锅只接食材：放新的进去、或者在锅里换位置。
     （锅里的食材拖到【别的格子】上就是交换，拖到【锅外】就是拿掉还回仓库） */
  if(t==='pot')     return p.kind==='ing' || p.kind==='pot';

  /* 熊头 / 订单槽，都接两种来源：
       out     = 锅里刚做好、正躺在成品格里的
       bagdish = 从【厨房最下面那排菜肴 ui】拖出来的（背包里得有货）
     —— 用户 2026-09-24 要求："我们把菜肴的 ui 也变成可拖拽，可以直接拖拽到订单去结算。"
        ⚠️ 他说的「菜肴的 ui」就是厨房那排菜肴图标，
           不是背包抽屉里的「🍲 菜肴仓库」—— 他专门纠正过一次。 */
  if(t==='bear')    return p.kind==='out' || p.kind==='bagdish';
  /* 订单槽：冷却中（那个槽现在是 null、显示 ❌）就【不接东西】。
     2026-09-27 加 —— 不然玩家会拖上去发现没反应，还以为卡了。 */
  if(t==='order'){
    var oi = parseInt(zone.getAttribute('data-i'),10);
    if(!S.orders[oi]) return false;
    return p.kind==='out' || p.kind==='bagdish';
  }

  /* 菜肴列表 = 把成品收进背包的口子。
     ⚠️ 2026-09-27 起，「拖给左侧 🧸 小京按钮收背包」那条路【已经取消】
        （用户要求），只认这一个新口子。它只接成品格里的东西。 */
  if(t==='dishlist') return p.kind==='out';

  return false;
}

/* 把「接得住我」的投放区全点亮 */
function markDropZones(p){
  Array.prototype.forEach.call(document.querySelectorAll('[data-drop]'), function(z){
    z.classList.toggle('drop-hot', zoneAccepts(z,p));
  });
}
function clearDropZones(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-drop]'), function(z){
    z.classList.remove('drop-hot');
    z.classList.remove('drop-over');
  });
}

function dragMove(e){
  if(!dragPayload) return;
  var dx=e.clientX-dragSX, dy=e.clientY-dragSY;
  if(!dragMoved){
    if(Math.abs(dx)+Math.abs(dy)<9) return;      /* 小抖动不算拖，防止误触 */
    dragMoved=true;
    dragGhost=document.createElement('div');
    dragGhost.className='dragGhost';
    dragGhost.innerHTML=dragIconOf(dragPayload);
    document.body.appendChild(dragGhost);
    markDropZones(dragPayload);
  }
  dragGhost.style.left=e.clientX+'px';
  dragGhost.style.top=e.clientY+'px';

  /* 高亮「手指正悬在上面的那一个」 */
  var zone=dropZoneAt(e.clientX,e.clientY);
  Array.prototype.forEach.call(document.querySelectorAll('[data-drop].drop-hot'), function(z){
    z.classList.toggle('drop-over', z===zone);
  });

  if(e.cancelable) e.preventDefault();
}

function dragEnd(e){
  document.removeEventListener('pointermove',dragMove);
  document.removeEventListener('pointerup',dragEnd);
  document.removeEventListener('pointercancel',dragEnd);
  if(dragGhost){ dragGhost.remove(); dragGhost=null; }

  var p=dragPayload;
  if(dragMoved && p){
    dragBlock=Date.now()+350;    /* 拖完这一下，别顺手又把下面那格点了 */
    var zone=dropZoneAt(e.clientX,e.clientY);
    if(zone && zoneAccepts(zone,p)){
      doDrop(zone,p);
    }else{
      /* 哪儿都没落上 */
      if(p.kind==='pot'){
        /* 从锅里拖出锅外 = 拿掉这一格，并且【把食材还回仓库】。
           ⚠️ 2026-09-27 修：以前这里只写了`S.pot[p.i]=null`，
              注释和提示语都写着"还回仓库"，但**代码根本没还** ——
              食材就这么凭空消失了。玩家报的 bug 就是这个。
              （又一个"注释写对了、代码没跟上"的活例子，这次是我写的。） */
        var ing=S.pot[p.i];
        S.pot[p.i]=null;
        if(ing) takeMat(ing, -1);     /* 负数 = 加回仓库（蜂蜜也走同一个函数） */
        sfx('ingPick');               /* 轻轻一下"嗒" —— 把食材拿出来了 */
        toast('把食材拿出来了，还回仓库');
        save(); paint();
      }else if(p.kind==='poop'){
        toast('没对准，要把粑粑拖到左边导航栏那个桶里');
      }else if(p.kind==='out'){
        toast('成品可以拖到左边订单交货，也可以往下拖到菜肴列收进背包');
      }else if(p.kind==='bagdish'){
        toast('拖到左边要它的那个订单上，就能交货啦');
      }
    }
  }
  clearDropZones();
  dragPayload=null; dragMoved=false;
}

/* 真正落地：哪个投放区 + 拖的是什么 */
function doDrop(zone, p){
  var t=zone.getAttribute('data-drop');

  /* ---------- 💩 丢进垃圾桶 ---------- */
  if(t==='trash'){ collectPoop(p.i); return; }

  /* ---------- 放进锅里 / 在锅里挪位置 / 两格交换 ---------- */
  if(t==='pot'){
    var i=parseInt(zone.getAttribute('data-i'),10);
    if(p.kind==='ing'){
      if(S.pot[i]){ toast('这一格已经有东西啦'); return; }
      if(haveMat(p.id)<=0){ toast('仓库里没有这个食材哦'); return; }
      /* ⚠️ 放进去的瞬间就扣库存（拿掉会还回来）。
         这样背包里看到的数字永远是真的，
         不会出现「锅里摆着一个、仓库里也还留着一个」的幽灵食材。 */
      S.pot[i]=p.id;
      takeMat(p.id,1);
      sfx('ingDrop');                 /* 木头的"嗒" —— 食材落进锅 */
      save(); paint();
      return;
    }
    if(p.kind==='pot'){
      if(i===p.i) return;
      /* 目标格空着 → 挪过去；目标格有东西 → **两个交换位置**。
         用户 2026-09-24 原话："我希望已经放进九宫格里的食物，可以交换，
         例如 1 放了蜂蜜，2 放了糖。我把蜂蜜拖到糖上，它们就可以交换位置。"
         ⚠️ 所以这里【绝对不能再拦】「这一格已经有东西啦」——
            拦了就没法交换了。（以前就是那么拦的，这次改掉了。） */
      var tmp=S.pot[i];
      S.pot[i]=S.pot[p.i];
      S.pot[p.i]=tmp;
      sfx('ingSwap');                 /* 连着两下"嗒嗒" —— 两格换位置 */
      save(); paint();
      return;
    }
    return;
  }

  /* ---------- 交给熊头垃圾桶（小京吃） ---------- */
  if(t==='bear'){ feedToBear(p); return; }

  /* ---------- 交给订单槽（交货结算） ---------- */
  if(t==='order'){ deliverToOrder(parseInt(zone.getAttribute('data-i'),10), p); return; }

  /* ---------- 拖到菜肴列表 = 收进菜肴仓库（背包） ----------
     2026-09-27 新口子。原来这条走的是「拖给左侧 🧸 小京 按钮」，
     用户要求改成拖到菜肴列，小京按钮不再接东西。 */
  if(t==='dishlist'){ storeToBag(p); return; }
}
/* 把一块地上的💩收进桶里。
   ⚠️ silent 参数是【小京自动捡】用的 —— 他干活是不出声的（用户特别要求，
      原话："小京种菜收菜收粑粑都是没声音的（不然会很吵）"）。
      只有玩家自己拖着扔进去的那一下，才会响「吧唧」。 */
function collectPoop(i, silent){
  var k=S.poops.indexOf(i);
  if(k<0) return;
  S.poops.splice(k,1);
  S.dung++;
  S.coins+=5;
  if(!silent) sfx('poopPick');        /* "吧唧" —— 玩家手动拖进去的 */
  pop(i,'🪙+5 🪣+1');
  save(); paint();
}
function addPoops(n){
  var free=[];
  for(var i=0;i<N;i++){
    if(S.plots[i].u && S.poops.indexOf(i)<0) free.push(i);
  }
  for(var j=0;j<n && free.length;j++){
    var idx=Math.floor(Math.random()*free.length);
    S.poops.push(free[idx]);
    free.splice(idx,1);
  }
}

/* ---------- 动物 ---------- */
function buyAnimal(id){
  var a=byAnimal(id);
  if(!a) return;
  if(S.animals[a.id]>=ANIMAL_MAX){ toast('已经有 '+ANIMAL_MAX+' 只'+a.n+'啦，够热闹的'); return; }
  if(S.coins<a.price){ toast('还差 '+Math.ceil(a.price-S.coins)+' 🪙'); return; }
  S.coins-=a.price;
  S.animals[a.id]++;
  if(!S.anT[a.id]) S.anT[a.id]=Date.now()+a.time*1000;
  toast('一只'+a.n+'住进来了，它爱吃'+a.fname);
  save(); paint();
}

setInterval(function(){
  var now=Date.now(), changed=false;
  if(animalTotal()<=0) return;
  var angry=animalsAngry();
  ANIMALS.forEach(function(a){
    var num=S.animals[a.id];
    if(num<=0) return;
    if(!S.anT[a.id]){ S.anT[a.id]=now+a.time*1000; return; }
    if(now<S.anT[a.id]) return;
    S.anT[a.id]=now+a.time*1000;
    if(angry) return;
    var have=S.store[a.feed]||0;
    /* 一头一次产几个：a.per 没写就是 1（牛是 2 —— 每次接两桶奶）。 */
    var made=Math.min(num*(a.per||1),have);
    if(made<=0) return;
    S.store[a.feed]-=made;
    S.store[a.out]=(S.store[a.out]||0)+made;
    S.seen[a.out]=1;
    changed=true;
    flyFromEl(anBox.querySelector('[data-a="'+a.id+'"]'), '+'+made+' '+byGood(a.out).n);
  });
  if(changed){ save(); paint(); }
},300);

/* ---------- 粑粑生成 ---------- */
setInterval(function(){
  var total=animalTotal();
  if(total<=0) return;
  var now=Date.now();
  if(!S.poopT){ S.poopT=now+12000; return; }
  if(now<S.poopT) return;
  S.poopT=now+12000;
  var made=0;
  for(var i=0;i<total;i++){ if(Math.random()<0.35) made++; }
  if(made<=0) return;
  addPoops(made);
  save(); paint();
},1000);

/* ---------- 工坊（2026-09-27 改成排队流水线） ----------
   旧做法：每条配方一个固定槽位，点了就自己计时，做好了点卡片收走，
           而且糖和面粉各有两个槽（2026-09-24 加的那组重复）。
   新做法（用户定的）：
     · 点一下卡片 = 把这一件【排进队伍】，材料当场扣掉
     · 队伍从前往后依次做，每一件固定 CRAFT_TIME 秒
     · 做完的进「待收取」（craftDone），可以堆很多个
     · 抽屉顶部一个「全部收取」按钮，一次把堆着的全收进仓库

   ⚠️ 材料为什么在「排队那一刻」就扣：
      不然玩家排了五个糖、中途把甘蔗卖光，队里做到第三个就卡住，
      玩家还以为是点错了。先扣掉最省事，账也最清楚。 */

/* 这道配方要哪些材料 —— 拼成「🎋×2」这样的说明文字 */
function craftCostText(c){
  var parts=[];
  if(c.multi){
    for(var k in c.multi){ var g=byGood(k); parts.push((g?g.n:'?')+'×'+c.multi[k]); }
  }else{
    var fg=byGood(c.from);
    parts.push((fg?fg.n:'?')+'×'+c.need);
  }
  return parts.join(' ');
}

/* 工坊卡片上的原料图标；提示文字仍使用 craftCostText()。 */
function craftCostIcons(c){
  var parts=[];
  if(c.multi){
    for(var k in c.multi){ var g=byGood(k); parts.push((g?itemIcon(g.id,g.e):'?')+'×'+c.multi[k]); }
  }else{
    var fg=byGood(c.from);
    parts.push((fg?itemIcon(fg.id,fg.e):'?')+'×'+c.need);
  }
  return parts.join(' ');
}

/* 材料够不够（只算，不扣） */
function craftCanMake(c){
  if(c.multi){
    for(var k in c.multi){ if((S.store[k]||0) < c.multi[k]) return false; }
    return true;
  }
  return (S.store[c.from]||0) >= c.need;
}

/* 扣材料（调用之前必须先 craftCanMake 通过） */
function craftTake(c){
  if(c.multi){ for(var k in c.multi){ S.store[k]=(S.store[k]||0)-c.multi[k]; } }
  else{ S.store[c.from]=(S.store[c.from]||0)-c.need; }
}

/* 点一下工坊卡片 = 排一件进队伍 */
function craft(i){
  var c=CRAFTS[i];
  if(!c) return;
  var og=byGood(c.out);
  if(!craftCanMake(c)){ toast('材料还不够哦：'+craftCostText(c)); return; }

  craftTake(c);
  var wasIdle = (S.craftQ.length===0);
  S.craftQ.push(i);
  if(wasIdle) S.craftQStart=Date.now();   /* 队伍本来空着 → 这一件立刻开工 */

  var ahead = S.craftQ.length-1;
  toast('已排进队伍：'+og.n+(ahead>0 ? '（前面还有 '+ahead+' 件）' : '，马上开工'));
  save(); paint();
}

/* 「全部收取」：把待收取里堆着的全收进仓库 */
function collectCraft(){
  if(!S.craftDone.length){ toast('还没有做好的东西哦'); return; }
  var parts=[], count=0;
  S.craftDone.forEach(function(id){
    var g=byGood(id);
    if(!g) return;
    S.store[id]=(S.store[id]||0)+1;
    S.seen[id]=1;
    count++;
    parts.push(g.n);
  });
  S.craftDone=[];
  toast('收到 '+count+' 件：'+parts.join('、'));
  save(); paint();
}

/* 有没有「做好了还没收」的东西 —— 给导航栏的小叹号用 */
function anyCraftReady(){ return S.craftDone.length>0; }

/* 队伍里排了几件同一个配方（给卡片右上角的角标用） */
function craftQueuedCount(i){
  var n=0;
  for(var q=0;q<S.craftQ.length;q++){ if(S.craftQ[q]===i) n++; }
  return n;
}

/* ---------- 工坊：计时推进（每半秒看一眼） ---------- */
setInterval(function(){
  if(!S.craftQ.length){ return; }

  var c=CRAFTS[S.craftQ[0]];
  if(!c){ S.craftQ.shift(); save(); paint(); return; }   /* 队伍里有个不存在的配方，踢掉 */
  if(!S.craftQStart){ S.craftQStart=Date.now(); save(); return; }

  if(Date.now() - S.craftQStart >= CRAFT_TIME*1000){
    var og=byGood(c.out);
    S.craftDone.push(c.out);
    S.craftQ.shift();
    S.craftQStart = S.craftQ.length ? Date.now() : 0;   /* 后面还有 → 接着做下一件 */
    save();
  toast('工坊做好了一件：'+(og?og.n:c.out));
    paint();
    return;
  }
  paint();   /* 还在做 → 每半秒重画一次，进度条才会动 */
},500);

/* ---------- 弹窗底层（overlay / panel） ----------
   注意：这套弹窗原来是和「做饭小游戏」一起写的。
   小游戏被删掉了，但弹窗本身还要用 ——
   金库、探险、导入导出、菜谱一览，全都靠它。 */
var overlay=$('overlay'), panel=$('panel');

/* ============================================================
   九宫格做菜（2026-09-22 全新）
   ------------------------------------------------------------
   玩法：把食材从上面的食材区拖进锅里摆好 → 点「提交」。
         摆得跟某一道菜的九宫格【一模一样】才做得出来（位置算数）；
         摆得不对 → 做出一份 ☠︎ 黑暗料理。

   有三件事已经在别处保证好了，这里只负责判定：
     · 食材放进去的瞬间就扣了库存（doDrop）
     · 成品格堵着的时候「提交」是灰的（paintKitchen）
     · 黑暗料理只能喂小京，而且不给饱食度（feedToBear）
   ============================================================ */

/* 拿锅里现在的 9 格去跟所有菜谱比对，返回做出来的那道菜；没对上返回 null。
   ⚠️ 必须跳过 noCook 的菜 —— 丸子串串的九宫格是全空的，
      不跳过的话「空锅提交」会直接刷出一份丸子串串。 */
function potMatch(){
  for(var i=0;i<DISHES.length;i++){
    var d=DISHES[i];
    if(d.noCook) continue;
    var r=RECIPES[d.id];
    if(!r) continue;
    var ok=true;
    for(var k=0;k<POT_N;k++){
      if((r[k]||'') !== (S.pot[k]||'')){ ok=false; break; }
    }
    if(ok) return d;
  }
  return null;
}

function submitPot(){
  /* 成品格还堵着 → 不许做下一道（用户原话：成品格「不可覆盖」） */
  if(S.potOut){ toast('先把成品处理掉，才能做下一道哦'); return; }

  var any=false;
  for(var i=0;i<POT_N;i++){ if(S.pot[i]) any=true; }
  if(!any){ toast('锅里空空的，先把食材拖进去'); return; }

  var got=potMatch();
  if(got){
    S.potOut={kind:'dish', id:got.id};
    S.seen[got.id]=1;                    /* 做成功过 → 以后才会出现在订单里 */
    sfx('cookOk');                       /* 上行三音"叮—咚—叮"：成了！ */
    dishNotice(got, got.n+' 做好啦！');
    toast('成功做出'+got.n+'，把它拖到左边要它的那个订单上吧');
  }else{
    S.potOut={kind:'dark'};
    sfx('cookBad');                      /* 下行二音"呜—呃"：砸了 */
    dishNotice(DARK_DISH, '这锅东西的颜色……有点不对劲……');
    toast('做成了 ☠︎ 黑暗料理，只能拖给熊头让小京吃掉');
  }

  /* 锅清空。食材在放进去的时候就已经扣掉了，这里不用再扣一次。 */
  for(var k=0;k<POT_N;k++) S.pot[k]=null;
  save(); paint();
}

/* ============================================================
   成品 / 手上的菜，往哪儿去（2026-09-24 大改）
   ------------------------------------------------------------
   现在有两种「手上拿着菜」的情况，共用同一套出口：
     p.kind === 'out'     锅里刚做好、正躺在成品格里的
     p.kind === 'bagdish' 从【厨房最下面那排菜肴 ui】拖出来的（背包里得有货）

   三条出口：
     ① 拖给熊头垃圾桶     → 喂小京
     ② 拖给订单槽         → 交货收钱
     ③ 拖给「🧸 小京」按钮 → 收进背包
   ============================================================ */

/* ① 拖给熊头垃圾桶 = 让小京吃它。

   ⚠️⚠️ 规则在 2026-09-24 收紧过一次，现在的版本是：
        熊头【只吃】小熊料理和黑暗料理。
        普通的菜拖上去 → 提示「小京才不要吃这个呢！」，而且什么都不消耗。
        用户原话："熊头只吃小熊料理和黑暗料理，其他的拖拽了没反应，
                  会提示小京才不要吃这个呢！"

   为什么黑暗料理不加饱食度：这是作者亲自抓出来的漏洞 ——
     往锅里随便丢一个食材提交就能刷出黑暗料理，
     要是加饱食度，玩家就能无限刷小京的饱食度。

   为什么普通菜连吃都不给吃：喂小京有专门的正规入口
     （抽屉里的投喂界面，只有小熊料理能喂）。
     熊头在这里的角色是「小京伸到厨房里的那张嘴」，不是垃圾桶 ——
     普通菜的出路是拖给「🧸 小京」按钮收进背包，再从背包拖给订单卖掉。 */
function feedToBear(p){
  if(!p) return;

  /* ---- 从成品格拖来的 ---- */
  if(p.kind==='out'){
    var out=S.potOut;
    if(!out) return;

    if(out.kind==='dark'){
      S.potOut=null;
      sfx('bearEat');                /* 小京吃黑暗料理：闷闷的"啊呜" */
      toast('小京把 ☠︎ 黑暗料理吞了下去，皱着脸说：“味道……很复杂。”');
      save(); paint();
      return;
    }

    var d=byDish(out.id);
    if(!d) return;
    if(d.bear){
      /* 小熊料理本来就是给小京的 —— 走和抽屉里投喂完全一样的逻辑 */
      S.potOut=null;
      sfx('bearEat');                /* 小京吃掉了 */
      eatDish(d);
      save(); paint();
      return;
    }
    toast('小京才不要吃这个呢！');
    return;
  }

  /* ---- 从背包抽屉拖来的 ---- */
  if(p.kind==='bagdish'){
    var d2=byDish(p.id);
    if(!d2) return;
    if((S.dish[d2.id]||0)<=0){ toast('背包里已经没有'+d2.n+'了'); return; }
    if(d2.bear){
      S.dish[d2.id]=(S.dish[d2.id]||0)-1;
      sfx('bearEat');                /* 小京吃掉了 */
      eatDish(d2);
      save(); paint();
      return;
    }
    toast('小京才不要吃这个呢！');
    return;
  }
}

/* ② 拖到订单槽 = 交货结算。
   对得上就付钱、这个槽自己换成下一道菜；对不上就什么都不发生。
   ⚠️ 两个来源都要支持：成品格里的（out）和厨房菜肴列表拖出来的（bagdish）。 */
function deliverToOrder(i, p){
  var o=S.orders[i];
  if(!o || !p) return;

  var d=null, fromOut=false;

  if(p.kind==='out'){
    var out=S.potOut;
    if(!out) return;
    if(out.kind!=='dish'){ toast('黑暗料理不能交订单哦'); return; }
    d=byDish(out.id);
    fromOut=true;
  }else if(p.kind==='bagdish'){
    d=byDish(p.id);
    if(!d) return;
    if((S.dish[d.id]||0)<=0){ toast('背包里已经没有'+d.n+'了'); return; }
  }else{
    return;
  }
  if(!d) return;

  if(d.id!==o.id){
    toast('这个订单要的不是它哦');
    return;
  }

  var gain=money(o.pay);
  S.coins+=gain;
  if(fromOut) S.potOut=null;                   /* 从成品格拿走 */
  else S.dish[d.id]=(S.dish[d.id]||0)-1;       /* 从背包里扣掉 */

  /* ⚠️ 2026-09-27 改：以前是「交付完立刻变成下一道菜」。
     现在用户要求："订单被提交后，不是马上刷新新订单，
                   而是 8~15 秒后刷新（取随机数）"。
     所以槽位先变成 null（显示 ❌、灰虚线、不接东西），
     计时器到点才补一道新菜（见下面「订单刷新」那一段）。 */
  S.orders[i]=null;
  S.orderT[i]=Date.now() + 8000 + Math.random()*7000;

  sfx('pay');                                  /* 钱的声音：收银机 + 一串金币落下 */
  toast('交付成功，+'+gain+' 🪙（过一会儿才来新订单）');
  save(); paint();
}

/* ---------- 订单刷新（2026-09-27 新增） ----------
   交付之后的槽会空着（null）+ 记一个 S.orderT[i]（什么时候刷新）。
   这里每半秒看一眼：到点了就补一道新菜，并且让那个槽「蹦一下」。

   ⚠️ 8~15 秒是用户定的区间（"8~15 秒后刷新（取随机数）"）。
      想改时长就改下面这两个数字，单位是毫秒。 */
var ORDER_WAIT_MIN = 8000, ORDER_WAIT_MAX = 15000;

setInterval(function(){
  var now=Date.now(), changed=false;

  for(var i=0;i<ORDER_SLOTS;i++){
    if(S.orders[i]) continue;          /* 这个槽已经有菜了 */
    if(!S.orderT[i]) continue;         /* 也没在冷却 */
    if(now < S.orderT[i]) continue;    /* 还没到点 */

    S.orders[i]=makeOrder();
    S.orderT[i]=0;
    changed=true;

    /* 新菜出现 → 那个格子蹦一下（放大 + 轻微摆动，然后回原样）。
       动画类 .pop 播完就摘掉，下次才能重新播。 */
    (function(idx){
      var el=orderEls[idx];
      if(!el) return;
      el.classList.remove('pop');
      void el.offsetWidth;             /* 强制浏览器先认一下「类被拿掉了」 */
      el.classList.add('pop');
      setTimeout(function(){ el.classList.remove('pop'); }, 700);
    })(i);
  }

  if(changed){ save(); paint(); }
},500);

/* ③ 拖到【菜肴列表】= 收进背包（菜肴仓库）。
   ⚠️ 2026-09-27 改：入口从「左侧 🧸 小京 按钮」换成了「厨房下面的菜肴列表」。
      用户原话："成品菜不要拖入小京了，取消拖入小京的操作和渲染，
               改成直接拖到菜肴列收入背包"。
      普通菜的出路就是这一条 —— 收进背包之后，再从背包拖给订单卖钱。 */
function storeToBag(p){
  if(!p) return;

  if(p.kind==='bagdish'){
    /* 它本来就在背包里，拖回背包当然什么都不用做 */
    toast('它本来就在包包里呀');
    return;
  }
  if(p.kind!=='out') return;

  var out=S.potOut;
  if(!out) return;
  if(out.kind!=='dish'){
    toast('黑暗料理进不了背包，拖给熊头让小京吃掉吧');
    return;
  }
  var d=byDish(out.id);
  if(!d) return;
  S.dish[d.id]=(S.dish[d.id]||0)+1;
  S.seen[d.id]=1;
  S.potOut=null;
  toast('小京先帮你把 '+d.n+' 放到包包里');
  save(); paint();
}

/* 点一下食材 icon（不是拖）。
   手机上光靠拖容易漏掉，所以点一下也给一个反馈。
   ⚠️ 不自动丢进锅：位置算数，自动塞进去的位置八成是错的，
      还不如让玩家自己拖到想去的那一格。 */
function tapPantry(id){
  if(Date.now()<dragBlock) return;   /* 刚拖完这一下，别把松手当点击 */
  if(haveMat(id)<=0){ toast('仓库里没有这个食材哦'); return; }
  var info=ingInfo(id);
  toast('把 '+info.n+' 拖进锅里吧');
}

/* 【已删除 · 2026-09-22】
   这里原本有三块东西，现在全没了：

   ① cook(i)                —— 点菜谱直接做菜：占一个灶台、扣材料、进入倒计时
   ② setInterval(...,150)   —— 灶台计时推进：到点了就把火候小游戏弹出来
   ③ deliver(i)             —— 点订单卡片交付（那时候一个订单要凑齐三样货）

   现在对应的是：
     · 做菜 = 摆好九宫格 + 点「提交」    → submitPot()      （在上面）
     · 交付 = 把成品拖到左边的订单槽      → deliverToOrder() （在上面）

   两件事都不再需要任何计时器 —— 用户明确要求「取消做菜时间」。 */

/* ---------- 金库 ---------- */
function openWallet(){
  panel.innerHTML='<div class="ttl">💎 金库</div>'+
    '<div class="hintline" style="margin:0 0 14px">现在有 🪙'+Math.floor(S.coins)+' 和 💎'+S.gems+'</div>'+
    '<button class="catb" id="wBuy" style="background:#8fd0e8;box-shadow:0 4px 0 #6fb4d0">用 10000 🪙 换 1 💎</button>'+
    '<button class="catb" id="wSell" style="margin-top:9px;background:#c9a9e0;box-shadow:0 4px 0 #ab8ac4">用 1 💎 换 10000 🪙</button>'+
    '<div class="hintline">点空白的地方关掉</div>';
  overlay.classList.add('on');
  $('wBuy').addEventListener('click',function(){
    if(S.coins<10000){ toast('金币还不够 10000 呢'); return; }
    S.coins-=10000; S.gems++;
    toast('换到 1 💎，亮闪闪的');
    save(); paint(); openWallet();
  });
  $('wSell').addEventListener('click',function(){
    if(S.gems<1){ toast('还没有钻石呀'); return; }
    S.gems--; S.coins+=10000;
    toast('钻石换回 10000 🪙');
    save(); paint(); openWallet();
  });
}

overlay.addEventListener('click',function(e){
  if(e.target!==overlay) return;
  overlay.classList.remove('on');
  panel.innerHTML='';
});

/* ---------- 按钮 ---------- */
$('sellall').addEventListener('click',function(){
  var got=0;
  GOODS.forEach(function(g){
    var n=S.store[g.id]||0;
    if(n>0){ got+=money(g.price)*n; S.store[g.id]=0; }
  });
  DISHES.forEach(function(d){
    var n=S.dish[d.id]||0;
    if(n>0){ got+=money(d.price)*n; S.dish[d.id]=0; }
  });
  if(got<=0){ toast('仓库是空的呀'); return; }
  S.coins+=got;
  toast('全卖掉啦，+'+got+' 🪙');
  save(); paint();
});

/* 【已删除 · 2026-09-22】「🍯 用 1 蜂蜜刷新订单」的按钮和它的监听都没了。
   用户原话：「蜂蜜不再可以刷新订单（直接取消那些代码和渲染）」。
   订单现在只会「交付之后自己换」。按钮的 HTML 也一起删了。 */

/* 「提交」按钮：把锅里摆好的东西做成菜 */
$('potGo').addEventListener('click', submitPot);
/* 工坊顶部的「全部收取」（2026-09-27 新增）：
   做好了堆在待收取里，点这一下把它们全收进仓库。 */
$('craftCollect').addEventListener('click', collectCraft);

/* 📖 菜谱：列出「已经成功做出来过」的菜（看 S.seen）。
   为什么不是全部菜谱：厨房页最下面已经把全部菜谱摊开了，
   这个按钮再做一次「全部」就重复了 ——
   所以它改成图鉴：记录你真正做成功过哪些。 */
$('recipeBtn').addEventListener('click', function(){
  var got=[];
  DISHES.forEach(function(d){ if(S.seen[d.id]) got.push(d); });

  var body;
  if(!got.length){
    body='<div style="font-size:13px;line-height:1.75;color:#7d6558;font-weight:700">'+
         '还一道菜都没做成过呢。<br><br>'+
         '去厨房，把食材拖进九宫格摆好，摆对了再点「提交」——<br>'+
         '每做成功一道，它就会记在这里。</div>';
  }else{
    body='<div style="font-size:12px;color:#b09a8d;font-weight:700;margin-bottom:8px">'+
         '已经做成功过 '+got.length+' / '+DISHES.length+' 道</div>'+
         '<div class="guideGrid">';
    got.forEach(function(d){
      body+='<div class="guideItem"><span class="e">'+itemIcon(d.id,d.e)+'</span>'+d.n+
            (d.bear?'<br><span style="font-size:10px;color:#e2789f">小熊料理</span>':'')+
            '</div>';
    });
    body+='</div>';
  }

  panel.innerHTML='<div class="ttl">📖 菜谱图鉴</div>'+body+
    '<button class="catb" id="recipeOk" style="margin-top:14px">知道啦</button>';
  overlay.classList.add('on');
  $('recipeOk').addEventListener('click', function(){
    overlay.classList.remove('on');
    panel.innerHTML='';
  });
});

/* ============================================================
   左侧导航栏 + 仓库抽屉
   ------------------------------------------------------------
   一张表管到底：一个标签 = 一个区块。
   以后要加新分类（比如厨房大改时的「已探索配方」），
   只要往 DRAWER_TABS 里加一行、并在 HTML 里加一个 .dsec 区块，
   不用碰任何层级、也不用再写一个 if。
   ============================================================ */
var DRAWER_TABS = [
  { cat:'crop',     label:'🌱 农作物',   sec:'goods' },
  { cat:'material', label:'🥩 特殊食材', sec:'goods' },
  { cat:'craft',    label:'🍬 工坊产品', sec:'goods' },
  { cat:'dish',     label:'🍲 菜肴',     sec:'dish'  },
  { cat:'souvenir', label:'⛄ 纪念品',   sec:'goods' }
];
var currentCat = 'crop';
var drawerTabEls = document.querySelectorAll('.dtab');
var drawerSecEls = document.querySelectorAll('.dsec');

/* 一件货物显示在抽屉的哪个标签下。
   就是它的 kind，一一对应 —— **里面一个 id 特判都没有了**。

   2026-09-21 清掉了两个 id 特判（都搬回数据里去了）：
     · 小雪人：以前靠 if(g.id==='snowman') 硬认成纪念品 → 数据里写 kind:'souvenir'
     · 饱嗝  ：以前靠 if(g.id==='burp')   硬认成特殊食材 → 数据里写 kind:'material' */
function goodsCatOf(g){
  if(g.kind === 'material') return 'material';
  if(g.kind === 'craft')    return 'craft';
  if(g.kind === 'souvenir') return 'souvenir';
  if(g.kind === 'crop')     return 'crop';

  /* 【遗留行为】kind 是 'animal' 的（牛奶 / 鸡蛋 / 巧克力）没有自己的标签，
     跟在"农作物"里 —— 这是原本就有的行为，原样保留。 */
  return 'crop';
}

function tabOf(cat){
  for(var i = 0; i < DRAWER_TABS.length; i++){
    if(DRAWER_TABS[i].cat === cat) return DRAWER_TABS[i];
  }
  return DRAWER_TABS[0];
}

function filterDrawer(cat){
  var tab = tabOf(cat);
  currentCat = tab.cat;

  /* 1) 标签高亮 */
  Array.prototype.forEach.call(drawerTabEls, function(b){
    b.classList.toggle('is-on', b.getAttribute('data-cat') === tab.cat);
  });

  /* 2) 只留下这个标签对应的区块 —— 标题和内容一起进出，
        所以不会再出现「空标题孤零零挂着」那种事 */
  Array.prototype.forEach.call(drawerSecEls, function(s){
    s.classList.toggle('is-hidden', s.getAttribute('data-sec') !== tab.sec);
  });

  /* 3) 物品仓库内部再按分类筛格子 */
  GOODS.forEach(function(g, i){
    var el = storeEls[i];
    if(!el) return;
    el.classList.toggle('is-hidden', tab.sec === 'goods' && goodsCatOf(g) !== tab.cat);
  });
}

/* ---------- 抽屉：一个抽屉，三个视图 ----------
     bag   = 背包（仓库分类）
     craft = 工坊
     bear  = 小京
   左侧导航栏点哪个按钮 → 抽屉就切到哪个视图。
   再点一次当前这个按钮 = 收起来。
   以后要加第四个视图，就是：加一个 rail-btn(data-view) + 加一个 .dview。 */
var currentView = 'bag';
var railViewBtns = document.querySelectorAll('.rail-btn[data-view]');
var drawerViews  = document.querySelectorAll('.dview');

function showView(view){
  currentView = view;
  Array.prototype.forEach.call(drawerViews, function(v){
    v.classList.toggle('is-hidden', v.getAttribute('data-view') !== view);
  });
}
function isDrawerOpen(){ return $('drawer').classList.contains('is-on'); }
function setDrawer(open){
  $('drawer').classList.toggle('is-on', open);
  $('drawerMask').classList.toggle('is-on', open);
  Array.prototype.forEach.call(railViewBtns, function(b){
    b.classList.toggle('is-on', open && b.getAttribute('data-view') === currentView);
  });
}
function goDrawer(view){
  if(isDrawerOpen() && currentView === view){ setDrawer(false); return; }
  showView(view);
  setDrawer(true);
}

Array.prototype.forEach.call(railViewBtns, function(b){
  b.addEventListener('click', function(){ goDrawer(b.getAttribute('data-view')); });
});
$('drawerMask').addEventListener('click', function(){ setDrawer(false); });

Array.prototype.forEach.call(drawerTabEls, function(btn){
  btn.addEventListener('click', function(){ filterDrawer(btn.getAttribute('data-cat')); });
});

// 默认显示农作物
filterDrawer('crop');

$('lootBtn').addEventListener('click', function(){
  if(!S.lootPending) return;
  panel.innerHTML='<div class="ttl">🧸 小京探险回来啦！</div>'+
    '<div style="font-size:42px;margin:10px 0">🧸</div>'+
    '<div style="font-size:13px;line-height:1.8;color:#7d6558;font-weight:700">'+
    '它带着满满一篮子东西跑回来了：<br><br>'+
    (S.lootSummary || '')+'<br><br>'+
    '小京蹭了蹭你的手，把篮子递给你，眼睛亮亮的。'+
    '</div>'+
    '<button class="catb" id="outOk" style="margin-top:14px">摸摸它</button>';
  overlay.classList.add('on');

  $('outOk').addEventListener('click', function(){
    overlay.classList.remove('on');
    panel.innerHTML='';
    S.lootPending = false;
    S.lootSummary = '';
    save(); paint();
  });
});

$('goOut').addEventListener('click', function(){
  if(S.expedition){
    toast('小京还在' + getSeasonName(S.expedition.season) + '探险中，等它回来再出发吧 🧸');
    return;
  }
  openOuting();
});


$('fertb').addEventListener('click',function(){
  if(S.dung<3){ toast('堆肥还不够，要攒够 3 坨呀'); return; }
  var n=0;
  S.plots.forEach(function(p){
    if(p.c && !isReady(p)){
      p.t=Date.now()-byId(p.c).grow*1000-1000;
      n++;
    }
  });
  if(n<=0){ toast('地里没有正在长的东西呀'); return; }
  S.dung-=3;
  sfx('fert');                    /* 倒东西的"沙沙沙"——把堆肥撒出去 */
  toast('哗——'+n+' 块地一下子全熟了');
  save(); paint();
});

$('gemsPill').addEventListener('click',openWallet);

$('auto').addEventListener('click',function(){
  S.auto = S.auto?0:1;
  save(); paint();
});

/* 顶部两个标签：农场 / 厨房
   （小京原本是顶部标签，已经搬进左侧抽屉；
     订单原本也是，2026-09-22 也搬走了 —— 变成左侧导航栏里的三个订单槽） */
function showPane(t){
  $('paneFarm').classList.toggle('hide', t!=='farm');
  $('paneKitchen').classList.toggle('hide', t!=='kitchen');
  $('tabFarm').classList.toggle('on', t==='farm');
  $('tabKitchen').classList.toggle('on', t==='kitchen');
}
$('tabFarm').addEventListener('click',function(){ showPane('farm'); });
$('tabKitchen').addEventListener('click',function(){ showPane('kitchen'); });

$('reset').addEventListener('click',function(){
  if(confirm('要把小农场清空重来吗？')){
    S=fresh();
    while(S.orders.length<ORDER_SLOTS) S.orders.push(makeOrder());
    while(S.orderT.length<ORDER_SLOTS) S.orderT.push(0);   /* 冷却时间戳也要补齐 */
    save();
    /* 缓存的「上次画成什么样」全部清空，免得新旧状态串味 */
    for(var i=0;i<N;i++) cellState[i]=null;
    bearNext=[];
    overlay.classList.remove('on'); panel.innerHTML='';
    paint();
  }
});

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ---------- 小熊自动收地 ---------- */
setInterval(function(){
  if(S.bears<=0) return;
  var now=Date.now();
  for(var k=0;k<S.bears;k++){
    if(!bearNext[k]){ bearNext[k]=now+BEAR_SPEED; continue; }
    if(now>=bearNext[k]){
      bearNext[k]=now+BEAR_SPEED;
      var idx=-1;
      for(var i=0;i<N;i++){ if(S.plots[i].u&&isReady(S.plots[i])){ idx=i; break; } }
      if(idx>=0) harvest(idx,true);
    }
  }
},100);

/* ---------- 小熊饱食度 / 自动捡粑粑 ---------- */
var lastAutoPick=0;
setInterval(function(){
  if(S.bears<=0) return;
  var now=Date.now();
  if(!S.fullT) S.fullT=now;
  var dt=now-S.fullT;
  S.fullT=now;
  var oldPct=Math.floor(S.full||0);
  if(now < S.bubbleBuffT){
    S.full = BEAR_FULL_MAX;
  } else if(dt>0 && S.full>0) {
    S.full=Math.max(0,S.full-dt/BEAR_FULL_DECAY);
  }
  if(Math.floor(S.full)!==oldPct) save();

  if(S.full>=BEAR_FULL_OK && S.poops.length>0 && now-lastAutoPick>900){
    lastAutoPick=now;
    collectPoop(S.poops[0], true);   /* true = 小京自动捡，不出声 */
    return;
  }
    if(S.expedition && Date.now() >= S.expedition.endTime){
    finishExpedition();
  }
  paintBear();
},1000);

$('exportSave').addEventListener('click', function(){
  var data = JSON.stringify(S);
  panel.innerHTML = '<div class="ttl">📤 导出存档</div>'+
    '<textarea id="saveData" readonly style="width:100%;height:150px;font-size:12px;border-radius:12px;border:1px solid #f2dfd4;padding:8px;box-sizing:border-box;resize:none;"></textarea>'+
    '<div class="hintline">长按全选复制，或者点下面的按钮复制</div>'+
    '<button class="catb" id="copySave" style="margin-top:9px">复制存档</button>'+
    '<div class="hintline">点空白关闭</div>';
  overlay.classList.add('on');
  var ta = $('saveData');
  ta.value = data;
  ta.addEventListener('click', function(){ ta.select(); });
  $('copySave').addEventListener('click', function(){
    ta.select();
    try{
      document.execCommand('copy');
      toast('已复制存档，快去粘贴保存吧');
    }catch(e){
      toast('复制失败，请长按全选复制');
    }
  });
});

$('importSave').addEventListener('click', function(){
  panel.innerHTML = '<div class="ttl">📥 导入存档</div>'+
    '<textarea id="importData" placeholder="把导出的存档字符串粘贴到这里" style="width:100%;height:150px;font-size:12px;border-radius:12px;border:1px solid #f2dfd4;padding:8px;box-sizing:border-box;resize:none;"></textarea>'+
    '<button class="catb" id="doImport" style="margin-top:9px">确认导入</button>'+
    '<div class="hintline">导入会覆盖当前进度，请谨慎操作</div>';
  overlay.classList.add('on');
  $('doImport').addEventListener('click', function(){
    var txt = $('importData').value.trim();
    if(!txt){ toast('还没粘贴存档呢'); return; }
    try{
      var obj = JSON.parse(txt);
      if(!obj || typeof obj !== 'object' || !obj.plots){ toast('存档格式不对，请检查'); return; }
      localStorage.setItem(KEY, JSON.stringify(obj));
      toast('导入成功，正在重新加载...');
      setTimeout(function(){ location.reload(); }, 600);
    }catch(e){
      toast('解析失败，存档内容有误');
    }
  });
});

paint();
</script>
