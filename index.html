<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2a0bd">
<link rel="apple-touch-icon" href="icon.png">
<title>小熊小农场</title>
<style>
/* ============================================================
   小熊小农场 · 样式表
   ------------------------------------------------------------
   分区：
     1. 设计变量（颜色 + 层级表）
     2. 基础
     3. 通用组件
     4. 页面：农场 / 厨房 / 订单 / 小京
     5. 左侧导航栏 rail + 仓库抽屉 drawer
     6. 弹窗 · 飘字 · 提示条
     7. 拖拽与投放区
   ============================================================ */

/* ---------- 1. 设计变量 ---------- */
:root{
  /* 颜色 */
  --pink:     #f2a0bd;
  --pink-d:   #dd89a8;
  --rose:     #e2789f;
  --rose-l:   #f7c8dc;
  --ink:      #6b5145;
  --ink-2:    #7d6558;
  --ink-3:    #b09a8d;
  --ink-4:    #bda99c;
  --line:     #f2dfd4;
  --green:    #b6d99a;
  --green-d:  #9bc47e;
  --purple:   #c9a9e0;
  --purple-d: #ab8ac4;
  --blue:     #8fd0e8;
  --blue-d:   #6fb4d0;

  /* 层级表 —— 全文只有这里写 z-index 的数字，别处一律用 var()。
     从下往上一层压一层，谁该盖谁一读就懂，不用再去猜数字。 */
  --z-float:  20;   /* 飘字、场景内的浮动元素 */
  --z-mask:   40;   /* 抽屉遮罩 */
  --z-drawer: 50;   /* 抽屉本体 */
  --z-rail:   60;   /* 左侧导航栏：必须高于遮罩，按钮才永远点得到 */
  --z-pop:    65;   /* 右上角料理提示 */
  --z-modal:  70;   /* 弹窗 */
  --z-toast:  80;   /* 底部提示条 */
  --z-drag:   90;   /* 拖拽替身，跟手 */
  /* 【2026-09-22】层级表之外那档「特权 999」已经取消。
     它原本只给 #bearTrash 用，但那个写法是错的
     —— 熊头垃圾桶会浮在抽屉、遮罩、弹窗等一切面板之上，
        走到哪个页面都甩不掉它，对一个只在厨房用得到的东西毫无道理。
     现在全文 z-index 一律走上面这张表，一个例外都没有。
     （拖拽靠 elementFromPoint 找投放区，本来就不需要靠层级分胜负。） */

  /* 尺寸 */
  --rail-w: 58px;   /* 左侧导航栏宽度 —— 抽屉的起点就是它 */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:14px 12px 46px calc(var(--rail-w) + 4px);min-height:100vh;
  background:linear-gradient(180deg,#ffeef6 0%,#fdf4e6 55%,#e9f7e4 100%);
  background-attachment:fixed;
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#6b5145;display:flex;justify-content:center}
.wrap{width:100%;max-width:500px}
h1{font-size:19px;text-align:center;margin:4px 0 3px;color:#c96a8c;letter-spacing:2px}
.sub{text-align:center;font-size:12px;color:#bb9c8f;margin-bottom:12px}
.bar{display:flex;gap:6px;margin-bottom:8px}
.pill{flex:1;background:#fff;border-radius:18px;padding:8px 2px;text-align:center;
  font-size:13px;font-weight:700;box-shadow:0 4px 0 #f2dfd4;white-space:nowrap}
.pill.tap{cursor:pointer}
.pill.tap:active{transform:translateY(2px)}
/* 农场页里的两行小提示。
   【2026-09-24 拆开】原来这两行挤在页面顶部的货币栏下面，白占地方。
   用户要求拆开、各去各该在的位置：

     .buff     = 「×N 让卖出去的东西多赚 X%」
                 → 挂在农场页「小京的朋友」按钮下面
     .poopWarn = 「地上有 X 坨💩……」
                 → 挂在农场页田地下面、种子上面（只有点农场才看得到）

   ⚠️ 为什么「地上有💩」不能安安静静待在角落：
      粑粑攒够 6 坨，动物就全体罢工。光靠一行小字，玩家可能半小时都没发现
      —— 所以现在【顶部「🌱 农场」标签上还会亮一个小叹号】（见 .tab 那段）。 */
.buff{text-align:center;font-size:12px;font-weight:700;color:#c98aa4;margin:9px 0 0;
  min-height:16px;line-height:1.5}
/* ⚠️ 这个【故意不写 min-height】——
   没粑粑的时候它要完全不占地方（JS 会直接 display:none）。 */
.poopWarn{text-align:center;font-size:12px;font-weight:700;color:#d0885f;
  margin:0 0 9px;line-height:1.5}
.poopWarn.bad{color:#d06060}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:7px}
.row.dish{grid-template-columns:repeat(4,1fr);margin-bottom:8px}
.slot{background:#fff;border-radius:13px;padding:7px 2px;text-align:center;
  box-shadow:0 3px 0 #f2dfd4;font-size:15px;font-weight:700;color:#7d6558;line-height:1.15}
.slot .n{font-size:11px;margin-left:2px;color:#b09a8d}
.slot.zero{opacity:.35}
.slot.d{background:#fffbf0}
.sellall{width:100%;border:0;border-radius:15px;padding:10px;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;background:#fff6e5;color:#c2913f;box-shadow:0 4px 0 #f3e6cd;
  margin-bottom:12px}
.sellall:disabled{opacity:.45;cursor:default}
.sellall:active:not(:disabled){transform:translateY(2px)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
/* ⚠️ `position:relative` 是给右上角的小叹号（.rail-badge）当定位基准的。
   现在「🌱 农场」标签上挂着「粑粑够多、动物要罢工」的叹号。
   为什么非要有这个叹号：那行「地上有 X 坨💩」的小字在农场页里，
   玩家不点农场就看不见 —— 而粑粑攒够 6 坨动物就罢工了，
   等他自己发现可能已经过去半小时。（用户原话） */
.tab{position:relative;flex:1;border:0;border-radius:14px;padding:10px 2px;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:800;background:#fff;color:#bda99c;
  box-shadow:0 4px 0 #f2dfd4;white-space:nowrap}
.tab.on{background:#f2a0bd;color:#fff;box-shadow:0 4px 0 #dd89a8}
.tab:active{transform:translateY(2px)}
.hide{display:none}
.secttl{font-size:12px;font-weight:800;color:#bda99c;margin:6px 0 7px;letter-spacing:1px}
.field{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.plot{position:relative;aspect-ratio:1/1;border:0;border-radius:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;
  background:#e4d3ba;box-shadow:inset 0 -6px 0 rgba(0,0,0,.07);overflow:hidden;
  transition:transform .12s ease;padding:0;color:#8d7565}
.plot:active{transform:scale(.94)}
.plot.empty{color:#c4ae95;font-size:26px}
.plot.growing{background:#d3e9bd}
.plot.ready{background:#ffefae}
.plot.ready .em{display:block;animation:bob .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.plot.locked{background:#efe7dc;color:#b6a498;font-size:11px;font-weight:700;
  flex-direction:column;gap:3px}
.plot .poop{position:absolute;right:1px;bottom:1px;font-size:19px;line-height:1;z-index:2;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.prog{position:absolute;left:9px;right:9px;bottom:7px;height:6px;border-radius:8px;
  background:rgba(255,255,255,.75);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:8px;
  background:linear-gradient(90deg,#9ada6f,#6cc3a0);transition:width .15s linear}
.seeds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.seed{border:0;cursor:pointer;border-radius:16px;padding:9px 8px;background:#fff;
  box-shadow:0 4px 0 #f2dfd4;font-family:inherit;color:#6b5145;display:flex;
  align-items:center;gap:7px;text-align:left;transition:transform .12s}
.seed:active{transform:translateY(2px);box-shadow:0 2px 0 #f2dfd4}
.seed .e{font-size:21px;flex:none}
.seed .info{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.seed .n{font-size:13px;font-weight:700}
.seed .p{font-size:11px;color:#b09a8d}
.seed.on{background:#fff0f6;box-shadow:0 0 0 3px #f7c8dc,0 4px 0 #f2dfd4}
.seed.poor{opacity:.45}
.seed.recipe{background:#fffaf1}
.crafts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
/* ============================================================
   4.5 厨房 · 九宫格锅（2026-09-22 新增）
   ------------------------------------------------------------
   这里原来是三口灶台 + 火候小游戏，已经整块删掉
   （用户要求：「取消三个灶台，取消做菜时间」）。
   现在的厨房从上到下是四层：
     ① 🧺 食材区   —— 只有 icon，拖进锅
     ② 🔥 九宫格锅 —— 靠左；右边是「当前选的菜」+「菜谱缩略图」
     ③ 提交行      —— 成品格（左）· 提交（中）· 熊头垃圾桶（右）
     ④ 📖 菜肴列表 —— 每行 3 个，点一下选中
   ============================================================ */

/* 食材区：**只有 icon，没有名字也没有数量** —— 格子太小放不下字。
   有没有货靠「灰不灰」区分，不靠数字。 */
.pantry{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
/* ⚠️ 下面这些「要被拖着走的东西」，必须关掉浏览器的默认触摸手势。
   不关的话，手指一滑页面就先滚起来了，浏览器会直接把这次拖动 cancel 掉，
   表现就是「拖到一半突然松手」。

   现在的名单是：食材区 / 锅格子 / 成品格 / 菜肴列表。
   —— 菜肴列表是 2026-09-24 加进来的（它现在也是拖拽源，能直接把菜拖给订单）。

   代价：在这几片方块【上面】滑动不能滚页面 ——
   方块之间有 6~7px 的缝，想滚页面从缝里滑、或者从别的地方滑都行。 */
.pantryItem,.potCell,.outSlot,.dishBtn{touch-action:none}
.pantryItem{border:0;cursor:pointer;border-radius:13px;aspect-ratio:1/1;padding:0;
  background:#fff;box-shadow:0 3px 0 #f2dfd4;font-size:22px;line-height:1;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,box-shadow .12s,opacity .12s}
.pantryItem:active{transform:translateY(2px);box-shadow:0 1px 0 #f2dfd4}
.pantryItem.zero{opacity:.3}   /* 仓库里没有这个食材 → 变灰 */

/* 锅 + 左边那一栏。
   ⚠️ 2026-09-24 左右镜像翻转过：以前是【锅在左、提示在右】，
      现在是【提示在左、锅在右】。用户原话：
      "改成九宫格放在右侧，缩略图和菜肴的名字放在左侧。
       （因为游玩的时候一般都是用右手大拇指来玩，
        缩略图放在右侧的话，来回就会被遮到，看不清楚）"
      所以 DOM 顺序是 [potSide][pot]：左边提示、右边锅。 */
.potWrap{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.pot{flex:none;width:66%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:10px;border-radius:24px;background:#fff;
  box-shadow:0 5px 0 #f2dfd4,0 0 0 3px #ffeef5 inset}
.potCell{border:0;padding:0;aspect-ratio:1/1;border-radius:14px;background:#fdf6ef;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.05);font-size:24px;line-height:1;color:#c4ae95;
  font-family:inherit;display:flex;align-items:center;justify-content:center;
  transition:transform .12s,background .12s}
.potCell.has{background:#fff0f6;box-shadow:inset 0 -3px 0 rgba(226,120,159,.15)}
.potSide{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}

/* 左上那一格：菜谱缩略图（2026-09-24 挪到左边，而且挪到名字【上面】了）。
   故意做得很小 —— 用户原话：「大小要小，不要把九宫格挤没了」。
   为什么放上面：用户说「缩略图靠近食材的话，肉眼会比较舒服，比较好对照」。 */
.potRef{background:#fff;border-radius:16px;padding:7px;box-shadow:0 4px 0 #f2dfd4}
.potRef .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.potRef .mini i{aspect-ratio:1/1;border-radius:7px;background:#fdf6ef;font-style:normal;
  font-size:13px;line-height:1;color:#c4ae95;
  display:flex;align-items:center;justify-content:center}

/* 左下那一格：当前选中的菜（icon + 名字）。
   （2026-09-24 之前它在右上，现在挪到左边、并且在缩略图【下面】。） */
.potPick{background:#fff;border-radius:16px;padding:8px 5px;text-align:center;
  box-shadow:0 4px 0 #f2dfd4;font-size:11px;font-weight:800;color:#7d6558;line-height:1.25}
.potPick .pe{display:block;font-size:26px;line-height:1.1;margin-bottom:2px}
.potPick.empty{color:#c4ae95;font-weight:700}

/* 提交行：成品格（左）· 提交（中）· 熊头垃圾桶（右）。

   ⚠️ 2026-09-24 改成【铺满整行】。以前它只有锅那么宽（66%），右边空出一大片。
      用户原话："这个提交的按钮太短了，导致有一侧空的地方太多不好看，
                我希望这个提交的按钮足够长，让侧边不要有空位。"
      所以宽度从 66% 改成 100%（跟上面「提示栏 + 锅」加起来一样宽），
      提交按钮 flex:1 把中间那一大段全吃掉。 */
.potBar{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:16px}
/* 成品格：提交之前是空的（留空），提交之后才出现东西。
   ⚠️ 它有东西的时候【不许被下一道菜覆盖】——
      所以「提交」按钮这时候是灰的，必须先把它处理掉。 */
.outSlot{flex:none;width:52px;height:52px;border-radius:16px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;
  box-shadow:0 4px 0 #f2dfd4,0 0 0 2px #f7c8dc inset;transition:transform .15s}
.outSlot.empty{font-size:20px;color:#e4d3ba;box-shadow:0 4px 0 #f2dfd4}
.potGo{flex:1;border:0;border-radius:16px;padding:15px 4px;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:800;color:#fff;background:#f2a0bd;box-shadow:0 4px 0 #dd89a8}
.potGo:disabled{opacity:.45;cursor:default}
.potGo:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #dd89a8}

/* 菜肴列表：每行 5 个，**只有 icon，没有名字**（用户 2026-09-24 要求）。

   两种高亮，含义不一样，别搞混：
     .have —— 背包里【有】这道菜 → 粉色底。
              用户原话："如果背包里面有这道菜，那么这个菜肴的渲染框就是粉色的。
                        我们不应该让不存在于背包的菜是灰色的，
                        因为其实大部分菜背包里都不会有存货的，就很不好看。"
     .on   —— 当前【选中】的是这道菜 → 粉色粗描边。
   两个可以叠加：选中 + 有货 = 粉底 + 粉边。 */
.recipes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.dishBtn{border:0;cursor:pointer;border-radius:14px;padding:0;aspect-ratio:1/1;
  background:#fff;box-shadow:0 3px 0 #f2dfd4;font-family:inherit;font-size:24px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,box-shadow .12s,background .12s}
.dishBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #f2dfd4}
.dishBtn.have{background:#fff0f6}
.dishBtn.on{box-shadow:0 0 0 3px #f7c8dc,0 3px 0 #f2dfd4}

/* 「📖 菜谱图鉴」弹窗里的小格子（点左侧「📖 菜谱」按钮弹出来的那个）。
   为什么要单独一套：厨房那片菜肴列表现在是「只有 icon、每行 5 个」，
   而图鉴是给玩家看的记录 —— 光有 emoji 认不出是什么，所以它保留名字。 */
.guideGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  max-height:300px;overflow-y:auto}
.guideItem{background:#fffbf0;border-radius:14px;padding:8px 4px;text-align:center;
  box-shadow:0 3px 0 #f2dfd4;font-size:11px;font-weight:700;color:#7d6558;line-height:1.25}
.guideItem .e{display:block;font-size:24px;line-height:1.1;margin-bottom:3px}
.anbox{display:flex;flex-direction:column;gap:6px;margin-bottom:9px}
.anrow{background:#fff;border-radius:14px;padding:9px 11px;font-size:12px;font-weight:700;
  color:#7d6558;box-shadow:0 3px 0 #f2dfd4;line-height:1.45}
.anrow.bad{background:#fff2f2;color:#c97070;box-shadow:0 3px 0 #f6dede}
.anrow .em{font-size:16px;margin-right:3px}
.buyb{width:100%;border:0;border-radius:16px;padding:10px 12px;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;background:#fff;color:#6b5145;box-shadow:0 4px 0 #f2dfd4;
  margin-bottom:7px;display:flex;align-items:center;gap:8px;text-align:left}
.buyb:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #f2dfd4}
.buyb:disabled{opacity:.45}
.buyb .be{font-size:19px}
.buyb .bn{flex:1}
.buyb .bp{color:#c2913f;white-space:nowrap}
.catb{width:100%;border:0;border-radius:18px;padding:12px;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:700;color:#fff;background:#f2a0bd;box-shadow:0 4px 0 #dd89a8}
.catb:disabled{opacity:.45;cursor:default}
.catb:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #dd89a8}
.toggle{width:100%;margin-top:9px;border:0;border-radius:18px;padding:11px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:700;background:#fff;color:#b09a8d;
  box-shadow:0 4px 0 #f2dfd4}
.toggle.on{background:#eefaf0;color:#5aa06f;box-shadow:0 4px 0 #d6eedd}
.toggle:active{transform:translateY(2px)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  font-size:12px;color:#bda99c;gap:10px}
.foot button{border:0;background:none;font-family:inherit;font-size:12px;color:#bda99c;
  text-decoration:underline;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(107,81,69,.45);display:none;
  align-items:center;justify-content:center;z-index:var(--z-modal);padding:18px}
.overlay.on{display:flex}
.panel{background:#fff;border-radius:26px;padding:18px;width:100%;max-width:330px;
  box-shadow:0 10px 0 rgba(0,0,0,.08);text-align:center}
.panel .ttl{font-size:15px;font-weight:800;color:#c96a8c;margin-bottom:12px;line-height:1.4}
.panel .big{font-size:24px}
.panel .hintline{font-size:12px;color:#b09a8d;margin-top:10px}
/* 【已删除 · 2026-09-22】火候小游戏的两个控件本来在这里：
     .gbar  —— 横条 + 指针，指针进绿区时点一下
     .gline —— 九宫格划点，按 1→2→3→4 划过去
   灶台取消之后它们没有载体了，CSS 连同 JS 里的
   genPts / triggerEvent / buildEventUI / checkHit / hitPoint /
   needlePos / endEvent / rafLoop 一起删掉（总纲第 6 条：删干净）。
   —— 以后想复活火候玩法，记得连上面这些一起重写，别只加回 CSS。 */
.pop{position:fixed;transform:translate(-50%,0);font-size:15px;font-weight:800;
  color:#e2789f;pointer-events:none;animation:fly 1s ease-out forwards;
  text-shadow:0 1px 0 #fff;z-index:var(--z-float)}
@keyframes fly{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}
  25%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px) scale(1.06)}}
.catfly{position:fixed;transform:translate(-50%,-50%);font-size:22px;pointer-events:none;
  z-index:var(--z-float);animation:catpop .7s ease-out forwards}
@keyframes catpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  40%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}
  100%{opacity:0;transform:translate(-50%,-95%) scale(1)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:rgba(107,81,69,.92);color:#fff;font-size:13px;padding:9px 16px;
  border-radius:16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:var(--z-toast);
  max-width:86%;text-align:center}
.toast.on{opacity:1}
/* 🗑️ 垃圾桶（💩 的投放区）
   ------------------------------------------------------------
   【2026-09-24 第二次搬家】它原来固定在屏幕右下角，
   结果把农场页下半部分的按钮盖得死死的 ——
   用户截图里「小京的朋友已经够多了」和「小京顺手替你补种」两个按钮都被它压住。

   现在它住进左侧导航栏，位置在【订单槽上面、那条粉色小横线的上方】——
   那一竖条本来就是空的，放这儿不挡任何东西。
   代价：导航栏只有 58px 宽，所以它从 62px 缩到了 46px。 */
#trash{
  pointer-events: auto;
  flex: none;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 4px 0 #f2dfd4, 0 0 0 3px #ffeef5 inset;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  line-height: 1;
  transition: transform .15s;
}
/* ⚠️ 🗑️ 是圆的，通用那圈方形 outline 套上去很难看 ——
   所以它不用 outline 提示，只用「放大」来告诉玩家「松手就丢这儿」。 */
#trash.drop-hot{outline:none}
#trash.drop-over{outline:none;transform:scale(1.18)}
/* 【已删除 · 2026-09-24】#trashTip（"拖到这"那行小字）。
   垃圾桶搬进导航栏之后，那里只有 46px 宽，塞不下字；
   而且桶本身就是一个明确的投放区，不需要额外标注了。 */
/* 拖拽替身：跟着手指跑的那个 icon。
   名字从 .poopGhost 改成 .dragGhost —— 现在三种东西（💩 / 食材 / 成品）
   共用同一套拖拽骨架，不再只是粑粑了。 */
.dragGhost{position:fixed;transform:translate(-50%,-50%);font-size:30px;
  pointer-events:none;z-index:var(--z-drag);filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}

/* ---------- 投放区的高亮 ----------
   每个能接东西的元素都带一个 data-drop 属性（见 JS 的「统一拖拽骨架」）。
   拖动一开始，凡是「接得住你手上这个东西」的投放区都会亮起粉圈，
   告诉你该往哪儿拖；手指悬上去时颜色加深、轻微放大。
   用 outline 而不是 box-shadow —— 不覆盖各元素自己的那层「下沿厚投影」。 */
[data-drop].drop-hot{outline:3px solid #f7c8dc;outline-offset:2px}
[data-drop].drop-over{outline:3px solid #e2789f;outline-offset:3px;transform:scale(1.08)}
/* 小熊投喂页 */
.fullWrap{background:#fff;border-radius:20px;padding:14px 14px 12px;box-shadow:0 4px 0 #f2dfd4;
  margin-bottom:14px;text-align:center}
.bearBig{font-size:54px;line-height:1;margin:2px 0 12px;display:inline-block;
  transition:transform .2s}
.bearBig.happy{animation:bearbob 1.2s ease-in-out infinite}
@keyframes bearbob{0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-6px) scale(1.07)}}
.fullBar{height:20px;border-radius:10px;background:#f6ead9;overflow:hidden;margin-bottom:9px}
.fullBar i{display:block;height:100%;width:0;border-radius:10px;
  background:linear-gradient(90deg,#ffd88a,#f2a0bd);transition:width .4s ease}
.fullTxt{font-size:12px;font-weight:700;color:#b09a8d;line-height:1.55}
/* 【已删除 · 2026-09-22】订单页那一整片样式本来在这里：
     .ordersFull / .orderCard / .orderItems / .orderItem / .orderBottom
   它们伺候的是「一个订单凑三样货」的旧订单卡片。
   订单大改之后（只剩一道菜、只显示 icon、搬进左侧导航栏），
   这些类名一个都不再有元素挂着了，所以连样式一起删干净。
   新订单槽的样式在「5. 左侧导航栏」那一段里，类名是 .oslot。 */
.dishPop{position:fixed;top:12px;right:12px;background:#fff;border-radius:16px;
  padding:10px 14px;box-shadow:0 6px 0 #f2dfd4,0 0 0 3px #fff0f6 inset;
  font-size:13px;font-weight:700;color:#6b5145;z-index:var(--z-pop);opacity:0;
  transform:translateX(20px);transition:opacity .3s,transform .3s;pointer-events:none;
  display:flex;align-items:center;gap:8px;max-width:78%;line-height:1.4}
.dishPop.on{opacity:1;transform:translateX(0)}
.dishPop .de{font-size:22px;flex:none}
/* ============================================================
   5. 左侧导航栏 rail + 仓库抽屉 drawer
   ------------------------------------------------------------
   核心设计：【不重叠】
     · rail 贴屏幕最左，永远可见、永远可点
     · drawer 从 rail 的右边展开，两者在空间上完全不重叠
     · 所以它们之间不需要靠 z-index 分胜负 ——
       层级只用来处理「和遮罩的关系」
   好处：以后再加新按钮，只要往 rail 里加一个，
        不用动任何层级，也不会遮住任何东西。
   ============================================================ */

.rail{
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--rail-w);
  padding: 12px 0;
  display: flex;
  flex-direction: column;   /* 竖排是定案：横排放在上方会把顶栏挤爆 */
  align-items: center;
  gap: 8px;
  z-index: var(--z-rail);
  pointer-events: none;     /* 栏内空白可以点穿，方便点遮罩关抽屉 */
}
.rail-btn{
  pointer-events: auto;
  flex: none;
  position: relative;       /* 给右上角的小叹号当定位基准 */
  width: 50px;
  height: 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border: 0;
  border-radius: 17px;
  font-family: inherit;
  font-size: 18px;
  line-height: 1;
  color: #fff;
  background: var(--pink);
  box-shadow: 0 4px 0 var(--pink-d);
  cursor: pointer;
  transition: transform .12s ease;
}
.rail-btn .lb{ font-size: 9px; font-weight: 800; letter-spacing: .5px; }
.rail-btn:active{ transform: translateY(2px); box-shadow: 0 2px 0 var(--pink-d); }
.rail-btn.is-on{ background: #fff; color: var(--pink); box-shadow: 0 4px 0 var(--line); }

/* 导航栏按钮右上角的小叹号：有东西等着你处理时才出现。
   现在用在「工坊加工好了没收」和「小京探险回来了」两处。 */
.rail-badge{
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 17px;
  height: 17px;
  border-radius: 9px;
  background: var(--rose);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  line-height: 17px;
  text-align: center;
  box-shadow: 0 0 0 2px #fff;
  display: none;
}
.rail-badge.is-on{ display: block; }

/* ---------- 订单槽：长在导航栏里，但它【不是按钮】 ----------
   用户原话：「订单抽屉其实是根本打不开的……它只是位置在左侧抽屉区而已，
             但它其实根本不是一个抽屉。」
   所以它长得跟上面的按钮**故意不一样**：
     按钮    = 实心粉底、有文字、点得开抽屉
     订单槽  = 奶油底 + 粉色虚线框、里面只有一个菜肴 icon、点不开任何东西
   一眼就能看出「这里是可以放东西的地方」，而不是「这里可以点」。

   五个槽各自独立：把对应的成品（或者背包里的菜）拖上来就结算付钱，
   然后它自己变成下一道菜。
   ⚠️ 槽的个数由 ORDER_SLOTS 决定，2026-09-24 从 3 个加到了 5 个。
   （后期可以在槽下面加进度条、时间条、叹号 —— 留了位置。） */
.rail-orders{
  margin-top: auto;        /* 推到导航栏底部，和上面那排按钮分家 */
  margin-bottom: 18px;
  padding-top: 12px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 7px;
  flex: none;              /* 屏幕矮的时候不许被压扁 —— 它是投放区，扁了就拖不准 */
}
/* 一条粉色小横线，把「按钮区」和「订单区」隔开 */
.rail-orders::before{
  content: '';
  position: absolute;
  top: 0; left: 6px; right: 6px;
  height: 2px;
  border-radius: 2px;
  background: #f7c8dc;
}
.oslot{
  pointer-events: auto;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  border: 2px dashed #f7c8dc;
  background: #fffaf1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  line-height: 1;
  transition: transform .15s;
}

/* 订单区的小标题。
   为什么非要加它（用户原话）：
     "否则其实玩家根本不知道这五个莫名其妙的图案是做什么用的"
   —— 5 个槽里只显示一个菜肴 emoji，没有文字的话谁也猜不到那是订单。
   要求：**就一行小字，不要加背景块**（比底色更浅、更轻）。 */
.rail-note{
  font-size: 9px;
  font-weight: 800;
  color: #c4ae95;
  text-align: center;
  letter-spacing: 1px;
  line-height: 1;
  margin-bottom: 2px;
}

/* ---------- 工坊：加工中的进度条 + 做好待收 ---------- */
.seed .cprog{
  display: block;
  height: 5px;
  border-radius: 4px;
  background: #f2dfd4;
  overflow: hidden;
  margin-top: 4px;
}
.seed .cprog i{
  display: block;
  height: 100%;
  width: 0;
  border-radius: 4px;
  background: linear-gradient(90deg,#9ada6f,#6cc3a0);
  transition: width .45s linear;
}
.seed.working{ background: #fffaf1; }
.seed.done{
  background: #eefaf0;
  box-shadow: 0 0 0 3px #bfe6a4, 0 4px 0 #d6eedd;
  animation: doneBob 1s ease-in-out infinite;
}
@keyframes doneBob{ 0%,100%{ transform: translateY(0) } 50%{ transform: translateY(-3px) } }

.drawerMask{
  position: fixed;
  inset: 0;
  background: rgba(107,81,69,.4);
  z-index: var(--z-mask);
  display: none;
}
.drawerMask.is-on{ display: block; }

.drawer{
  position: fixed;
  left: var(--rail-w);      /* 从导航栏右边开始 —— 绝不覆盖按钮 */
  top: 0;
  bottom: 0;
  right: 0;                 /* 铺满手机（用户要求：展开后可以沾满手机） */
  max-width: 420px;         /* 但桌面端别拉成一整条，太难看 */
  background: #fffefb;
  border-radius: 0 22px 22px 0;
  box-shadow: 4px 0 20px rgba(107,81,69,.15);
  z-index: var(--z-drawer);
  /* 收起时往左滑走：自身宽度 + 导航栏宽度，才算完全出屏。
     不能只写百分比 —— 抽屉宽度是 min(62vw,290px)，
     写死百分比会在窄屏上露出一条边。 */
  transform: translateX(calc(-100% - var(--rail-w) - 8px));
  transition: transform .28s ease;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px 20px;
}
.drawer.is-on{ transform: translateX(0); }

/* 抽屉里的分类标签 */
.drawer-tabs{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.dtab{
  border: 0;
  background: #fff;
  color: var(--ink-4);
  border-radius: 12px;
  padding: 6px 11px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  box-shadow: 0 2px 0 var(--line);
  cursor: pointer;
  transition: transform .1s ease;
}
.dtab:active{ transform: translateY(1px); }
.dtab.is-on{ background: var(--pink); color: #fff; box-shadow: 0 2px 0 var(--pink-d); }

/* 抽屉里的区块：标题和内容是「一对」，
   永远一起出现、一起消失 —— 不会再出现空标题孤零零挂着 */
.dsec{ margin-bottom: 14px; }
.dsec-ttl{
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-4);
  margin: 0 0 7px;
  letter-spacing: 1px;
}

/* 抽屉里格子改每行 4 个，适应窄屏 */
.drawer .row{ grid-template-columns: repeat(4,1fr); }
.drawer .row.dish{ grid-template-columns: repeat(4,1fr); }
/* 【已删除 · 2026-09-24】这里本来有一条 .drawer .slot.d{ touch-action:none }，
   因为那时候我把「能拖去交订单」的拖拽源错挂在了抽屉的菜肴仓库上。
   用户纠正之后，拖拽源改成了【厨房最下面那排菜肴 ui】，这条就没用了。 */
.drawer .slot{ padding: 6px 2px; font-size: 13px; }
.drawer .slot .n{ font-size: 10px; }

/* ---------- 【火候 999】全文唯一的 !important ----------
   格子 / 区块的显隐必须压过其它所有布局规则，
   所以这里有意使用最高优先级。这不是遗留问题，是有意为之。
   —— 想动它之前，先确认不会影响到别处的显隐逻辑。 */
.is-hidden{ display: none !important; }

/* ---------- 7. 拖拽与投放区 ---------- */

/* 🐻 熊头垃圾桶 = 厨房里的「喂小京」投放区
   ------------------------------------------------------------
   【2026-09-22 大改】它从「固定在屏幕右下角、z-index 写死 999」
   变成了「挂在九宫格锅下面右侧的一个普通布局元素」。

   为什么把 999 拿掉：那个数字本来就是错的。
   它原意是「投放区必须永远能被拖到」，但写死成最高层级之后，
   熊头会浮在【一切】面板之上 —— 抽屉、遮罩、弹窗、导入导出框，
   走到哪都能看见它。一个只在厨房用的东西，没有理由到处刷存在感。

   现在它老老实实呆在自己的位置上，不抢层级。
   拖拽本身靠 elementFromPoint 找投放区（见 JS），
   根本不需要靠层级分胜负 —— 这跟当初解决
   「导航栏 vs 抽屉」是同一个思路：不重叠，就不用比火候。 */
#bearTrash{
  flex: none;
  width: 52px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  line-height: 1;
  transition: transform .15s;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.18));
}
</style>
</head>
<body>
<div class="wrap">
  <h1>小熊小农场</h1>
  <div class="sub">种地 · 喂动物 · 捡粑粑 · 做饭 · 喂小京</div>
  <div class="bar">
    <div class="pill">🪙 <span id="coins">0</span></div>
    <div class="pill tap" id="gemsPill">💎 <span id="gems">0</span></div>
    <div class="pill">🍯 <span id="honey">0</span></div>
    <div class="pill">🧸 <span id="bears">0</span></div>
  </div>
  <!-- 【2026-09-24 搬走】提示区原来在这儿（货币栏下面），白占一行地方。
       现在拆成两块、各去各该在的位置（都在农场页里）：
         「×N 让卖出去的东西多赚 X%」   → 「小京的朋友」按钮下面（#buff）
         「地上有 X 坨💩……」          → 田地下面、种子上面（#poopWarn）
       另外：粑粑攒够 6 坨时，顶部「🌱 农场」标签上会亮一个小叹号（#farmBadge） -->

<!-- ========== 左侧导航栏 ==========
     永远钉在屏幕最左，竖排；抽屉打开时它不会移动、不会被盖住。
     上半部分：四个「点得开抽屉」的按钮。
     下半部分：三个「订单槽」—— 它们不是按钮，是投放区，
               把成品拖上去就结算（详见 CSS 里的说明）。

     以后要加新入口（比如「配方书」），往下加一个 rail-btn 就行，
     不用改任何层级，也不会挤到别人。 -->
<nav class="rail" id="rail">
  <button class="rail-btn" data-view="bag" id="drawerBtn">🎒<span class="lb">背包</span></button>
  <button class="rail-btn" id="recipeBtn">📖<span class="lb">菜谱</span></button>
  <button class="rail-btn" data-view="craft" id="craftBtn">🏭<span class="lb">工坊</span><i class="rail-badge" id="craftBadge">!</i></button>
  <button class="rail-btn" data-view="bear" id="bearBtn" data-drop="bearbtn">🧸<span class="lb">小京</span><i class="rail-badge" id="bearBadge">!</i></button>

  <!-- 🗑️ 垃圾桶：💩 的投放区。
       2026-09-24 从屏幕右下角搬到这里 —— 在那儿它会盖住农场页的按钮。
       现在的位置：订单槽上面、那条粉色小横线的上方。 -->
  <div id="trash" data-drop="trash">🗑️</div>

  <!-- 订单区：一行小标题 + 5 个槽（槽本身是 JS 生成的）。
       小标题是 2026-09-24 用户要求加的 —— 原话：
       "否则其实玩家根本不知道这五个莫名其妙的图案是做什么用的" -->
  <div class="rail-orders" id="railOrders">
    <div class="rail-note">订单</div>
  </div>
</nav>

<div class="drawerMask" id="drawerMask"></div>

<!-- ========== 仓库抽屉 ==========
     从导航栏右边展开：不覆盖按钮，也不铺满屏幕（右侧留遮罩，点一下关掉）。
     每个区块是「标题 + 内容」的一对，由 JS 整块切换，
     所以不会再有「标题还在、格子没了」的空壳。 -->
<aside class="drawer" id="drawer">

  <!-- ===== 视图 1：背包 ===== -->
  <section class="dview" data-view="bag">
    <div class="drawer-tabs" id="drawerTabs">
      <button class="dtab is-on" data-cat="crop">🌱 农作物</button>
      <button class="dtab" data-cat="material">🥩 特殊食材</button>
      <button class="dtab" data-cat="craft">🍬 工坊产品</button>
      <button class="dtab" data-cat="dish">🍲 菜肴</button>
      <button class="dtab" data-cat="souvenir">⛄ 纪念品</button>
    </div>

    <section class="dsec" data-sec="goods">
      <div class="dsec-ttl">📦 物品仓库</div>
      <div class="row" id="store"></div>
      <button class="sellall" id="sellall" style="display:none"></button>
    </section>

    <section class="dsec is-hidden" data-sec="dish">
      <div class="dsec-ttl">🍽️ 菜肴仓库</div>
      <div class="row dish" id="tray"></div>
    </section>
  </section>

  <!-- ===== 视图 2：工坊 =====

var AC = null;            /* AudioContext：整套声音的总开关 */
var masterGain = null;    /* 总音量（现在固定 0.5，留这一层是为了以后能加音量条） */

function audioUnlock(){
  if(AC) return;
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;                       /* 老浏览器没有这个能力 */
    AC = new Ctx();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(AC.destination);
  }catch(e){
    AC = null;                             /* 出错就彻底放弃声音，游戏照常玩 */
  }
}
/* 第一次点屏幕时解锁。用 pointerdown 而不是 load，因为必须发生在"用户手势"里。 */

});

        ② 用了噪声（noise）—— 噪声本质上就是"呲——"的一声

      **所以《《 现在一个噪声都没有、一个锯齿波都没有 》》。**
      全部只用 `sine`（正弦波），这是最柔和的波形。

      可爱治愈风的四条配方（改音效之前先读这四条）：
        ① **只用 sine**。sawtooth / square 一律不许出现。
        ② **音高往上走**。上行 = 开心、可爱、有精神；下行 = 沉重、失落。
           （只有"失败"那种音才允许**轻微**下行，而且要短、要高，别掉到 400Hz 以下。）
        ③ **频率待在 420 ~ 2400Hz 之间**。

        ④ **音量不超过 0.24**，而且"可爱"的声音往往是**小而轻**的。
           想让它更明显，**加长衰减（d）**，不要加大音量。

      另外两个万能的"可爱"公式：
        · **上滑的水泡**：f 到 f2 往上滑（比如 660→990）→ 听着像"啵"，很萌
        · **八音盒**：短促的起音 + 长长的尾巴（d 拉到 0.3~0.45）→ 像敲了一下钢片琴 */
var SOUNDS = {

  /* ---------- 厨房 ---------- */
  /* 食材落进锅：小水泡"啵"（往上滑一点点，轻轻放下） */
  ingDrop: { parts:[{f:660, f2:990, d:0.09, v:0.20}] },

  ingPick: { parts:[{f:880, f2:1100, d:0.06, v:0.13}] },
  /* 锅里两格交换：两个小水泡"啵啵" */
  ingSwap: { parts:[{f:660, f2:990,  d:0.08, v:0.17},

  cookOk:  { parts:[{f:880,  f2:880,  d:0.16, v:0.18},

  cookBad: { parts:[{f:590, f2:520, d:0.14, v:0.15},

/* 播放一个音效。名字写错 / 还没解锁 / 浏览器不支持 → 安静跳过，绝不报错。 */
function sfx(name){
  if(!AC || !masterGain) return;
  if(AC.state === 'suspended') return;
  var cfg = SOUNDS[name];
  if(!cfg) return;

  var t0 = AC.currentTime;

  /* --- 音符层 --- */
  (cfg.parts || []).forEach(function(p){
    var start = t0 + (p.t || 0);
    var end   = start + p.d;
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = p.w || 'sine';
    o.frequency.setValueAtTime(Math.max(1, p.f), start);
    if(p.f2 && p.f2 !== p.f){
      o.frequency.exponentialRampToValueAtTime(Math.max(1, p.f2), end);
    }
    /* 音量包络：猛地起、慢慢落 —— 这样听着像乐器，而不是"哔"的一声电子音。
       ⚠️ exponentialRamp 的目标不能是 0，只能用 0.0001 这种极小值。 */
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, p.v), start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    o.connect(g); g.connect(masterGain);
    o.start(start); o.stop(end + 0.03);
  });

  /* --- 噪声层 --- */
  if(cfg.noise){
    var n = cfg.noise;
    var len = Math.max(1, Math.ceil(AC.sampleRate * n.d));
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var dat = buf.getChannelData(0);
    for(var i=0;i<len;i++) dat[i] = Math.random() * 2 - 1;
    var src = AC.createBufferSource(); src.buffer = buf;
    var flt = AC.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.value = n.f || 1000;
    flt.Q.value = n.q || 1;
    var ng = AC.createGain();
    ng.gain.setValueAtTime(n.v, t0);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + n.d);
    src.connect(flt); flt.connect(ng); ng.connect(masterGain);
    src.start(t0); src.stop(t0 + n.d + 0.03);
  }
}

  DISHES.forEach(function(d){ if(typeof S.dish[d.id]!=='number') S.dish[d.id]=0; });
  if(!S.seen) S.seen={berry:1};

  /* ---------- 厨房九宫格：旧存档迁移（2026-09-22）----------
     旧存档里根本没有这三个字段，补上一个空锅就行，不会丢档。
     顺手把没用的 S.stoves（三口灶台）扔掉 —— 它已经没有任何代码读它了。 */
  /* ---------- 2026-09-24：南瓜整条线都被删掉了，清掉存档里的残留 ----------
     删东西要删干净（总纲第 6 条）——不光代码里没有，
     玩家存档里那些「已经不存在的东西」也要一起扫掉，否则
     地块上会永远长着一颗没有名字的南瓜、仓库里会永远躺着一个卖不掉的南瓜。 */
  delete S.store.pumpkin;
  delete S.dish.pie;
  delete S.seen.pumpkin;
  delete S.seen.pie;
  S.plots.forEach(function(p){
    if(p.c && !byId(p.c)){ p.c=null; p.t=0; }   /* 种着的作物如果已经不存在了，清空这块地 */
  });

  delete S.stoves;
  if(!S.pot || !S.pot.length) S.pot = [];
  while(S.pot.length<POT_N) S.pot.push(null);
  if(S.pot.length>POT_N) S.pot.length=POT_N;
  for(var pi=0; pi<POT_N; pi++){
    /* 存档里可能残留一个已经不存在的食材 id（比如以后删了某种食材），
       清掉它，免得缩略图和判定出怪事 */
    if(S.pot[pi] && S.pot[pi]!=='honey' && !byGood(S.pot[pi])) S.pot[pi]=null;
  }
  if(typeof S.potSel==='undefined') S.potSel=null;
  if(S.potSel && !byDish(S.potSel)) S.potSel=null;
  if(typeof S.potOut==='undefined') S.potOut=null;
  if(S.potOut && S.potOut.kind==='dish' && !byDish(S.potOut.id)) S.potOut=null;
  if(!S.animals) S.animals={hen:0,cow:0,pig:0};
  ANIMALS.forEach(function(a){ if(typeof S.animals[a.id]!=='number') S.animals[a.id]=0; });
  if(!S.anT) S.anT={hen:0,cow:0,pig:0};
  ANIMALS.forEach(function(a){ if(typeof S.anT[a.id]!=='number') S.anT[a.id]=0; });
  if(!S.craftT) S.craftT={};
  if(!S.craftReady) S.craftReady={};
  if(!S.poops || !S.poops.length) S.poops=[];
  S.poops = S.poops.filter(function(x){ return x>=0 && x<N && S.plots[x] && S.plots[x].u; });
  delete S.house; delete S.own; delete S.walls; delete S.floors;
}

/* 订单结构迁移（2026-09-22）：
   旧订单是「一个订单凑三样货」→ {items:[三样货], pay}
   新订单是「一个订单只要一道菜」→ {id, price, pay}
   两者结构差太多，没法原地转换，所以旧订单一律丢掉，
   下面会照新结构重新生成三个。 */
if(!S.orders || !Array.isArray(S.orders)) S.orders=[];
S.orders = S.orders.filter(function(o){
  return o && typeof o.id === 'string' && byDish(o.id);
});

function money(x){ return Math.round(x*(1+S.bears*BEAR_BONUS)); }
function haveMat(k){ return k==='honey' ? S.honey : (S.store[k]||0); }
function takeMat(k,n){ if(k==='honey') S.honey-=n; else S.store[k]=(S.store[k]||0)-n; }
function animalTotal(){ return S.animals.hen+S.animals.cow+S.animals.pig; }

/* ============================================================
   订单（2026-09-22 大改）
   ------------------------------------------------------------
   改之前：一个订单要凑齐三样货，农作物 / 材料 / 菜肴都可能被要。
   改之后：**一个订单 = 一道菜肴**，只要一道，
          其他任何东西（农作物、材料、纪念品）一律不出现在订单里。

   怎么交付：把锅下面成品格里的菜【拖】到左边导航栏的订单槽上，
             对得上就付钱，那个槽自己变成下一道菜 —— 全自动。

   ⚠️「用蜂蜜刷新订单」已经整块删掉（连按钮一起），
      所以订单只会「交付之后自己换」，玩家没法手动刷。
   ============================================================ */

/* 订单池：只挑「玩家已经成功做出来过」的菜（看 S.seen）。
   排除 bear（小熊料理只喂小京）和 noCook（丸子串串靠探险拿）。

   ⚠️ 新手兜底：新存档一道菜都没做成功过，池子会是空的。
      这时候固定用「蔬菜沙拉」顶上。
      （作者计划做新手指引，指引里用到的那道菜就暂时定为蔬菜沙拉；
        等新手指引真的做出来，把下面的 'salad' 换成指引要求的那道菜即可。） */
function orderPool(){
  var list=[];
  DISHES.forEach(function(d){
    if(d.bear) return;
    if(d.noCook) return;
    if(!S.seen[d.id]) return;
    list.push(d);
  });
  if(!list.length) list=[byDish('salad')];
  return list;
}

/* 生成一个订单：结构很浅，就是一道菜 {id, price, pay}
     price 是这道菜这一次的单价（特殊料理 ×1.5）
     pay   是交付时真正到手的钱（再乘 1.5~2.0 的随机浮动）
   ⚠️ pay 只能生成一次就定下来 —— 不然每次重画订单金额都在跳。 */
function makeOrder(){
  var pool = orderPool();

  /* 特殊料理只有 20% 概率进入这一轮的候选（价格 ×1.5）——
     规则和以前一样，只是从「混进一个大池子」变成「混进这一轮的候选」。 */
  var cand=[];
  pool.forEach(function(d){
    if(d.special){ if(Math.random() < 0.2) cand.push(d); }
    else cand.push(d);
  });
  if(!cand.length) cand = pool;   /* 特殊菜全被骰子刷掉了 → 拿普通菜兜底 */

  /* 尽量避开另外两个槽已经在要的菜。
     但如果池子里就那么一两道（新手期只有蔬菜沙拉），允许重复。 */
  var taken={};
  S.orders.forEach(function(o){ if(o && o.id) taken[o.id]=1; });
  var fresh = cand.filter(function(d){ return !taken[d.id]; });
  var use = fresh.length ? fresh : cand;

  var d = use[Math.floor(Math.random()*use.length)];
  var price = d.special ? Math.round(d.price*1.5) : d.price;
  return { id:d.id, price:price, pay:Math.round(price*(1.5+Math.random()*0.5)) };
}

/* 订单槽要显示哪种菜（拿不到就返回 null，渲染时会跳过） */
function orderDish(o){ return (o && byDish(o.id)) || null; }

while(S.orders.length<ORDER_SLOTS) S.orders.push(makeOrder());
if(S.orders.length>ORDER_SLOTS) S.orders.length=ORDER_SLOTS;

/* 【已删除 · 2026-09-22】needText(d) 本来在这里。
   它的作用是「把 d.need 拼成『🍅×2 🥚×1』这样的配菜提示」，
   挂在厨房的菜谱卡片上。
   菜谱卡片改成「只显示 icon + 名字」之后它没人用了，所以删掉。
   现在想知道一道菜要什么材料，看右边那个九宫格缩略图。 */

function cropOf(p){ return p.c?byId(p.c):null; }
function prog(p){ var c=cropOf(p); if(!c) return 0; return Math.min(1,(Date.now()-p.t)/(c.grow*1000)); }
function isReady(p){ var c=cropOf(p); return !!(p.c&&c&&(Date.now()-p.t)>=c.grow*1000); }

/* ---------- 渲染 ---------- */
function paint(){
  $('coins').textContent=Math.floor(S.coins);
  $('gems').textContent=S.gems;
  $('honey').textContent=S.honey;
  $('bears').textContent=S.bears;

  /* ---------- 农场页里的两行小提示（2026-09-24 从页面顶部拆下来）----------
     ① 「×N 让卖出去的东西多赚 X%」→ 挂在「小京的朋友」按钮下面
     ② 「地上有 X 坨💩……」        → 挂在田地下面、种子上面
     ② 只在有粑粑时才出现，没粑粑就整个藏起来（一点都不占地方）。

     ⚠️ ② 光靠一行小字不够 —— 粑粑攒够 6 坨动物就全体罢工，
        玩家要是不点农场页，可能半小时都发现不了。
        所以下面还会同步点亮【顶部「🌱 农场」标签上的小叹号】。 */
  var bearLine = S.bears===0
    ? '还没有小熊，价钱都是原价'
    : '×'+S.bears+' 让卖出去的东西多赚 '+Math.round(S.bears*BEAR_BONUS*100)+'%';
  if($('buff').textContent !== bearLine) $('buff').textContent = bearLine;

  var poopEl = $('poopWarn');
  var poopBad = S.poops.length >= POOP_LIMIT;
  if(S.poops.length > 0){
    var pooTxt = poopBad
      ? '地上 '+S.poops.length+' 坨💩，动物全都罢工了！快拖到左边的桶里'
      : '地上有 '+S.poops.length+' 坨💩，拖到左边的桶里';
    if(poopEl.textContent !== pooTxt) poopEl.textContent = pooTxt;
    poopEl.className = 'poopWarn' + (poopBad ? ' bad' : '');
    poopEl.style.display = '';
  }else{
    poopEl.style.display = 'none';
  }
  /* 顶部「🌱 农场」标签上的小叹号（跟工坊/小京那两个是一套东西） */
  $('farmBadge').classList.toggle('is-on', poopBad);

  GOODS.forEach(function(g,i){
    var n=S.store[g.id]||0;
    if(storeEls[i].getAttribute('data-n')!==String(n)){
      storeEls[i].className='slot'+(n?'':' zero');
      storeEls[i].innerHTML='<span>'+g.e+'</span><span class="n">'+n+'</span>';
      storeEls[i].setAttribute('data-n',n);
    }
  });
  DISHES.forEach(function(d,i){
    var n=S.dish[d.id]||0;
    if(trayEls[i].getAttribute('data-n')!==String(n)){
      trayEls[i].className='slot d'+(n?'':' zero');
      trayEls[i].innerHTML='<span>'+d.e+'</span><span class="n">'+n+'</span>';
      trayEls[i].setAttribute('data-n',n);
    }
  });

  var total=0;
  GOODS.forEach(function(g){ total+=money(g.price)*(S.store[g.id]||0); });
  DISHES.forEach(function(d){ total+=money(d.price)*(S.dish[d.id]||0); });
  var sb=$('sellall');
  var txt = total>0 ? '全部散卖 · 得到 🪙'+total : '仓库空空的，先去种点什么';
  if(sb.textContent!==txt) sb.textContent=txt;
  sb.disabled = total<=0;

  S.plots.forEach(function(p,i){
    var el=plotEls[i], kind, c=cropOf(p);
    var hasPoop = S.poops.indexOf(i)>=0;
    if(!p.u) kind='locked';
    else if(!p.c) kind='empty';
    else kind=isReady(p)?'ready':'growing';

    el.style.touchAction = hasPoop ? 'none' : '';

    var cs=cellState[i], key=kind+':'+(p.c||'')+':'+(hasPoop?1:0);
    if(!cs||cs.key!==key){
      el.className='plot '+(kind==='locked'?'locked':kind);
      var inner='';
      if(kind==='locked') inner='<span class="em" style="font-size:18px">🔒</span><span>'+PLOT_PRICE[i]+'</span>';
      else if(kind==='empty') inner='<span class="em">＋</span>';
      else if(kind==='ready') inner='<span class="em">'+c.e+'</span>';
      else inner='<span class="em">'+c.e+'</span><div class="prog"><i></i></div>';
      if(hasPoop) inner+='<span class="poop">💩</span>';
      el.innerHTML=inner;
      cellState[i]={key:key, fill:el.querySelector('.prog i')};
      cs=cellState[i];
    }
    if(cs.fill && kind==='growing') cs.fill.style.width=(prog(p)*100)+'%';
  });

  Array.prototype.forEach.call(seedsBox.children,function(b,i){
    var sc=CROPS_SORTED[i];
    if(!sc) return;
    b.classList.toggle('on', sc.id===S.sel);
    b.classList.toggle('poor', S.coins<sc.cost);
  });

  /* ---------- 工坊卡片：三种状态 ---------- */
  CRAFTS.forEach(function(c,i){
    var b=craftBox.children[i];
    var og=byGood(c.out);
    var ready=!!S.craftReady[i];
    var started=S.craftT[i]||0;
    var key;

    b.classList.toggle('done', ready);
    b.classList.toggle('working', !ready && !!started);

    /* 状态三：做好了，等着收 */
    if(ready){
      key='ready|'+c.out;
      if(b.getAttribute('data-k')!==key){
        b.innerHTML='<span class="e">'+og.e+'</span><span class="info">'+
          '<span class="n">'+og.n+' 好了！</span>'+
          '<span class="p">点一下收进仓库</span></span>';
        b.setAttribute('data-k',key);
      }
      b.classList.remove('poor');
      return;
    }

    /* 状态二：正在加工，显示进度条和剩余秒数 */
    if(started){
      var left=Math.max(0, Math.ceil((started + c.time*1000 - Date.now())/1000));
      var pct=Math.min(100, Math.round((Date.now()-started)/(c.time*10)));
      key='work|'+started+'|'+left;
      if(b.getAttribute('data-k')!==key){
        b.innerHTML='<span class="e">'+og.e+'</span><span class="info">'+
          '<span class="n">'+og.n+'</span>'+
          '<span class="p">加工中 · 还要 '+left+' 秒</span>'+
          '<span class="cprog"><i style="width:'+pct+'%"></i></span></span>';
        b.setAttribute('data-k',key);
      }
      b.classList.remove('poor');
      return;
    }

    /* 状态一：闲着，显示配方 + 材料够不够 */
    if(c.multi){
      var parts=[], canMake=true;
      key='m|'+c.out;
      for(var k in c.multi){
        var gg=byGood(k);
        var haveN=S.store[k]||0;
        key+='|'+k+':'+haveN;
        parts.push((gg?gg.e+'×':'')+c.multi[k]);
        if(haveN<c.multi[k]) canMake=false;
      }
      if(b.getAttribute('data-k')!==key){
        b.innerHTML='<span class="e">'+og.e+'</span><span class="info"><span class="n">蛋黄酱</span><span class="p">需要 '+parts.join(' ')+' · '+c.time+'秒</span></span>';
        b.setAttribute('data-k',key);
      }
      b.classList.toggle('poor', !canMake);
    } else {
      var fg=byGood(c.from);
      var have=S.store[c.from]||0;
      key='s|'+have+'|'+c.from;
      if(b.getAttribute('data-k')!==key){
        b.innerHTML='<span class="e">'+og.e+'</span><span class="info"><span class="n">'+fg.n+' → '+og.n+'</span><span class="p">需要 '+c.need+' 个 · 有 '+have+' · '+c.time+'秒</span></span>';
        b.setAttribute('data-k',key);
      }
      b.classList.toggle('poor', have<c.need);
    }
  });

  /* 厨房整块（食材区 / 锅 / 成品格 / 菜肴列表）交给独立函数画，
     paint() 才不会被撑得又长又乱。 */
  paintKitchen();

  paintOrders();
  paintAnimals();
  paintShop();
  paintBear();

  var cb=$('bearb');
  cb.disabled = !(S.bears<BEAR_MAX && S.honey>=BEAR_HONEY);
  var ct = S.bears>=BEAR_MAX ? '小京的朋友已经够多了 🧸'
    : (S.bears===0 ? '请小京来帮忙收地 · 🍯'+BEAR_HONEY
    : '再请一只小熊 · 🍯'+BEAR_HONEY+'（'+S.bears+'/'+BEAR_MAX+'）');
  if(cb.textContent!==ct) cb.textContent=ct;

  var fb=$('fertb');
  fb.disabled = S.dung<3;
  var ft='🪣 施肥 · 有 '+S.dung+' 坨（攒 3 坨，地里全部催熟）';
  if(fb.textContent!==ft) fb.textContent=ft;

  var ab=$('auto');
  ab.classList.toggle('on', !!S.auto);
  ab.textContent = S.auto ? '小京顺手替你补种：开着' : '小京顺手替你补种：关着';

  $('tip').textContent = S.auto && S.bears>0 ? '小京替你种地，你负责看锅' : '点土地种下去，熟了再收';

  /* 导航栏「工坊」上的小叹号：有东西加工好了还没收，就亮起来 */
  $('craftBadge').classList.toggle('is-on', anyCraftReady());
  /* 导航栏「小京」上的小叹号：探险回来了、有礼物待领 */
  $('bearBadge').classList.toggle('is-on', !!S.lootPending);

  if(isDrawerOpen()) filterDrawer(currentCat);
}

/* ============================================================
   厨房：九宫格锅的渲染（2026-09-22 新增 · 2026-09-24 左右翻面）
   ------------------------------------------------------------
   画五样东西：
     ① 食材区    —— 只显示 icon。仓库里没有的变灰
     ② 锅        —— 9 格，在【右边】（右手大拇指够得着）；有东西的格子加 .has
     ③ 左边两块  —— 上：菜谱缩略图；下：当前选中的菜（icon + 名字）
     ④ 成品格    —— 提交之前留空；有东西时「提交」变灰
     ⑤ 菜肴列表  —— 背包里有货的标粉底（.have），当前选中的标描边（.on）
   ============================================================ */
function paintKitchen(){
  /* ① 食材区：有货正常显示，没货变灰。
     ⚠️ 一律走 haveMat() —— 蜂蜜存在 S.honey 里，不在 S.store，
        直接写 S.store['honey'] 会永远是 0。 */
  PANTRY.forEach(function(id,i){
    var el=pantryEls[i];
    if(!el) return;
    el.classList.toggle('zero', haveMat(id)<=0);
  });

  /* ② 锅：哪一格有东西 */
  for(var i=0;i<POT_N;i++){
    var cell=potCells[i];
    var id=S.pot[i];
    var info=id?ingInfo(id):null;
    cell.classList.toggle('has', !!id);
    cell.textContent = info ? info.e : '';
  }

  /* ③ 左下：当前选中的菜（icon + 名字）
     （2026-09-24 之前它在右上，现在挪到左边、而且在缩略图【下面】了） */
  var sel = S.potSel ? byDish(S.potSel) : null;
  if(sel){
    potPickEl.className='potPick';
    potPickEl.innerHTML='<span class="pe">'+sel.e+'</span>'+sel.n;
  }else{
    potPickEl.className='potPick empty';
    potPickEl.innerHTML='先选一道菜';
  }

  /* ③ 左上：菜谱缩略图（2026-09-24 挪到左边，并且挪到名字【上面】了）。
     故意做得很小 —— 用户原话：「大小要小，不要把九宫格挤没了」。

     ⚠️ 这里就是【故意剧透】的地方：选了哪道菜，就把它该摆什么告诉他。
        以后要做真正的「探索式烹饪」，改法是在这里换成剪影 / 问号，
        而不是把整张菜谱藏起来。 */
  var refKey = sel ? sel.id : 'none';
  if(potRefBox.getAttribute('data-k') !== refKey){
    var r = sel ? RECIPES[sel.id] : null;
    var mini='<div class="mini">';
    for(var k=0;k<POT_N;k++){
      var ing = (r && r[k]) ? ingInfo(r[k]) : null;
      mini+='<i>'+(ing?ing.e:'')+'</i>';
    }
    mini+='</div>';
    potRefBox.innerHTML=mini;
    potRefBox.setAttribute('data-k', refKey);
  }

  /* ④ 成品格。
     ⚠️ 它有东西的时候【绝对不许被下一道菜覆盖】——
        所以「提交」这时候是灰的，玩家必须先把成品处理掉。

     三种成品的出路（2026-09-24 定稿）：
       · 正常的菜     → 拖给左侧「要它的那个订单槽」结算；或者拖给「🧸 小京」按钮进背包
                        ⚠️ 拖给熊头会被拒绝：「小京才不要吃这个呢！」
       · ☠︎ 黑暗料理 → 只能拖给熊头（小京吃掉它，但不加饱食度）
       · 小熊料理     → 拖给熊头直接喂（+feed 饱食度），或者拖给「🧸 小京」按钮进背包
     —— 也就是说，每一种成品都至少有一条出路，不会出现卡死的局面。 */
  var out=S.potOut;
  if(!out){
    outSlot.className='outSlot empty';
    outSlot.textContent='·';
  }else{
    var od = out.kind==='dark' ? DARK_DISH : byDish(out.id);
    outSlot.className='outSlot';
    outSlot.textContent = od ? od.e : '?';
  }
  potGoBtn.disabled = !!out;
  potGoBtn.textContent = out ? '先处理成品' : '提交';

  /* ⑤ 菜肴列表的两种高亮（2026-09-24 加）。
     ⚠️ 只做「有货 = 粉底」，**绝对不做「没货 = 灰」** ——
        大部分菜背包里本来就没有存货，全灰会很难看，
        而且玩家也没法一眼看出哪道是自己有料的。
        （用户先说要加灰色，五分钟后又自己收回了：「我感觉变灰会好难看啊」） */
  DISHES.forEach(function(d,i){
    var b=dishEls[i];
    if(!b) return;
    b.classList.toggle('have', (S.dish[d.id]||0)>0);
    b.classList.toggle('on', d.id===S.potSel);
  });
}

/* 订单槽的渲染：只画一个菜肴 icon，**一个字都不写**。
   —— 用户原话：「显示的 icon 是当前所需菜肴，不显示名字。无名。」
       所以别往这里加文字，连 tooltip 也别加。
   （后期要在下面加进度条 / 时间条 / 叹号时，往 .oslot 里再塞元素就行，
     外面那圈粉色虚线框不受影响。） */
function paintOrders(){
  S.orders.forEach(function(o,i){
    var el=orderEls[i];
    if(!el) return;
    var d=orderDish(o);
    if(!d){ el.textContent=''; el.removeAttribute('data-k'); return; }
    if(el.getAttribute('data-k')!==d.id){
      el.textContent=d.e;
      el.setAttribute('data-k',d.id);
    }
  });
}

function paintAnimals(){
  var total=animalTotal();
  var angry=animalsAngry();
  var html='';
  if(total<=0){
    html='<div class="anrow">牧场还空着，下面可以请动物来住 🐾</div>';
  }else{
    ANIMALS.forEach(function(a){
      var num=S.animals[a.id];
      if(num<=0) return;
      var feed=S.store[a.feed]||0;
      var fg=byGood(a.feed), og=byGood(a.out);
      var st, bad=false;
      if(angry){ st='罢工中（地上太脏了）'; bad=true; }
      else if(feed<=0){ st='饿着，没有'+a.fname; bad=true; }
      else st=a.time+'秒一个'+og.e;
      html+='<div class="anrow'+(bad?' bad':'')+'" data-a="'+a.id+'">'+
        '<span class="em">'+a.e+'</span>'+a.n+' ×'+num+
        ' · 吃'+fg.e+a.fname+' ×'+feed+' · '+st+'</div>';
    });
  }
  if(anBox.getAttribute('data-k')!==html){
    anBox.innerHTML=html;
    anBox.setAttribute('data-k',html);
  }
}

function paintShop(){
  ANIMALS.forEach(function(a){
    var b=shopBox.querySelector('[data-buy="'+a.id+'"]');
    if(!b) return;
    var num=S.animals[a.id];
    b.disabled = num>=ANIMAL_MAX || S.coins<a.price;
    var key=num+'|'+S.coins;
    if(b.getAttribute('data-k')!==key){
      b.innerHTML='<span class="be">'+a.e+'</span>'+
        '<span class="bn">请一只'+a.n+'（'+num+'/'+ANIMAL_MAX+'）</span>'+
        '<span class="bp">🪙'+a.price+'</span>';
      b.setAttribute('data-k',key);
    }
  });
}

/* ---------- 小熊投喂页 ---------- */
function paintBear(){
  if(!feedGrid) return;
  var pct=Math.max(0,Math.min(100,Math.round(S.full||0)));
  var ff=$('fullFill'); if(ff) ff.style.width=pct+'%';
  var ft=$('fullTxt');
  if(ft){
    var txt;
    if(S.bears<=0) txt='还没有小熊呢，先去农场请一只吧 🧸';
    else if(S.full>=BEAR_FULL_OK) txt='饱饱的 '+pct+'% · 正在帮你捡地上的粑粑 🧹';
    else if(S.full>0) txt='有点饿 '+pct+'% · 吃饱 '+BEAR_FULL_OK+'% 就会帮你干活';
    else txt='肚子空空的 0% · 喂点小熊料理给它吧';
    if(ft.textContent!==txt) ft.textContent=txt;
  }

  /* 小京探险回来的叹号：现在挂在左侧导航栏的「小京」按钮上 */
  var bearBadge = $('bearBadge');
  if(bearBadge) bearBadge.classList.toggle('is-on', !!S.lootPending);

  var lootBtn = $('lootBtn');
  if(lootBtn) lootBtn.style.display = S.lootPending ? 'block' : 'none';

  var bf=$('bearFace');
  if(bf) bf.classList.toggle('happy', S.bears>0 && S.full>=BEAR_FULL_OK);

  var expBox = $('expeditionBox');
  if(expBox){
    if(S.expedition){
      expBox.style.display = 'block';
      var now = Date.now();
      var remain = Math.max(0, S.expedition.endTime - now);
      var percent = Math.min(100, (1 - remain / S.expedition.duration) * 100);
      var progEl = $('expProgress');
      if(progEl) progEl.style.width = percent + '%';
      var titleEl = $('expTitle');
      if(titleEl) titleEl.textContent = '🧸 小京正在' + getSeasonName(S.expedition.season) + '探险中...';
      var timeEl = $('expTimeLeft');
      if(timeEl) timeEl.textContent = '剩余 ' + Math.ceil(remain / 1000) + ' 秒';
    } else {
      expBox.style.display = 'none';
    }
  }

  BEAR_DISHES.forEach(function(d,i){
    var b=feedGrid.children[i];
    if(!b) return;
    var n=S.dish[d.id]||0;
    var key=d.id+'|'+n;
    if(b.getAttribute('data-k')!==key){
      b.innerHTML='<span class="e">'+d.e+'</span><span class="info"><span class="n">'+d.n+'</span><span class="p">有 '+n+' 份 · 饱食 +'+d.feed+'</span></span>';
      b.setAttribute('data-k',key);
    }
    b.classList.toggle('poor', n<=0);
  });
}

/* ============================================================
   吃东西的特殊效果表
   ------------------------------------------------------------
   分工是这样的：
     · 菜品表（DISHES）里只写「哪个效果」→  onEat:'fullBelly'
     · 具体这个效果做什么，写在这张表里 ↓

   好处：以后有 20 道菜带效果，也**不用把菜品表改成一堆开关**，
        只需要往下面这张表里加一条，然后在菜上写个名字。
        加效果 = 加一行，不用动别的任何东西。

   要加新效果，照抄这个格式：
     effectName: function(d){ ... }
   d 就是这道菜本身（d.n 名字、d.e 图标、d.feed 饱食度……）
   ============================================================ */
var EAT_EFFECTS = {

  /* 超级起泡酒：饱食度直接拉满，并且 3 分钟不掉 */
  fullBelly: function(d){
    S.bubbleBuffT = Date.now() + 3*60*1000;
    S.full = BEAR_FULL_MAX;
    toast(d.e+' 小京把'+d.n+'喝光了，饱食度瞬间回满，3分钟不掉！');
  }

};

/* 跑一道菜的 onEat 效果。返回 true 表示"有特殊效果，已经处理过了" */
function runEatEffect(d){
  if(!d.onEat) return false;
  var fx = EAT_EFFECTS[d.onEat];
  if(!fx){
    /* 名字写错了不静默失败 —— 直接在控制台吼一声，方便排查 */
    console.warn('菜品 '+d.id+' 的 onEat 写了不存在的效果："'+d.onEat+'"，请在 EAT_EFFECTS 里补上');
    return false;
  }
  fx(d);
  return true;
}

/* ============================================================
   小京吃掉一道菜
   ------------------------------------------------------------
   （2026-09-22 抽出来的）
   以前这段逻辑写在 feedBear() 里，只有「抽屉里点投喂」这一条路能走到。
   现在厨房里「把熊料理拖给熊头垃圾桶」也要喂小京，
   所以把它单独拎出来 —— **两条路走同一份规则**，
   以后改饱食度、改打嗝概率，只改这一个地方，不会两边不一致。
   ============================================================ */
function eatDish(d){
  /* ⚠️ `(d.feed || 0)` 那个保护不能去掉：
     2026-09-24 之后，普通菜在笔记里是【不写 feed 的】（只有小熊料理才需要它），
     所以普通菜的 d.feed 是 undefined。虽然按设计只有 bear 菜会走到这里，
     但万一哪天有人在别处调了这个函数，没有这个兜底就会变成 NaN。 */
  S.full=Math.min(BEAR_FULL_MAX,(S.full||0)+(d.feed||0));
  S.fullT=Date.now();
  var hadEffect = runEatEffect(d);   /* 有特殊效果就让它自己提示，不再说普通台词 */
  if(!hadEffect){
    if(S.full>=BEAR_FULL_OK) toast('小京吃得饱饱的，开始帮你捡粑粑啦 🧸');
    else toast('小京吃掉了'+d.e+d.n+'，肚子暖暖的');
  }
  if(S.full >= BEAR_FULL_MAX && Math.random() < 0.2){
    setTimeout(burpEvent, 500);
  }
}

/* 抽屉里「投喂小京」：从仓库里扣掉一份小熊料理，然后喂下去。
   小熊料理是唯一能加饱食度的东西 ——
   厨房里拖给熊头的普通菜和黑暗料理都不加（原因见 feedToBear）。
   而且 2026-09-24 之后，普通菜连「被熊头吃掉」都不行了，
   拖上去只会被拒绝：小京才不要吃这个呢。 */
function feedBear(id){
  var d=byDish(id);
  if(!d||!d.bear){ toast('这个不是小熊料理，小京不吃哦'); return; }
  if(S.bears<=0){ toast('还没有小熊呢，先去农场请一只吧'); return; }
  var n=S.dish[d.id]||0;
  if(n<=0){ toast('还没有'+d.n+'呢，先去厨房做一份吧'); return; }
  S.dish[d.id]=n-1;
  eatDish(d);
  save(); paint();
}

var tempPack = {honey:0, dishes:{}};

function openOuting(){
  tempPack = {honey:0, dishes:{}};
  renderPackUI();
}

function renderPackUI(){
  var totalFeed = 0;
  for(var k in tempPack.dishes){
    var d = byDish(k);
    if(d) totalFeed += d.feed * tempPack.dishes[k];
  }

  var html = '<div class="ttl">🎒 小京的旅行背包</div>'+
    '<div class="hintline" style="margin-bottom:14px">需要：总饱食度 ≥ 100 的小熊料理 + 1 罐蜂蜜</div>'+
    '<div style="font-size:14px;font-weight:700;color:#e2789f;margin-bottom:12px">'+
    '🍯 蜂蜜：'+tempPack.honey+' / 1<br>'+
    '🍩 总饱食度：'+totalFeed+' / 100</div>'+
    '<div class="seeds" style="max-height:180px;overflow-y:auto;margin-bottom:12px">';

  // 蜂蜜：只要装满了1个，就变灰不能再点
  var honeyFull = tempPack.honey >= 1;
  html += '<button class="seed'+(honeyFull ? ' poor' : '')+'" id="packHoney">'+
    '<span class="e">🍯</span><span class="info"><span class="n">蜂蜜</span><span class="p">'+(honeyFull ? '已经装好啦' : '点击装 1 罐')+'</span></span></button>';

  BEAR_DISHES.forEach(function(d){
    var n = S.dish[d.id] || 0;
    var packed = tempPack.dishes[d.id] || 0;
    if(n <= 0) return;

    // 判断加上这个料理会不会超过100
    var willExceed = (totalFeed >= 100);
    var canPack = (packed < n) && !willExceed;

    html += '<button class="seed'+(canPack ? '' : ' poor')+'" id="pack_'+d.id+'">'+
      '<span class="e">'+d.e+'</span><span class="info"><span class="n">'+d.n+'</span><span class="p">有 '+n+' 份 · 装了 '+packed+' · 饱食 +'+d.feed+'</span></span></button>';
  });

  html += '</div>';

  var canGo = totalFeed >= 100 && tempPack.honey >= 1;
  html += '<button class="catb" id="packGo" '+(canGo ? '' : 'disabled')+'>'+(canGo ? '出发去森林' : '还没装满哦')+'</button>';
  html += '<div class="hintline" style="margin-top:10px">点空白处关闭</div>';

  panel.innerHTML = html;
  overlay.classList.add('on');

  // 蜂蜜的点击逻辑：最多只能装1个
  var bh = $('packHoney');
  if(bh) bh.addEventListener('click', function(){
    if(honeyFull){
      toast('蜂蜜只需要 1 罐就够啦，不能再装啦');
      return;
    }
    if(S.honey >= 1){
      tempPack.honey = 1;
      renderPackUI();
    } else {
      toast('仓库里没有蜂蜜啦，先去种地收集一点吧');
    }
  });

  // 料理的点击逻辑：达到100饱食度就锁定，不让手滑多塞
  BEAR_DISHES.forEach(function(d){
    var b = $('pack_'+d.id);
    if(b) b.addEventListener('click', function(){

function getSeasonName(season){
  if(season==='spring') return '春季森林';
  if(season==='summer') return '夏季森林';
  if(season==='autumn') return '秋季森林';
  if(season==='winter') return '冬季森林';
  return '';
}

function startExpedition(season){
  if(S.lootPending){
    toast('小京还有礼物没领呢，先领了再出发吧 🧸');
    return;
  }
  overlay.classList.remove('on');
  panel.innerHTML='';

  S.honey -= tempPack.honey;
  for(var k in tempPack.dishes){
    S.dish[k] = (S.dish[k]||0) - tempPack.dishes[k];
  }

  S.expedition = {
    season: season,
    endTime: Date.now() + 60000,
    duration: 60000
  };

  toast('小京出发去' + getSeasonName(season) + '探险了，要一分钟才回来哦');
  save(); paint();
}

function finishExpedition(){
  if(!S.expedition) return;
  var season = S.expedition.season;
  S.expedition = null;
  S.lootPending = true; // 标记有待领取的战利品

  var loot = {};
  var total = 12;

  function addLoot(id, n){
    if(id === 'skewer'){
      S.dish[id] = (S.dish[id]||0) + n;
    } else {
      S.store[id] = (S.store[id]||0) + n;
    }
    S.seen[id] = 1;
    loot[id] = (loot[id]||0) + n;
  }

  for(var i=0;i<10;i++){
    var r = Math.random();
    if(r < 0.3){
      addLoot('meat', 1);
    } else if(r < 0.5){
      var crop = CROPS[Math.floor(Math.random()*CROPS.length)];
      addLoot(crop.id, 1);
    } else if(r < 0.7){
      var craftGoods = ['sugar','flour','butter','ketchup','oil','jam','mayo'];
      var cg = craftGoods[Math.floor(Math.random()*craftGoods.length)];
      addLoot(cg, 1);
    } else {
      var seasonRoll = Math.random();
      if(season==='spring'){
        if(seasonRoll < 0.7) addLoot('lemon', 1);
        else addLoot('skewer', 1);
      } else if(season==='summer'){
        if(seasonRoll < 0.5) addLoot('alcohol', 1);
        else addLoot('shrimp', 1);
      } else if(season==='autumn'){
        if(seasonRoll < 0.3) addLoot('honey', 1);
        else addLoot('cheese', 1);
      } else if(season==='winter'){
        if(seasonRoll < 0.9) addLoot('ice', 1);
        else if(seasonRoll < 0.999) addLoot('snowman', 1);
        else addLoot('sparkle_snowman', 1);
      }
    }
  }

  var summary = [];
  for(var k2 in loot){
    var g = byGood(k2);
    summary.push(g.e + g.n + ' ×' + loot[k2]);
  }

  S.lootSummary = summary.join('，');
  save(); paint();
}

/* ============================================================
   统一拖拽骨架（2026-09-22 泛化）
   ------------------------------------------------------------
   以前这套骨架是专为「把💩拖进垃圾桶」长出来的，
   里面把 💩 和 #trash 写死在了逻辑里。
   现在打通过之后，四种拖拽共用同一套骨架（没有抄第二份）：

     ① 💩 → 🗑️            payload = {kind:'poop', i:地块号}
     ② 食材 → 锅           payload = {kind:'ing',  id:'tomato'}
     ③ 成品 → 订单/熊头/小京按钮
                           payload = {kind:'out'}
     ④ 锅里那格 → 别处      payload = {kind:'pot',  i:格子号}
        拖到别的空格 = 挪位置；拖出锅外 = 拿掉（库存还回来）

   怎么找到「手指底下那个投放区」：
     每个能接东西的元素上都写了 data-drop="xxx"。
     拖拽替身是 pointer-events:none，所以 elementFromPoint
     直接就能拿到它底下的元素，然后顺着 parentElement 往上找。

   为什么不用「比层级」那一套：
     跟当初解决「导航栏 vs 抽屉」是同一个思路 —— 不重叠就不用比火候。
     熊头垃圾桶那个写死的 999，就是被这一条干掉的。

   ⚠️ 以后要加第五种拖拽 / 新的投放区，只需要：
        在元素上写 data-drop="你的名字"，
        然后到 zoneAccepts 和 doDrop 里各加一行。
        骨架本身一个字都不用改。
   ============================================================ */
var dragPayload=null, dragGhost=null, dragMoved=false, dragSX=0, dragSY=0, dragBlock=0;

function dragStart(e, payload){
  if(!payload) return;
  /* 不该拖的东西直接拦掉，别让玩家白拖一趟 */
  if(payload.kind==='poop'    && S.poops.indexOf(payload.i)<0) return;
  if(payload.kind==='ing'     && haveMat(payload.id)<=0) return;      /* 仓库里没有这个食材 */
  if(payload.kind==='pot'     && !S.pot[payload.i]) return;
  if(payload.kind==='bagdish' && (S.dish[payload.id]||0)<=0) return;  /* 背包里没有这道菜 */
  dragPayload=payload; dragMoved=false; dragSX=e.clientX; dragSY=e.clientY;
  document.addEventListener('pointermove',dragMove);
  document.addEventListener('pointerup',dragEnd);
  document.addEventListener('pointercancel',dragEnd);
}

/* 跟手的那个替身该显示什么 icon */
function dragIconOf(p){
  if(p.kind==='poop')    return '💩';
  if(p.kind==='ing')     return (ingInfo(p.id)||{}).e || '?';
  if(p.kind==='pot')     return (ingInfo(S.pot[p.i])||{}).e || '?';
  if(p.kind==='bagdish') return (byDish(p.id)||{}).e || '?';     /* 从厨房菜肴列表拖出来的菜 */
  if(p.kind==='out'){
    var o=S.potOut;
    if(!o) return '?';
    return o.kind==='dark' ? DARK_DISH.e : ((byDish(o.id)||{}).e || '?');
  }
  return '?';
}

/* 手指底下是哪个投放区（都不是就返回 null） */
function dropZoneAt(x,y){
  var el=document.elementFromPoint(x,y);
  while(el && el!==document.body){
    if(el.getAttribute && el.getAttribute('data-drop')) return el;
    el=el.parentElement;
  }
  /* 🗑️ 垃圾桶的兜底判定。
     ⚠️ 这段代码是【历史遗留的保险】，2026-09-24 之后其实已经用不上了 ——
        它当初固定在屏幕右下角、装着 pointer-events:none（怕挡住页脚按钮），
        所以 elementFromPoint 找不到它，只能靠算坐标。
        现在它搬进导航栏了、也改成 pointer-events:auto，
        上面那圈 while 循环就能正常找到它。
     **留着不删**：万一以后有人又给它加回 pointer-events:none，
     这里还有一层保险，不至于"拖到桶上却没反应"。
     多花的那点开销可以忽略（只在松手的那一瞬间算一次）。 */
  var tr=$('trash');
  if(tr){
    var r=tr.getBoundingClientRect();
    if(x>=r.left-22 && x<=r.right+22 && y>=r.top-22 && y<=r.bottom+22) return tr;
  }
  return null;
}

/* 这个投放区接不接得住手上这件东西。
   接得住 → 一拖起来它就亮粉圈，玩家一眼知道该往哪拖。 */
function zoneAccepts(zone, p){
  var t=zone.getAttribute('data-drop');
  if(t==='trash')   return p.kind==='poop';

  /* 锅只接食材：放新的进去、或者在锅里换位置。
     （锅里的食材拖到【别的格子】上就是交换，拖到【锅外】就是拿掉还回仓库） */
  if(t==='pot')     return p.kind==='ing' || p.kind==='pot';

  /* 熊头 / 订单槽 / 「🧸 小京」按钮，都接两种来源：
       out     = 锅里刚做好、正躺在成品格里的
       bagdish = 从【厨房最下面那排菜肴 ui】拖出来的（背包里得有货）
     —— 用户 2026-09-24 要求："我们把菜肴的 ui 也变成可拖拽，可以直接拖拽到订单去结算。"
        ⚠️ 他说的「菜肴的 ui」就是厨房那排菜肴图标，
           不是背包抽屉里的「🍲 菜肴仓库」—— 他专门纠正过一次。 */
  if(t==='bear')    return p.kind==='out' || p.kind==='bagdish';
  if(t==='order')   return p.kind==='out' || p.kind==='bagdish';
  if(t==='bearbtn') return p.kind==='out' || p.kind==='bagdish';

  return false;
}

/* 把「接得住我」的投放区全点亮 */
function markDropZones(p){
  Array.prototype.forEach.call(document.querySelectorAll('[data-drop]'), function(z){
    z.classList.toggle('drop-hot', zoneAccepts(z,p));
  });
}
function clearDropZones(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-drop]'), function(z){
    z.classList.remove('drop-hot');
    z.classList.remove('drop-over');
  });
}

function dragMove(e){
  if(!dragPayload) return;
  var dx=e.clientX-dragSX, dy=e.clientY-dragSY;
  if(!dragMoved){
    if(Math.abs(dx)+Math.abs(dy)<9) return;      /* 小抖动不算拖，防止误触 */
    dragMoved=true;
    dragGhost=document.createElement('div');
    dragGhost.className='dragGhost';
    dragGhost.textContent=dragIconOf(dragPayload);
    document.body.appendChild(dragGhost);
    markDropZones(dragPayload);
  }
  dragGhost.style.left=e.clientX+'px';
  dragGhost.style.top=e.clientY+'px';

  /* 高亮「手指正悬在上面的那一个」 */
  var zone=dropZoneAt(e.clientX,e.clientY);
  Array.prototype.forEach.call(document.querySelectorAll('[data-drop].drop-hot'), function(z){
    z.classList.toggle('drop-over', z===zone);
  });

  if(e.cancelable) e.preventDefault();
}

function dragEnd(e){
  document.removeEventListener('pointermove',dragMove);
  document.removeEventListener('pointerup',dragEnd);
  document.removeEventListener('pointercancel',dragEnd);
  if(dragGhost){ dragGhost.remove(); dragGhost=null; }

  var p=dragPayload;
  if(dragMoved && p){
    dragBlock=Date.now()+350;    /* 拖完这一下，别顺手又把下面那格点了 */
    var zone=dropZoneAt(e.clientX,e.clientY);
    if(zone && zoneAccepts(zone,p)){
      doDrop(zone,p);
    }else{
      /* 哪儿都没落上 */
      if(p.kind==='pot'){
        /* 从锅里拖出锅外 = 拿掉这一格。
           放进去的时候已经扣过库存，所以这里要还回去 —— 玩家不亏东西。 */
        S.pot[p.i]=null;
        sfx('ingPick');              /* 轻轻一下"嗒" —— 把食材拿出来了 */
        toast('把食材拿出来了，还回仓库');
        save(); paint();
      }else if(p.kind==='poop'){
        toast('没对准，要把粑粑拖到左边导航栏那个桶里');
      }else if(p.kind==='out'){
        toast('可以拖给左边的订单交货，也可以拖给熊头或者 🧸 按钮');
      }else if(p.kind==='bagdish'){
        toast('拖到左边要它的那个订单上，就能交货啦');
      }
    }
  }
  clearDropZones();
  dragPayload=null; dragMoved=false;
}

/* 真正落地：哪个投放区 + 拖的是什么 */
function doDrop(zone, p){
  var t=zone.getAttribute('data-drop');

  /* ---------- 💩 丢进垃圾桶 ---------- */
  if(t==='trash'){ collectPoop(p.i); return; }

  /* ---------- 放进锅里 / 在锅里挪位置 / 两格交换 ---------- */
  if(t==='pot'){
    var i=parseInt(zone.getAttribute('data-i'),10);
    if(p.kind==='ing'){
      if(S.pot[i]){ toast('这一格已经有东西啦'); return; }
      if(haveMat(p.id)<=0){ toast('仓库里没有这个食材哦'); return; }
      /* ⚠️ 放进去的瞬间就扣库存（拿掉会还回来）。
         这样背包里看到的数字永远是真的，
         不会出现「锅里摆着一个、仓库里也还留着一个」的幽灵食材。 */
      S.pot[i]=p.id;
      takeMat(p.id,1);
      sfx('ingDrop');                 /* 木头的"嗒" —— 食材落进锅 */
      save(); paint();
      return;
    }
    if(p.kind==='pot'){
      if(i===p.i) return;
      /* 目标格空着 → 挪过去；目标格有东西 → **两个交换位置**。
         用户 2026-09-24 原话："我希望已经放进九宫格里的食物，可以交换，
         例如 1 放了蜂蜜，2 放了糖。我把蜂蜜拖到糖上，它们就可以交换位置。"
         ⚠️ 所以这里【绝对不能再拦】「这一格已经有东西啦」——
            拦了就没法交换了。（以前就是那么拦的，这次改掉了。） */
      var tmp=S.pot[i];
      S.pot[i]=S.pot[p.i];
      S.pot[p.i]=tmp;
      sfx('ingSwap');                 /* 连着两下"嗒嗒" —— 两格换位置 */
      save(); paint();
      return;
    }
    return;
  }

  /* ---------- 交给熊头垃圾桶（小京吃） ---------- */
  if(t==='bear'){ feedToBear(p); return; }

  /* ---------- 交给订单槽（交货结算） ---------- */
  if(t==='order'){ deliverToOrder(parseInt(zone.getAttribute('data-i'),10), p); return; }

  /* ---------- 交给左侧「🧸 小京」按钮（收进菜肴仓库） ---------- */
  if(t==='bearbtn'){ storeToBag(p); return; }
}
/* 把一块地上的💩收进桶里。
   ⚠️ silent 参数是【小京自动捡】用的 —— 他干活是不出声的（用户特别要求，
      原话："小京种菜收菜收粑粑都是没声音的（不然会很吵）"）。
      只有玩家自己拖着扔进去的那一下，才会响「吧唧」。 */
function collectPoop(i, silent){
  var k=S.poops.indexOf(i);
  if(k<0) return;
  S.poops.splice(k,1);
  S.dung++;
  S.coins+=5;
  if(!silent) sfx('poopPick');        /* "吧唧" —— 玩家手动拖进去的 */
  pop(i,'🪙+5 🪣+1');
  save(); paint();
}
function addPoops(n){
  var free=[];
  for(var i=0;i<N;i++){
    if(S.plots[i].u && S.poops.indexOf(i)<0) free.push(i);
  }
  for(var j=0;j<n && free.length;j++){
    var idx=Math.floor(Math.random()*free.length);
    S.poops.push(free[idx]);
    free.splice(idx,1);
  }
}

/* ---------- 动物 ---------- */
function buyAnimal(id){
  var a=byAnimal(id);
  if(!a) return;
  if(S.animals[a.id]>=ANIMAL_MAX){ toast('已经有 '+ANIMAL_MAX+' 只'+a.n+'啦，够热闹的'); return; }
  if(S.coins<a.price){ toast('还差 '+Math.ceil(a.price-S.coins)+' 🪙'); return; }
  S.coins-=a.price;
  S.animals[a.id]++;
  if(!S.anT[a.id]) S.anT[a.id]=Date.now()+a.time*1000;
  toast('一只'+a.e+a.n+'住进来了，它爱吃'+a.fname);
  save(); paint();
}

setInterval(function(){
  var now=Date.now(), changed=false;
  if(animalTotal()<=0) return;
  var angry=animalsAngry();
  ANIMALS.forEach(function(a){
    var num=S.animals[a.id];
    if(num<=0) return;
    if(!S.anT[a.id]){ S.anT[a.id]=now+a.time*1000; return; }
    if(now<S.anT[a.id]) return;
    S.anT[a.id]=now+a.time*1000;
    if(angry) return;
    var have=S.store[a.feed]||0;
    var made=Math.min(num,have);
    if(made<=0) return;
    S.store[a.feed]-=made;
    S.store[a.out]=(S.store[a.out]||0)+made;
    S.seen[a.out]=1;
    changed=true;
    flyFromEl(anBox.querySelector('[data-a="'+a.id+'"]'), '+'+made+' '+byGood(a.out).e);
  });
  if(changed){ save(); paint(); }
},300);

/* ---------- 粑粑生成 ---------- */
setInterval(function(){
  var total=animalTotal();
  if(total<=0) return;
  var now=Date.now();
  if(!S.poopT){ S.poopT=now+12000; return; }
  if(now<S.poopT) return;
  S.poopT=now+12000;
  var made=0;
  for(var i=0;i<total;i++){ if(Math.random()<0.35) made++; }
  if(made<=0) return;
  addPoops(made);
  save(); paint();
},1000);

/* ---------- 工坊 ---------- */
/* 点工坊卡片，分三种情况：
   ① 已经加工好了 → 收进仓库
   ② 正在加工中   → 提示再等等
   ③ 闲着         → 扣掉材料，开始计时 */
function craft(i){
  var c=CRAFTS[i];
  var og=byGood(c.out);

  if(S.craftReady[i]){ collectCraft(i); return; }
  if(S.craftT[i]){ toast('还在加工中，再等等～'); return; }

  if(c.multi){
    for(var k in c.multi){
      if((S.store[k]||0)<c.multi[k]){
        var gg=byGood(k);
        toast((gg?gg.n:k)+'还不够，要 '+c.multi[k]+' 个');
        return;
      }
    }
    for(var k2 in c.multi){ S.store[k2]-=c.multi[k2]; }
  } else {
    var fg=byGood(c.from);
    if((S.store[c.from]||0)<c.need){ toast(fg.n+'还不够，要 '+c.need+' 个'); return; }
    S.store[c.from]-=c.need;
  }

  S.craftT[i]=Date.now();
  toast('开始加工 '+og.e+og.n+'，要 '+c.time+' 秒');
  save(); paint();
}

/* 把加工好的东西收进仓库 */
function collectCraft(i){
  var c=CRAFTS[i], og=byGood(c.out);
  S.store[c.out]=(S.store[c.out]||0)+1;
  S.seen[c.out]=1;
  S.craftT[i]=0;
  S.craftReady[i]=0;
  toast('收到了一份 '+og.e+og.n);
  save(); paint();
}

/* 有没有「加工好了还没收」的东西 —— 给导航栏的小叹号用 */
function anyCraftReady(){
  for(var i=0;i<CRAFTS.length;i++){ if(S.craftReady[i]) return true; }
  return false;
}

/* ---------- 工坊：计时推进 + 到点标记为「待收获」 ---------- */
setInterval(function(){
  var busy=false, done=false;
  CRAFTS.forEach(function(c,i){
    if(!S.craftT[i] || S.craftReady[i]) return;
    if(Date.now() - S.craftT[i] >= c.time*1000){ S.craftReady[i]=1; done=true; }
    else busy=true;
  });
  if(done){
    save();
    toast('工坊里有东西做好啦，记得去收 🏭');
    paint();
    return;
  }
  if(busy) paint();   /* 加工中 → 每半秒重画一次，进度条才会动 */
},500);

/* ---------- 弹窗底层（overlay / panel） ----------
   注意：这套弹窗原来是和「做饭小游戏」一起写的。
   小游戏被删掉了，但弹窗本身还要用 ——
   金库、探险、导入导出、菜谱一览，全都靠它。 */
var overlay=$('overlay'), panel=$('panel');

/* ============================================================
   九宫格做菜（2026-09-22 全新）
   ------------------------------------------------------------
   玩法：把食材从上面的食材区拖进锅里摆好 → 点「提交」。
         摆得跟某一道菜的九宫格【一模一样】才做得出来（位置算数）；
         摆得不对 → 做出一份 ☠︎ 黑暗料理。

   有三件事已经在别处保证好了，这里只负责判定：
     · 食材放进去的瞬间就扣了库存（doDrop）
     · 成品格堵着的时候「提交」是灰的（paintKitchen）
     · 黑暗料理只能喂小京，而且不给饱食度（feedToBear）
   ============================================================ */

/* 拿锅里现在的 9 格去跟所有菜谱比对，返回做出来的那道菜；没对上返回 null。
   ⚠️ 必须跳过 noCook 的菜 —— 丸子串串的九宫格是全空的，
      不跳过的话「空锅提交」会直接刷出一份丸子串串。 */
function potMatch(){
  for(var i=0;i<DISHES.length;i++){
    var d=DISHES[i];
    if(d.noCook) continue;
    var r=RECIPES[d.id];
    if(!r) continue;
    var ok=true;
    for(var k=0;k<POT_N;k++){
      if((r[k]||'') !== (S.pot[k]||'')){ ok=false; break; }
    }
    if(ok) return d;
  }
  return null;
}

function submitPot(){
  /* 成品格还堵着 → 不许做下一道（用户原话：成品格「不可覆盖」） */
  if(S.potOut){ toast('先把成品处理掉，才能做下一道哦'); return; }

  var any=false;
  for(var i=0;i<POT_N;i++){ if(S.pot[i]) any=true; }
  if(!any){ toast('锅里空空的，先把食材拖进去'); return; }

  var got=potMatch();
  if(got){
    S.potOut={kind:'dish', id:got.id};
    S.seen[got.id]=1;                    /* 做成功过 → 以后才会出现在订单里 */
    sfx('cookOk');                       /* 上行三音"叮—咚—叮"：成了！ */
    dishNotice(got, got.e+' 做好啦！');
    toast('成功做出'+got.n+'，把它拖到左边要它的那个订单上吧');
  }else{
    S.potOut={kind:'dark'};
    sfx('cookBad');                      /* 下行二音"呜—呃"：砸了 */
    dishNotice(DARK_DISH, '这锅东西的颜色……有点不对劲……');
    toast('做成了 ☠︎ 黑暗料理，只能拖给熊头让小京吃掉');
  }

  /* 锅清空。食材在放进去的时候就已经扣掉了，这里不用再扣一次。 */
  for(var k=0;k<POT_N;k++) S.pot[k]=null;
  save(); paint();
}

/* ============================================================
   成品 / 手上的菜，往哪儿去（2026-09-24 大改）
   ------------------------------------------------------------
   现在有两种「手上拿着菜」的情况，共用同一套出口：
     p.kind === 'out'     锅里刚做好、正躺在成品格里的
     p.kind === 'bagdish' 从【厨房最下面那排菜肴 ui】拖出来的（背包里得有货）

   三条出口：
     ① 拖给熊头垃圾桶     → 喂小京
     ② 拖给订单槽         → 交货收钱
     ③ 拖给「🧸 小京」按钮 → 收进背包
   ============================================================ */

/* ① 拖给熊头垃圾桶 = 让小京吃它。

   ⚠️⚠️ 规则在 2026-09-24 收紧过一次，现在的版本是：
        熊头【只吃】小熊料理和黑暗料理。
        普通的菜拖上去 → 提示「小京才不要吃这个呢！」，而且什么都不消耗。
        用户原话："熊头只吃小熊料理和黑暗料理，其他的拖拽了没反应，
                  会提示小京才不要吃这个呢！"

   为什么黑暗料理不加饱食度：这是作者亲自抓出来的漏洞 ——
     往锅里随便丢一个食材提交就能刷出黑暗料理，
     要是加饱食度，玩家就能无限刷小京的饱食度。

   为什么普通菜连吃都不给吃：喂小京有专门的正规入口
     （抽屉里的投喂界面，只有小熊料理能喂）。
     熊头在这里的角色是「小京伸到厨房里的那张嘴」，不是垃圾桶 ——
     普通菜的出路是拖给「🧸 小京」按钮收进背包，再从背包拖给订单卖掉。 */
function feedToBear(p){
  if(!p) return;

  /* ---- 从成品格拖来的 ---- */
  if(p.kind==='out'){
    var out=S.potOut;
    if(!out) return;

    if(out.kind==='dark'){
      S.potOut=null;
      sfx('bearEat');                /* 小京吃黑暗料理：闷闷的"啊呜" */
      toast('小京把 ☠︎ 黑暗料理吞了下去，皱着脸说：“味道……很复杂。”');
      save(); paint();
      return;
    }

    var d=byDish(out.id);
    if(!d) return;
    if(d.bear){
      /* 小熊料理本来就是给小京的 —— 走和抽屉里投喂完全一样的逻辑 */
      S.potOut=null;
      sfx('bearEat');                /* 小京吃掉了 */
      eatDish(d);
      save(); paint();
      return;
    }
    toast('小京才不要吃这个呢！');
    return;
  }

  /* ---- 从背包抽屉拖来的 ---- */
  if(p.kind==='bagdish'){
    var d2=byDish(p.id);
    if(!d2) return;
    if((S.dish[d2.id]||0)<=0){ toast('背包里已经没有'+d2.n+'了'); return; }
    if(d2.bear){
      S.dish[d2.id]=(S.dish[d2.id]||0)-1;
      sfx('bearEat');                /* 小京吃掉了 */
      eatDish(d2);
      save(); paint();
      return;
    }
    toast('小京才不要吃这个呢！');
    return;
  }
}

/* ② 拖到订单槽 = 交货结算。
   对得上就付钱、这个槽自己换成下一道菜；对不上就什么都不发生。
   ⚠️ 两个来源都要支持：成品格里的（out）和厨房菜肴列表拖出来的（bagdish）。 */
function deliverToOrder(i, p){
  var o=S.orders[i];
  if(!o || !p) return;

  var d=null, fromOut=false;

  if(p.kind==='out'){
    var out=S.potOut;
    if(!out) return;
    if(out.kind!=='dish'){ toast('黑暗料理不能交订单哦'); return; }
    d=byDish(out.id);
    fromOut=true;
  }else if(p.kind==='bagdish'){
    d=byDish(p.id);
    if(!d) return;
    if((S.dish[d.id]||0)<=0){ toast('背包里已经没有'+d.n+'了'); return; }
  }else{
    return;
  }
  if(!d) return;

  if(d.id!==o.id){
    toast('这个订单要的不是它哦');
    return;
  }

  var gain=money(o.pay);
  S.coins+=gain;
  if(fromOut) S.potOut=null;                   /* 从成品格拿走 */
  else S.dish[d.id]=(S.dish[d.id]||0)-1;       /* 从背包里扣掉 */
  S.orders[i]=makeOrder();                     /* 交付完立刻变成下一道菜 —— 全自动 */
  sfx('pay');                                  /* 钱的声音：收银机 + 一串金币落下 */
  toast('交付成功，+'+gain+' 🪙');
  save(); paint();
}

/* ③ 拖到左侧「🧸 小京」按钮 = 收进背包（菜肴仓库）。
   用户 2026-09-24 原话：功能不用改，"只改弹窗信息『小京先帮你放到包包里』"。
   普通菜的出路就是这一条 —— 收进背包之后，再从背包拖给订单卖钱。 */
function storeToBag(p){
  if(!p) return;

  if(p.kind==='bagdish'){
    /* 它本来就在背包里，拖回背包当然什么都不用做 */
    toast('它本来就在包包里呀');
    return;
  }
  if(p.kind!=='out') return;

  var out=S.potOut;
  if(!out) return;
  if(out.kind!=='dish'){
    toast('黑暗料理进不了背包，拖给熊头让小京吃掉吧');
    return;
  }
  var d=byDish(out.id);
  if(!d) return;
  S.dish[d.id]=(S.dish[d.id]||0)+1;
  S.seen[d.id]=1;
  S.potOut=null;
  toast('小京先帮你把 '+d.e+d.n+' 放到包包里');
  save(); paint();
}

/* 点一下食材 icon（不是拖）。
   手机上光靠拖容易漏掉，所以点一下也给一个反馈。
   ⚠️ 不自动丢进锅：位置算数，自动塞进去的位置八成是错的，

function tapPantry(id){

}

/* 【已删除 · 2026-09-22】
   这里原本有三块东西，现在全没了：

   ① cook(i)                —— 点菜谱直接做菜：占一个灶台、扣材料、进入倒计时
   ② setInterval(...,150)   —— 灶台计时推进：到点了就把火候小游戏弹出来
   ③ deliver(i)             —— 点订单卡片交付（那时候一个订单要凑齐三样货）

   现在对应的是：
     · 做菜 = 摆好九宫格 + 点「提交」    → submitPot()      （在上面）
     · 交付 = 把成品拖到左边的订单槽      → deliverToOrder() （在上面）

   两件事都不再需要任何计时器 —— 用户明确要求「取消做菜时间」。 */

/* ---------- 金库 ---------- */
function openWallet(){
  panel.innerHTML='<div class="ttl">💎 金库</div>'+
    '<div class="hintline" style="margin:0 0 14px">现在有 🪙'+Math.floor(S.coins)+' 和 💎'+S.gems+'</div>'+
    '<button class="catb" id="wBuy" style="background:#8fd0e8;box-shadow:0 4px 0 #6fb4d0">用 10000 🪙 换 1 💎</button>'+
    '<button class="catb" id="wSell" style="margin-top:9px;background:#c9a9e0;box-shadow:0 4px 0 #ab8ac4">用 1 💎 换 10000 🪙</button>'+
    '<div class="hintline">点空白的地方关掉</div>';
  overlay.classList.add('on');
  $('wBuy').addEventListener('click',function(){
    if(S.coins<10000){ toast('金币还不够 10000 呢'); return; }

  });
  $('wSell').addEventListener('click',function(){
    if(S.gems<1){ toast('还没有钻石呀'); return; }
    S.gems--; S.coins+=10000;
    toast('钻石换回 10000 🪙');
    save(); paint(); openWallet();
  });
}

overlay.addEventListener('click',function(e){
  if(e.target!==overlay) return;

});

/* 【已删除 · 2026-09-22】「🍯 用 1 蜂蜜刷新订单」的按钮和它的监听都没了。

/* 📖 菜谱：列出「已经成功做出来过」的菜（看 S.seen）。
