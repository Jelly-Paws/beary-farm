<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2a0bd">
<link rel="apple-touch-icon" href="icon.png">
<title>小熊小农场</title>
<style>
/* ============================================================
   小熊小农场 · 样式表
   ------------------------------------------------------------
   分区：
     1. 设计变量（颜色 + 层级表）
     2. 基础
     3. 通用组件
     4. 页面：农场 / 厨房 / 订单 / 小京
     5. 左侧导航栏 rail + 仓库抽屉 drawer
     6. 弹窗 · 飘字 · 提示条
     7. 拖拽与投放区
   ============================================================ */

/* ---------- 1. 设计变量 ---------- */
:root{
  /* 颜色 */
  --pink:     #f2a0bd;
  --pink-d:   #dd89a8;
  --rose:     #e2789f;
  --rose-l:   #f7c8dc;
  --ink:      #6b5145;
  --ink-2:    #7d6558;
  --ink-3:    #b09a8d;
  --ink-4:    #bda99c;
  --line:     #f2dfd4;
  --green:    #b6d99a;
  --green-d:  #9bc47e;
  --purple:   #c9a9e0;
  --purple-d: #ab8ac4;
  --blue:     #8fd0e8;
  --blue-d:   #6fb4d0;

  /* 层级表 —— 全文只有这里写 z-index 的数字，别处一律用 var()。
     从下往上一层压一层，谁该盖谁一读就懂，不用再去猜数字。 */
  --z-float:  20;   /* 飘字、场景内的浮动元素 */
  --z-mask:   40;   /* 抽屉遮罩 */
  --z-drawer: 50;   /* 抽屉本体 */
  --z-rail:   60;   /* 左侧导航栏：必须高于遮罩，按钮才永远点得到 */
  --z-pop:    65;   /* 右上角料理提示 */
  --z-modal:  70;   /* 弹窗 */
  --z-toast:  80;   /* 底部提示条 */
  --z-drag:   90;   /* 拖拽替身，跟手 */
  /* 【2026-09-22】层级表之外那档「特权 999」已经取消。
     它原本只给 #bearTrash 用，但那个写法是错的
     —— 熊头垃圾桶会浮在抽屉、遮罩、弹窗等一切面板之上，
        走到哪个页面都甩不掉它，对一个只在厨房用得到的东西毫无道理。
     现在全文 z-index 一律走上面这张表，一个例外都没有。
     （拖拽靠 elementFromPoint 找投放区，本来就不需要靠层级分胜负。） */

  /* 尺寸 */
  --rail-w: 58px;   /* 左侧导航栏宽度 —— 抽屉的起点就是它 */
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:14px 12px 46px calc(var(--rail-w) + 4px);min-height:100vh;
  background:linear-gradient(180deg,#ffeef6 0%,#fdf4e6 55%,#e9f7e4 100%);
  background-attachment:fixed;
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:#6b5145;display:flex;justify-content:center}
.wrap{width:100%;max-width:500px}
h1{font-size:19px;text-align:center;margin:4px 0 3px;color:#c96a8c;letter-spacing:2px}
.sub{text-align:center;font-size:12px;color:#bb9c8f;margin-bottom:12px}
.bar{display:flex;gap:6px;margin-bottom:8px}
.pill{flex:1;background:#fff;border-radius:18px;padding:8px 2px;text-align:center;
  font-size:13px;font-weight:700;box-shadow:0 4px 0 #f2dfd4;white-space:nowrap}
.pill.tap{cursor:pointer}
.pill.tap:active{transform:translateY(2px)}
/* 农场页里的两行小提示。
   【2026-09-24 拆开】原来这两行挤在页面顶部的货币栏下面，白占地方。
   用户要求拆开、各去各该在的位置：

     .buff     = 「×N 让卖出去的东西多赚 X%」
                 → 挂在农场页「小京的朋友」按钮下面
     .poopWarn = 「地上有 X 坨💩……」
                 → 挂在农场页田地下面、种子上面（只有点农场才看得到）

   ⚠️ 为什么「地上有💩」不能安安静静待在角落：
      粑粑攒够 6 坨，动物就全体罢工。光靠一行小字，玩家可能半小时都没发现
      —— 所以现在【顶部「🌱 农场」标签上还会亮一个小叹号】（见 .tab 那段）。 */
.buff{text-align:center;font-size:12px;font-weight:700;color:#c98aa4;margin:9px 0 0;
  min-height:16px;line-height:1.5}
/* ⚠️ 这个【故意不写 min-height】——
   没粑粑的时候它要完全不占地方（JS 会直接 display:none）。 */
.poopWarn{text-align:center;font-size:12px;font-weight:700;color:#d0885f;
  margin:0 0 9px;line-height:1.5}
.poopWarn.bad{color:#d06060}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:7px}
.row.dish{grid-template-columns:repeat(4,1fr);margin-bottom:8px}
.slot{background:#fff;border-radius:13px;padding:7px 2px;text-align:center;
  box-shadow:0 3px 0 #f2dfd4;font-size:15px;font-weight:700;color:#7d6558;line-height:1.15}
.farmIcon{display:inline-block;width:1em;height:1em;object-fit:contain;vertical-align:-.12em;
  flex:none;user-select:none;-webkit-user-drag:none}
.seed .farmIcon{width:21px;height:21px;vertical-align:middle}
.slot .n{font-size:11px;margin-left:2px;color:#b09a8d}
.slot.zero{opacity:.35}
.slot.d{background:#fffbf0}
.sellall{width:100%;border:0;border-radius:15px;padding:10px;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;background:#fff6e5;color:#c2913f;box-shadow:0 4px 0 #f3e6cd;
  margin-bottom:12px}
.sellall:disabled{opacity:.45;cursor:default}
.sellall:active:not(:disabled){transform:translateY(2px)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
/* ⚠️ `position:relative` 是给右上角的小叹号（.rail-badge）当定位基准的。
   现在「🌱 农场」标签上挂着「粑粑够多、动物要罢工」的叹号。
   为什么非要有这个叹号：那行「地上有 X 坨💩」的小字在农场页里，
   玩家不点农场就看不见 —— 而粑粑攒够 6 坨动物就罢工了，
   等他自己发现可能已经过去半小时。（用户原话） */
.tab{position:relative;flex:1;border:0;border-radius:14px;padding:10px 2px;cursor:pointer;
  font-family:inherit;font-size:12px;font-weight:800;background:#fff;color:#bda99c;
  box-shadow:0 4px 0 #f2dfd4;white-space:nowrap}
.tab.on{background:#f2a0bd;color:#fff;box-shadow:0 4px 0 #dd89a8}
.tab:active{transform:translateY(2px)}
.hide{display:none}
.secttl{font-size:12px;font-weight:800;color:#bda99c;margin:6px 0 7px;letter-spacing:1px}
.field{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.plot{position:relative;aspect-ratio:1/1;border:0;border-radius:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;
  background:#e4d3ba;box-shadow:inset 0 -6px 0 rgba(0,0,0,.07);overflow:hidden;
  transition:transform .12s ease;padding:0;color:#8d7565}
.plot:active{transform:scale(.94)}
.plot.empty{color:#c4ae95;font-size:26px}
.plot.growing{background:#d3e9bd}
.plot.ready{background:#ffefae}
.plot.ready .em{display:block;animation:bob .8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.plot.locked{background:#efe7dc;color:#b6a498;font-size:11px;font-weight:700;
  flex-direction:column;gap:3px}
.plot .farmIcon{width:1em;height:1em}
.plot .poop{position:absolute;right:1px;bottom:1px;font-size:19px;line-height:1;z-index:2;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
.prog{position:absolute;left:9px;right:9px;bottom:7px;height:6px;border-radius:8px;
  background:rgba(255,255,255,.75);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:8px;
  background:linear-gradient(90deg,#9ada6f,#6cc3a0);transition:width .15s linear}
.seeds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
/* 农场页的种子区：**每排 3 个**（用户 2026-09-27 要求："种子每排只有三个"）。
   为什么只点 #seeds、不直接改 .seeds：
     `.seeds` 这个类抽屉里的「投喂小京」也在用（#feedGrid），
     那边卡片更小，一起改成 3 列会挤成一团。 */
#seeds{grid-template-columns:repeat(3,1fr)}
/* 种子价格和生长时间保持同一行，避免窄卡片把秒数挤到下一行。 */
#seeds .p{white-space:nowrap}
.seed{border:0;cursor:pointer;border-radius:16px;padding:9px 8px;background:#fff;
  box-shadow:0 4px 0 #f2dfd4;font-family:inherit;color:#6b5145;display:flex;
  align-items:center;gap:7px;text-align:left;transition:transform .12s}
.seed:active{transform:translateY(2px);box-shadow:0 2px 0 #f2dfd4}
.seed .e{font-size:21px;flex:none}
.seed .info{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.seed .n{font-size:13px;font-weight:700}
.seed .p{font-size:11px;color:#b09a8d}
.seed.on{background:#fff0f6;box-shadow:0 0 0 3px #f7c8dc,0 4px 0 #f2dfd4}
.seed.poor{opacity:.45}
.seed.recipe{background:#fffaf1}
.crafts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
/* ============================================================
   4.5 厨房 · 九宫格锅（2026-09-22 新增）
   ------------------------------------------------------------
   这里原来是三口灶台 + 火候小游戏，已经整块删掉
   （用户要求：「取消三个灶台，取消做菜时间」）。
   现在的厨房从上到下是四层：
     ① 🧺 食材区   —— 只有 icon，拖进锅
     ② 🔥 九宫格锅 —— 靠左；右边是「当前选的菜」+「菜谱缩略图」
     ③ 提交行      —— 成品格（左）· 提交（中）· 熊头垃圾桶（右）
     ④ 📖 菜肴列表 —— 每行 3 个，点一下选中
   ============================================================ */

/* 食材区：**只有 icon，没有名字也没有数量** —— 格子太小放不下字。
   有没有货靠「灰不灰」区分，不靠数字。 */
/* 食材区：**每排 7 个**（用户 2026-09-27 要求："厨房食材区改成七个食材一排"）。 */
.pantry{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}
/* ⚠️ 下面这些「要被拖着走的东西」，必须关掉浏览器的默认触摸手势。
   不关的话，手指一滑页面就先滚起来了，浏览器会直接把这次拖动 cancel 掉，
   表现就是「拖到一半突然松手」。

   现在的名单是：食材区 / 锅格子 / 成品格 / 菜肴列表。
   —— 菜肴列表是 2026-09-24 加进来的（它现在也是拖拽源，能直接把菜拖给订单）。

   代价：在这几片方块【上面】滑动不能滚页面 ——
   方块之间有 6~7px 的缝，想滚页面从缝里滑、或者从别的地方滑都行。 */
.pantryItem,.potCell,.outSlot,.dishBtn{touch-action:none}
.pantryItem{border:0;cursor:pointer;border-radius:13px;aspect-ratio:1/1;padding:0;
  background:transparent;box-shadow:none;font-size:32px;line-height:1;font-family:inherit;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,opacity .12s}
.pantryItem:active{transform:scale(.94)}
.pantryItem.zero{opacity:.3}   /* 仓库里没有这个食材 → 变灰 */

/* 锅 + 左边那一栏。
   ⚠️ 2026-09-24 左右镜像翻转过：以前是【锅在左、提示在右】，
      现在是【提示在左、锅在右】。用户原话：
      "改成九宫格放在右侧，缩略图和菜肴的名字放在左侧。
       （因为游玩的时候一般都是用右手大拇指来玩，
        缩略图放在右侧的话，来回就会被遮到，看不清楚）"
      所以 DOM 顺序是 [potSide][pot]：左边提示、右边锅。 */
/* ⚠️ 2026-09-27 又调过一次尺寸（用户要求）：
      "稍微缩小右侧九宫格区，增大左侧菜谱区，做到两个区域一样高度"
   所以：锅 66% → 58%，而且 .potWrap 从 align-items:flex-start 改成 stretch ——
   这样左边那一栏会被【拉满到和锅一样高】，两个区域顶边底边都对齐。
   左边两块（缩略图 / 菜名）各自 flex:1，把多出来的高度平分掉。 */
.potWrap{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.pot{flex:none;width:58%;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:0;background:transparent;box-shadow:none;border-radius:0}
.potCell{border:2px dashed #dcc4ad;padding:0;aspect-ratio:1/1;border-radius:14px;
  background:transparent;box-shadow:none;font-size:30px;line-height:1;color:#c4ae95;
  font-family:inherit;display:flex;align-items:center;justify-content:center;
  transition:transform .12s,background .12s}
.potCell.has{background:rgba(255,240,246,.45);box-shadow:none}
.potSide{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}

/* 左上那一格：菜谱缩略图（2026-09-24 挪到左边，而且挪到名字【上面】了）。
   故意做得很小 —— 用户原话：「大小要小，不要把九宫格挤没了」。
   为什么放上面：用户说「缩略图靠近食材的话，肉眼会比较舒服，比较好对照」。 */
.potRef{background:#fff;border-radius:16px;padding:7px;box-shadow:0 4px 0 #f2dfd4;
  flex:1;display:flex;flex-direction:column;justify-content:center}
.potRef .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.potRef .mini i{aspect-ratio:1/1;border-radius:7px;background:transparent;font-style:normal;
  font-size:16px;line-height:1;color:#c4ae95;
  display:flex;align-items:center;justify-content:center}

/* 左下那一格：当前选中的菜（icon + 名字）。
   （2026-09-24 之前它在右上，现在挪到左边、并且在缩略图【下面】。） */
.potPick{background:#fff;border-radius:16px;padding:8px 5px;text-align:center;
  box-shadow:0 4px 0 #f2dfd4;font-size:11px;font-weight:800;color:#7d6558;line-height:1.25;
  flex:1;display:flex;flex-direction:column;justify-content:center}
.potPick .pe{display:block;font-size:26px;line-height:1.1;margin-bottom:2px}
.potPick .farmIcon{width:1em;height:1em}
.potPick.empty{color:#c4ae95;font-weight:700}

/* 提交行：成品格（左）· 提交（中）· 熊头垃圾桶（右）。

   ⚠️ 2026-09-24 改成【铺满整行】。以前它只有锅那么宽（66%），右边空出一大片。
      用户原话："这个提交的按钮太短了，导致有一侧空的地方太多不好看，
                我希望这个提交的按钮足够长，让侧边不要有空位。"
      所以宽度从 66% 改成 100%（跟上面「提示栏 + 锅」加起来一样宽），
      提交按钮 flex:1 把中间那一大段全吃掉。 */
.potBar{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:16px}
/* 成品格：提交之前是空的（留空），提交之后才出现东西。
   ⚠️ 它有东西的时候【不许被下一道菜覆盖】——
      所以「提交」按钮这时候是灰的，必须先把它处理掉。 */
.outSlot{flex:none;width:52px;height:52px;border-radius:16px;background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1;
  box-shadow:0 4px 0 #f2dfd4,0 0 0 2px #f7c8dc inset;transition:transform .15s}
.outSlot.empty{font-size:20px;color:#e4d3ba;box-shadow:0 4px 0 #f2dfd4}
.potGo{flex:1;border:0;border-radius:16px;padding:15px 4px;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:800;color:#fff;background:#f2a0bd;box-shadow:0 4px 0 #dd89a8}
.potGo:disabled{opacity:.45;cursor:default}
.potGo:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #dd89a8}

/* 菜肴列表：每行 5 个，**只有 icon，没有名字**（用户 2026-09-24 要求）。

   两种高亮，含义不一样，别搞混：
     .have —— 背包里【有】这道菜 → 粉色底。
              用户原话："如果背包里面有这道菜，那么这个菜肴的渲染框就是粉色的。
                        我们不应该让不存在于背包的菜是灰色的，
                        因为其实大部分菜背包里都不会有存货的，就很不好看。"
     .on   —— 当前【选中】的是这道菜 → 粉色粗描边。
   两个可以叠加：选中 + 有货 = 粉底 + 粉边。 */
.recipes{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-bottom:12px}
.dishBtn{border:0;cursor:pointer;border-radius:14px;padding:0;aspect-ratio:1/1;
  background:#fff;box-shadow:0 3px 0 #f2dfd4;font-family:inherit;font-size:24px;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s,box-shadow .12s,background .12s}
.dishBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #f2dfd4}
.dishBtn.have{background:#fff0f6}
.dishBtn.on{box-shadow:0 0 0 3px #f7c8dc,0 3px 0 #f2dfd4}

/* 「📖 菜谱图鉴」弹窗里的小格子（点左侧「📖 菜谱」按钮弹出来的那个）。
   为什么要单独一套：厨房那片菜肴列表现在是「只有 icon、每行 5 个」，
   而图鉴是给玩家看的记录 —— 光有 emoji 认不出是什么，所以它保留名字。 */
.guideGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  max-height:300px;overflow-y:auto}
.guideItem{background:#fffbf0;border-radius:14px;padding:8px 4px;text-align:center;
  box-shadow:0 3px 0 #f2dfd4;font-size:11px;font-weight:700;color:#7d6558;line-height:1.25}
.guideItem .e{display:block;font-size:24px;line-height:1.1;margin-bottom:3px}
.anbox{display:flex;flex-direction:column;gap:6px;margin-bottom:9px}
.anrow{background:#fff;border-radius:14px;padding:9px 11px;font-size:12px;font-weight:700;
  color:#7d6558;box-shadow:0 3px 0 #f2dfd4;line-height:1.45}
.anrow.bad{background:#fff2f2;color:#c97070;box-shadow:0 3px 0 #f6dede}
.anrow .em{font-size:16px;margin-right:3px}
.buyb{width:100%;border:0;border-radius:16px;padding:10px 12px;cursor:pointer;font-family:inherit;
  font-size:13px;font-weight:700;background:#fff;color:#6b5145;box-shadow:0 4px 0 #f2dfd4;
  margin-bottom:7px;display:flex;align-items:center;gap:8px;text-align:left}
.buyb:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #f2dfd4}
.buyb:disabled{opacity:.45}
.buyb .be{font-size:19px}
.buyb .bn{flex:1}
.buyb .bp{color:#c2913f;white-space:nowrap}
.catb{width:100%;border:0;border-radius:18px;padding:12px;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:700;color:#fff;background:#f2a0bd;box-shadow:0 4px 0 #dd89a8}
.catb:disabled{opacity:.45;cursor:default}
.catb:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #dd89a8}
.toggle{width:100%;margin-top:9px;border:0;border-radius:18px;padding:11px;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:700;background:#fff;color:#b09a8d;
  box-shadow:0 4px 0 #f2dfd4}
.toggle.on{background:#eefaf0;color:#5aa06f;box-shadow:0 4px 0 #d6eedd}
.toggle:active{transform:translateY(2px)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  font-size:12px;color:#bda99c;gap:10px}
.foot button{border:0;background:none;font-family:inherit;font-size:12px;color:#bda99c;
  text-decoration:underline;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(107,81,69,.45);display:none;
  align-items:center;justify-content:center;z-index:var(--z-modal);padding:18px}
.overlay.on{display:flex}
.panel{background:#fff;border-radius:26px;padding:18px;width:100%;max-width:330px;
  box-shadow:0 10px 0 rgba(0,0,0,.08);text-align:center}
.panel .ttl{font-size:15px;font-weight:800;color:#c96a8c;margin-bottom:12px;line-height:1.4}
.panel .big{font-size:24px}
.panel .hintline{font-size:12px;color:#b09a8d;margin-top:10px}
/* 【已删除 · 2026-09-22】火候小游戏的两个控件本来在这里：
     .gbar  —— 横条 + 指针，指针进绿区时点一下
     .gline —— 九宫格划点，按 1→2→3→4 划过去
   灶台取消之后它们没有载体了，CSS 连同 JS 里的
   genPts / triggerEvent / buildEventUI / checkHit / hitPoint /
   needlePos / endEvent / rafLoop 一起删掉（总纲第 6 条：删干净）。
   —— 以后想复活火候玩法，记得连上面这些一起重写，别只加回 CSS。 */
.pop{position:fixed;transform:translate(-50%,0);font-size:15px;font-weight:800;
  color:#e2789f;pointer-events:none;animation:fly 1s ease-out forwards;
  text-shadow:0 1px 0 #fff;z-index:var(--z-float)}
@keyframes fly{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}
  25%{opacity:1}100%{opacity:0;transform:translate(-50%,-46px) scale(1.06)}}
.catfly{position:fixed;transform:translate(-50%,-50%);font-size:22px;pointer-events:none;
  z-index:var(--z-float);animation:catpop .7s ease-out forwards}
@keyframes catpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  40%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}
  100%{opacity:0;transform:translate(-50%,-95%) scale(1)}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  background:rgba(107,81,69,.92);color:#fff;font-size:13px;padding:9px 16px;
  border-radius:16px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:var(--z-toast);
  max-width:86%;text-align:center}
.toast.on{opacity:1}
/* 🗑️ 垃圾桶（💩 的投放区）
   ------------------------------------------------------------
   【2026-09-24 第二次搬家】它原来固定在屏幕右下角，
   结果把农场页下半部分的按钮盖得死死的 ——
   用户截图里「小京的朋友已经够多了」和「小京顺手替你补种」两个按钮都被它压住。

   现在它住进左侧导航栏，位置在【订单槽上面、那条粉色小横线的上方】——
   那一竖条本来就是空的，放这儿不挡任何东西。
   代价：导航栏只有 58px 宽，所以它从 62px 缩到了 46px。 */
#trash{
  pointer-events: auto;
  flex: none;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 4px 0 #f2dfd4, 0 0 0 3px #ffeef5 inset;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  line-height: 1;
  transition: transform .15s;
}
/* ⚠️ 🗑️ 是圆的，通用那圈方形 outline 套上去很难看 ——
   所以它不用 outline 提示，只用「放大」来告诉玩家「松手就丢这儿」。 */
#trash.drop-hot{outline:none}
#trash.drop-over{outline:none;transform:scale(1.18)}
/* 【已删除 · 2026-09-24】#trashTip（"拖到这"那行小字）。
   垃圾桶搬进导航栏之后，那里只有 46px 宽，塞不下字；
   而且桶本身就是一个明确的投放区，不需要额外标注了。 */
/* 拖拽替身：跟着手指跑的那个 icon。
   名字从 .poopGhost 改成 .dragGhost —— 现在三种东西（💩 / 食材 / 成品）
   共用同一套拖拽骨架，不再只是粑粑了。 */
.dragGhost{position:fixed;transform:translate(-50%,-50%);font-size:30px;
  pointer-events:none;z-index:var(--z-drag);filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
.dragGhost .farmIcon{width:1em;height:1em}

/* ---------- 投放区的高亮 ----------
   每个能接东西的元素都带一个 data-drop 属性（见 JS 的「统一拖拽骨架」）。
   拖动一开始，凡是「接得住你手上这个东西」的投放区都会亮起粉圈，
   告诉你该往哪儿拖；手指悬上去时颜色加深、轻微放大。
   用 outline 而不是 box-shadow —— 不覆盖各元素自己的那层「下沿厚投影」。 */
[data-drop].drop-hot{outline:3px solid #f7c8dc;outline-offset:2px}
[data-drop].drop-over{outline:3px solid #e2789f;outline-offset:3px;transform:scale(1.08)}
/* 小熊投喂页 */
.fullWrap{background:#fff;border-radius:20px;padding:14px 14px 12px;box-shadow:0 4px 0 #f2dfd4;
  margin-bottom:14px;text-align:center}
.bearBig{font-size:54px;line-height:1;margin:2px 0 12px;display:inline-block;
  transition:transform .2s}
.bearBig.happy{animation:bearbob 1.2s ease-in-out infinite}
@keyframes bearbob{0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-6px) scale(1.07)}}
.fullBar{height:20px;border-radius:10px;background:#f6ead9;overflow:hidden;margin-bottom:9px}
.fullBar i{display:block;height:100%;width:0;border-radius:10px;
  background:linear-gradient(90deg,#ffd88a,#f2a0bd);transition:width .4s ease}
.fullTxt{font-size:12px;font-weight:700;color:#b09a8d;line-height:1.55}
/* 【已删除 · 2026-09-22】订单页那一整片样式本来在这里：
     .ordersFull / .orderCard / .orderItems / .orderItem / .orderBottom
   它们伺候的是「一个订单凑三样货」的旧订单卡片。
   订单大改之后（只剩一道菜、只显示 icon、搬进左侧导航栏），
   这些类名一个都不再有元素挂着了，所以连样式一起删干净。
   新订单槽的样式在「5. 左侧导航栏」那一段里，类名是 .oslot。 */
.dishPop{position:fixed;top:12px;right:12px;background:#fff;border-radius:16px;
  padding:10px 14px;box-shadow:0 6px 0 #f2dfd4,0 0 0 3px #fff0f6 inset;
  font-size:13px;font-weight:700;color:#6b5145;z-index:var(--z-pop);opacity:0;
  transform:translateX(20px);transition:opacity .3s,transform .3s;pointer-events:none;
  display:flex;align-items:center;gap:8px;max-width:78%;line-height:1.4}
.dishPop.on{opacity:1;transform:translateX(0)}
.dishPop .de{font-size:22px;flex:none}
/* ============================================================
   5. 左侧导航栏 rail + 仓库抽屉 drawer
   ------------------------------------------------------------
   核心设计：【不重叠】
     · rail 贴屏幕最左，永远可见、永远可点
     · drawer 从 rail 的右边展开，两者在空间上完全不重叠
     · 所以它们之间不需要靠 z-index 分胜负 ——
       层级只用来处理「和遮罩的关系」
   好处：以后再加新按钮，只要往 rail 里加一个，
        不用动任何层级，也不会遮住任何东西。
   ============================================================ */

.rail{
  position: fixed;
  left: 0;
  top: 0;
  bottom: 0;
  width: var(--rail-w);
  padding: 12px 0;
  display: flex;
  flex-direction: column;   /* 竖排是定案：横排放在上方会把顶栏挤爆 */
  align-items: center;
  gap: 8px;
  z-index: var(--z-rail);
  pointer-events: none;     /* 栏内空白可以点穿，方便点遮罩关抽屉 */
}
.rail-btn{
  pointer-events: auto;
  flex: none;
  position: relative;       /* 给右上角的小叹号当定位基准 */
  width: 50px;
  height: 50px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border: 0;
  border-radius: 17px;
  font-family: inherit;
  font-size: 18px;
  line-height: 1;
  color: #fff;
  background: var(--pink);
  box-shadow: 0 4px 0 var(--pink-d);
  cursor: pointer;
  transition: transform .12s ease;
}
.rail-btn .lb{ font-size: 9px; font-weight: 800; letter-spacing: .5px; }
.rail-btn:active{ transform: translateY(2px); box-shadow: 0 2px 0 var(--pink-d); }
.rail-btn.is-on{ background: #fff; color: var(--pink); box-shadow: 0 4px 0 var(--line); }

/* 导航栏按钮右上角的小叹号：有东西等着你处理时才出现。
   现在用在「工坊加工好了没收」和「小京探险回来了」两处。 */
.rail-badge{
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 17px;
  height: 17px;
  border-radius: 9px;
  background: var(--rose);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  line-height: 17px;
  text-align: center;
  box-shadow: 0 0 0 2px #fff;
  display: none;
}
.rail-badge.is-on{ display: block; }

/* ---------- 订单槽：长在导航栏里，但它【不是按钮】 ----------
   用户原话：「订单抽屉其实是根本打不开的……它只是位置在左侧抽屉区而已，
             但它其实根本不是一个抽屉。」
   所以它长得跟上面的按钮**故意不一样**：
     按钮    = 实心粉底、有文字、点得开抽屉
     订单槽  = 奶油底 + 粉色虚线框、里面只有一个菜肴 icon、点不开任何东西
   一眼就能看出「这里是可以放东西的地方」，而不是「这里可以点」。

   五个槽各自独立：把对应的成品（或者背包里的菜）拖上来就结算付钱，
   然后它自己变成下一道菜。
   ⚠️ 槽的个数由 ORDER_SLOTS 决定，2026-09-24 从 3 个加到了 5 个。
   （后期可以在槽下面加进度条、时间条、叹号 —— 留了位置。） */
.rail-orders{
  margin-top: auto;        /* 推到导航栏底部，和上面那排按钮分家 */
  margin-bottom: 18px;
  padding-top: 12px;
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 7px;
  flex: none;              /* 屏幕矮的时候不许被压扁 —— 它是投放区，扁了就拖不准 */
}
/* 一条粉色小横线，把「按钮区」和「订单区」隔开 */
.rail-orders::before{
  content: '';
  position: absolute;
  top: 0; left: 6px; right: 6px;
  height: 2px;
  border-radius: 2px;
  background: #f7c8dc;
}
.oslot{
  pointer-events: auto;
  width: 44px;
  height: 44px;
  border-radius: 14px;
  /* ⚠️ 2026-09-27 改：框线从「粉色虚线」改成「粉色实线」。
     新规矩（用户原话）：
       "订单刷新出来后：框是粉色实线"
       "订单未刷新出来时：框是灰色虚线"
     所以：默认 = 有订单 = 实线；加了 .wait = 冷却中 = 灰虚线。 */
  border: 2px solid #f7c8dc;
  background: #fffaf1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  line-height: 1;
  transition: transform .15s;
}
/* 冷却中：交付之后 8~15 秒才会有新订单，这期间显示 ❌，
   框是灰色虚线，而且【不接东西】（见 zoneAccepts）。 */
.oslot.wait{
  border: 2px dashed #d9d2ca;
  background: #f7f4f1;
  color: #c9c1b8;
}
/* 新订单出现时「蹦一下」：放大 + 轻微摆动，然后回原样。
   ！只有 .pop 这个类在的时候才会动，画完就把类摘掉（见 paintOrders）。 */
@keyframes oslotPop{
  0%   { transform: scale(1)    rotate(0deg); }
  30%  { transform: scale(1.38) rotate(-9deg); }
  55%  { transform: scale(1.15) rotate(7deg); }
  78%  { transform: scale(1.26) rotate(-4deg); }
  100% { transform: scale(1)    rotate(0deg); }
}
.oslot.pop{ animation: oslotPop .6s ease-out; }

/* 订单区的小标题。
   为什么非要加它（用户原话）：
     "否则其实玩家根本不知道这五个莫名其妙的图案是做什么用的"
   —— 5 个槽里只显示一个菜肴 emoji，没有文字的话谁也猜不到那是订单。
   要求：**就一行小字，不要加背景块**（比底色更浅、更轻）。 */
.rail-note{
  font-size: 9px;
  font-weight: 800;
  color: #c4ae95;
  text-align: center;
  letter-spacing: 1px;
  line-height: 1;
  margin-bottom: 2px;
}

/* ---------- 工坊 ----------
   ⚠️ 2026-09-27：这一块原来有「卡片自己计时（.cprog 进度条）+ 做好待收（.done 抖一抖）」，
      改成排队流水线之后它们全都不用了 —— 进度条挪到了抽屉顶部那一块（.craftNow）。
      所以 .cprog / .working / .done 这三条样式已经删掉，不要照着老代码加回来。 */

/* ---------- 工坊 · 2026-09-27 改成「排队流水线」之后新加的几块 ----------
   旧做法：7 个配方各占一个格子，各自计时、各自收（还能两个槽同时做糖）。
   新做法（用户定的）：点一下 = 排进队伍，队伍从前往后依次做，
   每个固定 10 秒；做好的堆在「待收取」里，点一次按钮全收走。
   所以下面三块是新的：顶部「正在做」进度条、卡片上的排队数、一键收取按钮。 */

/* 顶部的「正在做 · 还要 N 秒」+ 进度条 */
.craftNow{
  background: #fff;
  border-radius: 16px;
  padding: 9px 11px;
  margin-bottom: 10px;
  box-shadow: 0 4px 0 #f2dfd4;
  font-size: 12px;
  font-weight: 800;
  color: #7d6558;
}
.craftNow .cq{
  display: block;
  height: 7px;
  border-radius: 5px;
  background: #f2dfd4;
  overflow: hidden;
  margin-top: 7px;
}
.craftNow .cq i{
  display: block;
  height: 100%;
  width: 0;
  border-radius: 5px;
  background: linear-gradient(90deg,#9ada6f,#6cc3a0);
  transition: width .3s linear;
}
.craftNow.idle{ color: #b09a8d; }

/* 「一键收取」按钮：待收取里没东西时是灰的、点不动 */
.craftCollect{
  width: 100%;
  border: 0;
  border-radius: 16px;
  padding: 13px 6px;
  margin-bottom: 10px;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  background: #f2a0bd;
  box-shadow: 0 4px 0 #dd89a8;
}
.craftCollect:disabled{ opacity: .45; cursor: default; }
.craftCollect:active:not(:disabled){ transform: translateY(2px); box-shadow: 0 2px 0 #dd89a8; }

/* 卡片右上角的「排队 ×N」小角标 */
.seed{ position: relative; }
.seed .cqbadge{
  position: absolute;
  top: -5px;
  right: -4px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  border-radius: 9px;
  background: #f2a0bd;
  color: #fff;
  font-size: 10px;
  font-weight: 800;
  line-height: 17px;
  text-align: center;
  box-shadow: 0 2px 0 #dd89a8;
}

.drawerMask{
  position: fixed;
  inset: 0;
  background: rgba(107,81,69,.4);
  z-index: var(--z-mask);
  display: none;
}
.drawerMask.is-on{ display: block; }

.drawer{
  position: fixed;
  left: var(--rail-w);      /* 从导航栏右边开始 —— 绝不覆盖按钮 */
  top: 0;
  bottom: 0;
  right: 0;                 /* 铺满手机（用户要求：展开后可以沾满手机） */
  max-width: 420px;         /* 但桌面端别拉成一整条，太难看 */
  background: #fffefb;
  border-radius: 0 22px 22px 0;
  box-shadow: 4px 0 20px rgba(107,81,69,.15);
  z-index: var(--z-drawer);
  /* 收起时往左滑走：自身宽度 + 导航栏宽度，才算完全出屏。
     不能只写百分比 —— 抽屉宽度是 min(62vw,290px)，
     写死百分比会在窄屏上露出一条边。 */
  transform: translateX(calc(-100% - var(--rail-w) - 8px));
  transition: transform .28s ease;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 12px 20px;
}
.drawer.is-on{ transform: translateX(0); }

/* 抽屉里的分类标签 */
.drawer-tabs{
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}
.dtab{
  border: 0;
  background: #fff;
  color: var(--ink-4);
  border-radius: 12px;
  padding: 6px 11px;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  box-shadow: 0 2px 0 var(--line);
  cursor: pointer;
  transition: transform .1s ease;
}
.dtab:active{ transform: translateY(1px); }
.dtab.is-on{ background: var(--pink); color: #fff; box-shadow: 0 2px 0 var(--pink-d); }

/* 抽屉里的区块：标题和内容是「一对」，
   永远一起出现、一起消失 —— 不会再出现空标题孤零零挂着 */
.dsec{ margin-bottom: 14px; }
.dsec-ttl{
  font-size: 12px;
  font-weight: 800;
  color: var(--ink-4);
  margin: 0 0 7px;
  letter-spacing: 1px;
}

/* 抽屉里格子改每行 4 个，适应窄屏 */
.drawer .row{ grid-template-columns: repeat(4,1fr); }
.drawer .row.dish{ grid-template-columns: repeat(4,1fr); }
/* 【已删除 · 2026-09-24】这里本来有一条 .drawer .slot.d{ touch-action:none }，
   因为那时候我把「能拖去交订单」的拖拽源错挂在了抽屉的菜肴仓库上。
   用户纠正之后，拖拽源改成了【厨房最下面那排菜肴 ui】，这条就没用了。 */
.drawer .slot{ padding: 6px 2px; font-size: 13px; }
.drawer .slot .n{ font-size: 10px; }

/* ---------- 【火候 999】全文唯一的 !important ----------
   格子 / 区块的显隐必须压过其它所有布局规则，
   所以这里有意使用最高优先级。这不是遗留问题，是有意为之。
   —— 想动它之前，先确认不会影响到别处的显隐逻辑。 */
.is-hidden{ display: none !important; }

/* ---------- 7. 拖拽与投放区 ---------- */

/* 🐻 熊头垃圾桶 = 厨房里的「喂小京」投放区
   ------------------------------------------------------------
   【2026-09-22 大改】它从「固定在屏幕右下角、z-index 写死 999」
   变成了「挂在九宫格锅下面右侧的一个普通布局元素」。

   为什么把 999 拿掉：那个数字本来就是错的。
   它原意是「投放区必须永远能被拖到」，但写死成最高层级之后，
   熊头会浮在【一切】面板之上 —— 抽屉、遮罩、弹窗、导入导出框，
   走到哪都能看见它。一个只在厨房用的东西，没有理由到处刷存在感。

   现在它老老实实呆在自己的位置上，不抢层级。
   拖拽本身靠 elementFromPoint 找投放区（见 JS），
   根本不需要靠层级分胜负 —— 这跟当初解决
   「导航栏 vs 抽屉」是同一个思路：不重叠，就不用比火候。 */
#bearTrash{
  flex: none;
  width: 52px;
  height: 52px;
  /* 2026-09-27 用户要求："小熊的位置向下挪一点，上面标注垃圾桶三个字" */
  margin-top: 22px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  line-height: 1;
  transition: transform .15s;
  filter: drop-shadow(0 3px 4px rgba(0,0,0,.18));
}
/* 熊头上面的「垃圾桶」三个字 —— 样式照搬订单区那个 .rail-note
   （9px、浅褐、字距 1px），保持整页小标签是同一套长相。 */
#bearTrash::before{
  content: '垃圾桶';
  position: absolute;
  top: -11px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 800;
  color: #c4ae95;
  letter-spacing: 1px;
  line-height: 1;
  white-space: nowrap;
}

body{padding:8px 8px 40px calc(var(--rail-w) + 7px);background:var(--px-bg);color:var(--px-ink);display:block;font-family:"Courier New","Microsoft YaHei",monospace}
.wrap{width:100%;max-width:none;margin:0 auto}
h1{position:relative;min-height:34px;display:flex;align-items:center;margin:0 0 7px;padding:4px 84px 4px 38px;text-align:left;font-size:17px;letter-spacing:1px;color:#fff0f8;background:var(--px-plum);border:2px solid var(--px-pink);box-shadow:3px 3px 0 var(--px-shadow)}
h1::before{content:"";position:absolute;left:7px;top:50%;width:24px;height:24px;transform:translateY(-50%);background:var(--ui-sprout) center/contain no-repeat;image-rendering:pixelated}
h1::after{content:"━　□　×";position:absolute;right:7px;top:50%;transform:translateY(-50%);font:700 13px/1 "Courier New",monospace;letter-spacing:0;color:#ffe7f3}
.sub{display:none}
.bar{gap:5px;margin:0 0 10px}
.bar .pill,.slot{min-height:42px;padding:7px 2px;color:var(--px-ink);background:#fff1f8;border:7px solid transparent;border-image:var(--ui-pink64) 10 fill/9px/0 stretch;border-radius:0;box-shadow:none;font-family:inherit}
.bar .pill{font-size:12px}
.tabs{gap:4px;margin:0 0 9px}
.tab{position:relative;min-height:40px;padding:5px 2px;border:7px solid transparent;border-image:var(--ui-purple32) 8/7px/0 stretch;border-radius:0;background:var(--px-plum);box-shadow:none;color:#fff0f8;font-family:inherit;font-weight:800}
.tab.on{color:var(--px-ink);background:var(--px-pink);border-image:var(--ui-pink64) 10/7px/0 stretch;box-shadow:none}
#tabFarm,#tabKitchen{font-size:0}
#tabFarm::before,#tabKitchen::before{content:"农场";display:inline-block;padding-left:28px;background:var(--ui-home) left center/24px 24px no-repeat;font-size:14px;line-height:24px;image-rendering:pixelated}
#tabKitchen::before{content:"厨房";background-image:var(--ui-soup)}
#tabFarm .rail-badge{font-size:10px}
.field{gap:6px;margin:0 0 9px;padding:7px;background:#ffeefa;border:8px solid transparent;border-image:var(--ui-pink64) 10 fill/10px/0 stretch}
.plot{border:0;border-radius:0;background-color:#825043;background-image:var(--ui-soil);background-position:center;background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated;box-shadow:none}
.plot.empty,.plot.growing,.plot.ready{background-color:#825043;background-image:var(--ui-soil)}
.plot.locked{border:0;border-radius:0;background:#e6d7e1;box-shadow:inset 0 0 0 2px #b59caf}
.plot .farmIcon{image-rendering:pixelated}
.prog,.craftNow .cq,.fullBar{border-radius:0}
#seeds{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin:0 0 10px;padding:6px;background:#fff0f7;border:8px solid transparent;border-image:var(--ui-pink64) 10 fill/10px/0 stretch}
#seeds::before{content:"🌱 种子";grid-column:1/-1;min-height:24px;padding:2px 6px;color:#fff1f8;background:var(--px-plum);font-size:13px;font-weight:800;letter-spacing:1px}
#seeds .seed{min-width:0;min-height:78px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;color:var(--px-ink);background:#fff4fa;border:6px solid transparent;border-image:var(--ui-pink64) 10 fill/7px/0 stretch;border-radius:0;box-shadow:none;font-family:inherit}
#seeds .seed.on{background:#ffe1ef;border-image:var(--ui-pink64) 10 fill/7px/0 stretch;box-shadow:inset 0 0 0 1px var(--px-pink2)}
#seeds .seed .e{font-size:26px;line-height:1.05}
#seeds .seed .farmIcon{width:27px;height:27px;image-rendering:pixelated}
#seeds .seed .info{width:100%;min-width:0;align-items:center;line-height:1.05}
#seeds .seed .n{font-size:10px;line-height:1.1;white-space:nowrap}
#seeds .seed .p{font-size:8px;line-height:1.1;white-space:nowrap;color:var(--px-muted)}
.seed .cqbadge{border-radius:0}
.rail{width:var(--rail-w);gap:6px;padding:8px 4px;background:var(--px-plum);border-right:2px solid var(--px-outline);box-shadow:2px 0 0 var(--px-shadow)}
.rail-btn{width:42px;height:42px;gap:0;border:7px solid transparent;border-image:var(--ui-purple32) 8/7px/0 stretch;border-radius:0;color:#fff2f9;background:var(--px-plum2);box-shadow:none;font-family:inherit}
.rail-btn#drawerBtn,.rail-btn#recipeBtn{font-size:0}
.rail-btn#drawerBtn::before,.rail-btn#recipeBtn::before{content:"";display:block;width:24px;height:24px;background-position:center;background-size:contain;background-repeat:no-repeat;image-rendering:pixelated}
.rail-btn#drawerBtn::before{background-image:var(--ui-sprout)}
.rail-btn#recipeBtn::before{background-image:var(--ui-book)}
.rail-btn .lb{display:block;margin-top:2px;font-size:7px;letter-spacing:0;line-height:1;color:inherit;white-space:nowrap}
.rail-btn.is-on{background:var(--px-pink);border-image:var(--ui-pink64) 10/7px/0 stretch;box-shadow:none;color:var(--px-ink)}
.rail-orders{gap:4px;margin-bottom:8px;padding-top:8px}
.rail-orders::before{left:3px;right:3px;height:2px;border-radius:0;background:var(--px-pink)}
.rail-note{margin:0 0 2px;color:#f6c9df;font-size:8px;letter-spacing:1px}
.oslot{width:38px;height:38px;border:2px solid var(--px-pink2);border-radius:0;background:#fff1f8;box-shadow:2px 2px 0 var(--px-shadow);font-size:20px}
.oslot.wait{border:2px dashed #a895a8;background:#eadde7;box-shadow:none}
#trash{border-radius:0}
#shop{margin-top:4px;padding:6px;background:#fff0f7;border:8px solid transparent;border-image:var(--ui-pink64) 10 fill/10px/0 stretch}
#shop::before{content:"🛒 商店";display:block;margin:0 0 6px;padding:4px 6px;color:#fff1f8;background:var(--px-plum);font-size:13px;font-weight:800;letter-spacing:1px}
#shop .buyb,.buyb,.catb,.craftCollect,.potGo,.sellall,.toggle{border-radius:0}
#shop .buyb,.buyb,.sellall,.toggle,.guideItem,.anbox,.anrow,.potRef,.dishBtn,.potCell,.outSlot,.craftNow,.panel{border-radius:0}
#shop .buyb,.buyb,.sellall{background:#fff4fa;border:6px solid transparent;border-image:var(--ui-pink64) 10 fill/7px/0 stretch;box-shadow:none;color:var(--px-ink)}
.catb,.craftCollect{background:var(--px-plum);box-shadow:inset 0 0 0 2px #a65388,3px 3px 0 #321438;color:#fff1f8}
.drawer{color:var(--px-ink);background:#fff2f8;border-left:3px solid var(--px-outline);border-radius:0;box-shadow:3px 0 0 var(--px-shadow)}
.drawer-tabs .dtab,.potPick,.potRef,.potCell,.outSlot,.dishBtn{border-radius:0}
.drawer-tabs .dtab{border:6px solid transparent;border-image:var(--ui-pink64) 10/6px/0 stretch;background:#fff1f8;box-shadow:none;color:var(--px-ink)}
.drawer-tabs .dtab.is-on{background:var(--px-pink);color:var(--px-ink)}
.potCell{border-color:var(--px-outline);background:#fff1f8}
.panel{background:#fff1f8;border:8px solid transparent;border-image:var(--ui-pink64) 10 fill/10px/0 stretch;box-shadow:3px 3px 0 var(--px-shadow);color:var(--px-ink)}
.panel .ttl{color:var(--px-plum)}
.toast{border:2px solid var(--px-pink);border-radius:0;background:var(--px-plum);box-shadow:3px 3px 0 var(--px-shadow)}
@media(max-width:430px){
 body{padding-right:5px;padding-left:calc(var(--rail-w) + 5px)}
 .bar{gap:3px}.bar .pill{font-size:10px;min-height:38px}
 .field{gap:4px;padding:5px;border-width:6px}
 #seeds{gap:3px;padding:4px;border-width:6px}
 #seeds .seed{min-height:70px;padding:3px 1px;border-width:5px}
 #seeds .seed .e{font-size:23px}
 #seeds .seed .n{font-size:9px}
 #seeds .seed .p{font-size:7px}
}
/* End of pixel UI alignment with supplied sprite assets. */
</style>
</head>
<body>
<div class="wrap">
  <h1>小熊小农场</h1>
  <div class="sub">种地 · 喂动物 · 捡粑粑 · 做饭 · 喂小京</div>
  <div class="bar">
    <div class="pill">🪙 <span id="coins">0</span></div>
    <div class="pill tap" id="gemsPill">💎 <span id="gems">0</span></div>
    <div class="pill"><img class="farmIcon" src="图标/material/honey.png" alt=""> <span id="honey">0</span></div>
    <div class="pill">🧸 <span id="bears">0</span></div>
  </div>
  <!-- 【2026-09-24 搬走】提示区原来在这儿（货币栏下面），白占一行地方。
       现在拆成两块、各去各该在的位置（都在农场页里）：
         「×N 让卖出去的东西多赚 X%」   → 「小京的朋友」按钮下面（#buff）
         「地上有 X 坨💩……」          → 田地下面、种子上面（#poopWarn）
       另外：粑粑攒够 6 坨时，顶部「🌱 农场」标签上会亮一个小叹号（#farmBadge） -->

<!-- ========== 左侧导航栏 ==========
     永远钉在屏幕最左，竖排；抽屉打开时它不会移动、不会被盖住。
     上半部分：四个「点得开抽屉」的按钮。
     下半部分：三个「订单槽」—— 它们不是按钮，是投放区，
               把成品拖上去就结算（详见 CSS 里的说明）。

     以后要加新入口（比如「配方书」），往下加一个 rail-btn 就行，
     不用改任何层级，也不会挤到别人。 -->

<script>

var KEY='kitty-farm-v1';
/* ORDER_SLOTS：订单槽个数。2026-09-24 用户从 3 个加到 5 个
   —— 原话："订单数量增加到五个（因为我玩的时候一不小心给自己穷死了）"
   导航栏左侧会有 5 个订单槽，那里空着不好看，挤一挤刚好。 */
/* ============================================================
   音效系统（2026-09-24 新增）
   ------------------------------------------------------------
   全部声音都是**代码现场合成**的，不加载任何音频文件 ——
   所以游戏还是一个单文件 html，也没有任何素材版权问题。

   ⚠️⚠️ 四条必须知道的，改之前先看完：

     ① 手机浏览器的死规矩：**用户第一次点屏幕之前，声音一律放不出来。**
        所以第一次 pointerdown 时会偷偷"解锁"一次（audioUnlock）。
        这是浏览器的安全规定，绕不过去，别试图在页面一打开就出声。

     ② **用户明确说不要静音开关。** 原话：
        "妈的还想静音？不许静音！静音我不就白做了！"
        所以界面上【没有】那个按钮 —— 想安静就按手机的音量键。
        （引擎里保留了 masterGain 这一层，哪天用户改主意要开关，加个按钮就行。）

     ③ **小京自动干活是不出声的**（用户特别要求，原话：
        "小京帮我做事是没有声音的，小京种菜收菜收粑粑都是没声音的（不然会很吵）"）。
        所以凡是小京自动触发的 harvest / collectPoop，都要传 silent = true。
        ⚠️ 这条很容易在以后加音效时被破坏 —— 加音效时先问一句：
           "这一下是玩家干的，还是小京自动干的？"

     ④ 音量（表里的 `v`）别超过 0.4，不然会爆音、也吵。

   加新音效 = 往 SOUNDS 表里加一行 + 在要响的地方写 sfx('名字')。
   ============================================================ */

var AC = null;            /* AudioContext：整套声音的总开关 */
var masterGain = null;    /* 总音量（现在固定 0.5，留这一层是为了以后能加音量条） */

function audioUnlock(){
  if(AC) return;
  try{
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;                       /* 老浏览器没有这个能力 */
    AC = new Ctx();
    masterGain = AC.createGain();
    masterGain.gain.value = 0.5;
    masterGain.connect(AC.destination);
  }catch(e){
    AC = null;                             /* 出错就彻底放弃声音，游戏照常玩 */
  }
}
/* 第一次点屏幕时解锁。用 pointerdown 而不是 load，因为必须发生在"用户手势"里。 */
document.addEventListener('pointerdown', function(){
  audioUnlock();
  if(AC && AC.state === 'suspended'){ try{ AC.resume(); }catch(e){} }
});

/* ---------- 音效配方表 ----------
   一个音效 = 若干个「音符」（parts）+ 可选的「噪声层」（noise）。

   音符：{ f: 起始频率, f2: 结束频率（省了就变平音，有就滑过去）,
           t: 什么时候开始（秒，省了就是 0）, d: 持续多久, v: 多大声,
           w: 波形 —— 省了就是 'sine'（最柔）
         }
   噪声：{ d: 持续多久, v: 多大声, f: 中心频率, q: 集中程度 }

   ⚠️⚠️ 【2026-09-24 第二版：全部改成可爱治愈风】⚠️⚠️
      第一版被用户骂惨了 —— 原话："听得我他妈的拳头想喝血了"。
      原因有两个，都是我的错：
        ① 用了 `sawtooth`（锯齿波）—— 这个波形天生就是"刺"的
        ② 用了噪声（noise）—— 噪声本质上就是"呲——"的一声

      **所以《《 现在一个噪声都没有、一个锯齿波都没有 》》。**
      全部只用 `sine`（正弦波），这是最柔和的波形。

      可爱治愈风的四条配方（改音效之前先读这四条）：
        ① **只用 sine**。sawtooth / square 一律不许出现。
        ② **音高往上走**。上行 = 开心、可爱、有精神；下行 = 沉重、失落。
           （只有"失败"那种音才允许**轻微**下行，而且要短、要高，别掉到 400Hz 以下。）
        ③ **频率待在 420 ~ 2400Hz 之间**。
           低于 400 会闷、会"砸"；高于 2600 会尖。
        ④ **音量不超过 0.24**，而且"可爱"的声音往往是**小而轻**的。
           想让它更明显，**加长衰减（d）**，不要加大音量。

      另外两个万能的"可爱"公式：
        · **上滑的水泡**：f 到 f2 往上滑（比如 660→990）→ 听着像"啵"，很萌
        · **八音盒**：短促的起音 + 长长的尾巴（d 拉到 0.3~0.45）→ 像敲了一下钢片琴 */
var SOUNDS = {

  /* ---------- 厨房 ---------- */
  /* 食材落进锅：小水泡"啵"（往上滑一点点，轻轻放下） */
  ingDrop: { parts:[{f:660, f2:990, d:0.09, v:0.20}] },
  /* 食材拿出来：更短、更轻的一下 */
  ingPick: { parts:[{f:880, f2:1100, d:0.06, v:0.13}] },
  /* 锅里两格交换：两个小水泡"啵啵" */
  ingSwap: { parts:[{f:660, f2:990,  d:0.08, v:0.17},
                    {f:740, f2:1110, d:0.08, v:0.15, t:0.085}] },
  /* 成功做出一道菜：八音盒上行三音"叮—咚—叮"
     （最后一个音特意拉长到 0.45 秒，那是"做好了！"的余韵） */
  cookOk:  { parts:[{f:880,  f2:880,  d:0.16, v:0.18},
                    {f:1109, f2:1109, d:0.16, v:0.18, t:0.10},
                    {f:1319, f2:1319, d:0.45, v:0.20, t:0.20}] },
  /* 黑暗料理：**只许轻微下滑、不许刺耳**。
     像"唔…哦"，垂头丧气但依然软软的，还是用 sine。 */
  cookBad: { parts:[{f:590, f2:520, d:0.14, v:0.15},
                    {f:494, f2:420, d:0.26, v:0.14, t:0.13}] },
  /* 小京吃掉了：开心的两下（往上走）—— "嗯！好吃" */
  bearEat: { parts:[{f:520, f2:700, d:0.09, v:0.17},
                    {f:620, f2:840, d:0.11, v:0.15, t:0.10}] },

  /* ---------- 订单交货：钱的声音 ----------
     用户要求"像钱的声音"。
     做法：两声清脆的上行（收银机弹开）+ 后面撒一串很短的高音（金币一枚枚落下）。
     全部是 sine，所以清脆但不刺耳。 */
  pay: { parts:[
      {f:1046, f2:1046, d:0.14, v:0.20},
      {f:1568, f2:1568, d:0.40, v:0.20, t:0.085},
      {f:2093, f2:2093, d:0.10, v:0.10, t:0.22},
      {f:2349, f2:2349, d:0.10, v:0.09, t:0.29},
      {f:1975, f2:1975, d:0.10, v:0.08, t:0.36}
    ] },

  /* ---------- 农场 ---------- */
  /* 手动把💩丢进桶里：用户要的"piaji（吧唧）"。
     ⚠️ 第一版我做成了"低频锯齿波 + 噪声"，用户听了想喝血。
        现在改成**两个弹跳的小水泡**（"啵叽"）——
        不像真实声音，但俏皮、不刺耳，这才是这个游戏该有的味道。 */
  poopPick: { parts:[{f:520, f2:880,  d:0.08, v:0.19},
                     {f:700, f2:1180, d:0.10, v:0.16, t:0.085}] },
  /* 施肥：倒东西的"沙沙沙"。
     ⚠️ 第一版也是噪声，同样被骂。
        现在改成**六颗小沙粒落下来**（六个很短的高音错开）——
        听着像小铃铛撒了一地，可爱又不吵。 */
  fert: { parts:[
      {f:1320, f2:1320, d:0.05, v:0.090},
      {f:1480, f2:1480, d:0.05, v:0.085, t:0.055},
      {f:1240, f2:1240, d:0.05, v:0.080, t:0.110},
      {f:1560, f2:1560, d:0.05, v:0.075, t:0.165},
      {f:1380, f2:1380, d:0.05, v:0.070, t:0.220},
      {f:1660, f2:1660, d:0.07, v:0.065, t:0.275}
    ] }
};

/* 播放一个音效。名字写错 / 还没解锁 / 浏览器不支持 → 安静跳过，绝不报错。 */
function sfx(name){
  if(!AC || !masterGain) return;
  if(AC.state === 'suspended') return;
  var cfg = SOUNDS[name];
  if(!cfg) return;

  var t0 = AC.currentTime;

  /* --- 音符层 --- */
  (cfg.parts || []).forEach(function(p){
    var start = t0 + (p.t || 0);
    var end   = start + p.d;
    var o = AC.createOscillator();
    var g = AC.createGain();
    o.type = p.w || 'sine';
    o.frequency.setValueAtTime(Math.max(1, p.f), start);
    if(p.f2 && p.f2 !== p.f){
      o.frequency.exponentialRampToValueAtTime(Math.max(1, p.f2), end);
    }
    /* 音量包络：猛地起、慢慢落 —— 这样听着像乐器，而不是"哔"的一声电子音。
       ⚠️ exponentialRamp 的目标不能是 0，只能用 0.0001 这种极小值。 */
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, p.v), start + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, end);
    o.connect(g); g.connect(masterGain);
    o.start(start); o.stop(end + 0.03);
  });

  /* --- 噪声层 --- */
  if(cfg.noise){
    var n = cfg.noise;
    var len = Math.max(1, Math.ceil(AC.sampleRate * n.d));
    var buf = AC.createBuffer(1, len, AC.sampleRate);
    var dat = buf.getChannelData(0);
    for(var i=0;i<len;i++) dat[i] = Math.random() * 2 - 1;
    var src = AC.createBufferSource(); src.buffer = buf;
    var flt = AC.createBiquadFilter();
    flt.type = 'bandpass';
    flt.frequency.value = n.f || 1000;
    flt.Q.value = n.q || 1;
    var ng = AC.createGain();
    ng.gain.setValueAtTime(n.v, t0);
    ng.gain.exponentialRampToValueAtTime(0.0001, t0 + n.d);

   —— 觉得贵或便宜，改这一行就行。 */
var PLOT_PRICE=[0,0,0,0,0,0,0,0, 500,780,1200,1800, 2700,4000,6000,9000];

function byGood(id){ for(var i=0;i<GOODS.length;i++){ if(GOODS[i].id===id) return GOODS[i]; } return null; }
function byId(id){ for(var i=0;i<CROPS.length;i++){ if(CROPS[i].id===id) return CROPS[i]; } return null; }
function byDish(id){ for(var i=0;i<DISHES.length;i++){ if(DISHES[i].id===id) return DISHES[i]; } return null; }

/* 物品图标：已有 PNG 的物品使用独立图片；没有图片的物品保留原显示符号。 */

  berry:'crop/berry.png', rice:'crop/rice.png', carrot:'crop/carrot.png', cane:'crop/cane.png',

  alcohol:'material/alcohol.png', lemon:'material/lemon.png', meat:'material/meat.png',

  salad:'dish/salad.png', cocoa:'dish/cocoa.png', pasta_shrimp:'dish/pasta_shrimp.png',

function itemIcon(id,fallback,className){
  var file=ITEM_ICON_FILES[id];
  if(!file) return fallback||'';
  return '<img class="farmIcon'+(className?' '+className:'')+'" src="图标/'+file+'" alt="" draggable="false" loading="lazy" decoding="async">';
}
function byAnimal(id){ for(var i=0;i<ANIMALS.length;i++){ if(ANIMALS[i].id===id) return ANIMALS[i]; } return null; }

/* ---------- 存档 ---------- */
function fresh(){
  var p=[],st={},dy={},pot=[];
  for(var i=0;i<N;i++) p.push({u:i<8?1:0,c:null,t:0});   /* 开局送 8 块地 */
  GOODS.forEach(function(g){ st[g.id]=0; });
  DISHES.forEach(function(d){ dy[d.id]=0; });
  for(var k=0;k<POT_N;k++) pot.push(null);              /* 锅：开局九格全空 */
  return {
    /* 初始金 500（2026-09-22 从 100 提上来的 —— 100 开局买不了几颗种子） */
    coins:500, honey:0, gems:0, bears:0, sel:CROPS_SORTED[0].id, auto:1,
    plots:p, store:st, dish:dy, seen:{berry:1}, orders:[], orderT:[],
    animals:{hen:0,cow:0,pig:0}, anT:{hen:0,cow:0,pig:0},
    poops:[], dung:0, poopT:0,
    full:0, fullT:0,
    expedition:null,
    /* 工坊（2026-09-27 改成排队流水线，旧的三件套 craftT / craftReady 已经不用了）：
         craftQ     —— 排队的队伍。每一项是一个【配方下标】，材料在排队那一刻就扣掉了。
         craftQStart— 当前正在做的那一件的开始时间戳；0 = 队伍空着。
         craftDone  —— 做好了、还没收走的产物 id 列表，可以堆很多个。 */
    craftQ:[], craftQStart:0, craftDone:[], craftVer:2,
    /* 厨房九宫格（2026-09-22 加）：
         pot    —— 锅里 9 格，每格是 null 或者食材 id
         potSel —— 当前在菜肴列表里选中的菜。
                   ⚠️ 它只决定「右边显示哪道菜的提示」，**不参与判定**。
                      提交的时候是拿锅去跟所有菜谱比对，跟选没选无关。
         potOut —— 成品格：null，或者
                   {kind:'dish', id:'salad'} = 一道正常的菜
                   {kind:'dark'}             = ☠︎ 黑暗料理 */
    pot:pot, potSel:null, potOut:null
  };
}

var S=null;
try{ S=JSON.parse(localStorage.getItem(KEY)); }catch(e){ S=null; }
if(!S||!S.plots){ S=fresh(); }
else{
  /* 旧字段迁移：鱼→蜂蜜，猫→小熊 */
  if(typeof S.honey!=='number') S.honey = (typeof S.fish==='number' ? S.fish : 0);
  if(typeof S.bears!=='number') S.bears = (typeof S.cats==='number' ? S.cats : 0);
  delete S.fish; delete S.cats;
  if(typeof S.full!=='number') S.full=0;
  if(typeof S.bubbleBuffT!=='number') S.bubbleBuffT=0;
  if(typeof S.fullT!=='number') S.fullT=0;
  if(typeof S.expedition==='undefined') S.expedition=null;
  if(S.dish) delete S.dish.fishtew;

  while(S.plots.length<N) S.plots.push({u:0,c:null,t:0});
  if(S.plots.length>N) S.plots.length=N;
  if(typeof S.auto==='undefined') S.auto=1;
  /* S.sel 的语义在 2026-09-24 改过：
     以前存的是「在 CROPS 里的下标」，现在存的是「作物 id」。
     原因：种子列表加了自动排序、又删掉了南瓜 ——
           下标会随着数据表的增删而漂移（旧存档里的 3 可能已经不是同一颗种子了）。
           存 id 就永远不会错位。
     旧存档里那个 number 型的 sel 一律作废，重置成排在第一位的种子。 */
  if(typeof S.sel!=='string' || !byId(S.sel)) S.sel = CROPS_SORTED[0].id;
  if(typeof S.gems!=='number') S.gems=0;
  if(typeof S.dung!=='number') S.dung=0;
  if(typeof S.poopT!=='number') S.poopT=0;
  if(!S.store) S.store={};
  GOODS.forEach(function(g){ if(typeof S.store[g.id]!=='number') S.store[g.id]=0; });
  if(!S.dish) S.dish={};
  DISHES.forEach(function(d){ if(typeof S.dish[d.id]!=='number') S.dish[d.id]=0; });
  if(!S.seen) S.seen={berry:1};

  /* ---------- 厨房九宫格：旧存档迁移（2026-09-22）----------
     旧存档里根本没有这三个字段，补上一个空锅就行，不会丢档。
     顺手把没用的 S.stoves（三口灶台）扔掉 —— 它已经没有任何代码读它了。 */
  /* ---------- 2026-09-24：南瓜整条线都被删掉了，清掉存档里的残留 ----------
     删东西要删干净（总纲第 6 条）——不光代码里没有，
     玩家存档里那些「已经不存在的东西」也要一起扫掉，否则
     地块上会永远长着一颗没有名字的南瓜、仓库里会永远躺着一个卖不掉的南瓜。 */
  delete S.store.pumpkin;
  delete S.dish.pie;
  delete S.seen.pumpkin;
  delete S.seen.pie;
  S.plots.forEach(function(p){
    if(p.c && !byId(p.c)){ p.c=null; p.t=0; }   /* 种着的作物如果已经不存在了，清空这块地 */
  });

  delete S.stoves;
  if(!S.pot || !S.pot.length) S.pot = [];
  while(S.pot.length<POT_N) S.pot.push(null);
  if(S.pot.length>POT_N) S.pot.length=POT_N;
  for(var pi=0; pi<POT_N; pi++){
    /* 存档里可能残留一个已经不存在的食材 id（比如以后删了某种食材），
       清掉它，免得缩略图和判定出怪事 */
    if(S.pot[pi] && S.pot[pi]!=='honey' && !byGood(S.pot[pi])) S.pot[pi]=null;
  }
  if(typeof S.potSel==='undefined') S.potSel=null;
  if(S.potSel && !byDish(S.potSel)) S.potSel=null;
  if(typeof S.potOut==='undefined') S.potOut=null;
  if(S.potOut && S.potOut.kind==='dish' && !byDish(S.potOut.id)) S.potOut=null;
  if(!S.animals) S.animals={hen:0,cow:0,pig:0};
  ANIMALS.forEach(function(a){ if(typeof S.animals[a.id]!=='number') S.animals[a.id]=0; });
  if(!S.anT) S.anT={hen:0,cow:0,pig:0};
  ANIMALS.forEach(function(a){ if(typeof S.anT[a.id]!=='number') S.anT[a.id]=0; });
  /* 工坊（2026-09-27 换过结构）：
     旧存档里那两个按「槽位下标」记的 craftT / craftReady 一律作废。
     理由：CRAFTS 的条数从 9 条砍到了 6 条（删掉重复的糖/面粉 + 蛋黄酱），
           旧的槽位下标全部错位，留着只会让玩家白等一个不存在的东西。
     ⚠️ craftVer 是「只做一次」的记号：
        下面的清队 + 退材料只能跑一次，不然每次刷新页面都会把正在排的队清空。 */
  if(!Array.isArray(S.craftQ)) S.craftQ=[];
  if(!Array.isArray(S.craftDone)) S.craftDone=[];
  if(S.craftVer !== 2){
    /* 旧存档里正在加工的东西，材料已经扣掉了 —— 统统还回仓库，
       然后队伍清空、待收取清空，从头开始。宁可多给，也不能白吞玩家的东西。 */

    /* ① 旧格式：craftT[槽位] = 开始时间，craftReady[槽位] = 1 表示做好了没收。
       这两张表在下面就要被删掉了，所以【先在这里】把材料退回去。
       ⚠️ 旧 CRAFTS 是 9 条（0~6 是正经配方，7/8 是重复的糖和面粉），
          所以下标 7、8 要单独按「糖 / 面粉」算，不能拿新表去查。 */
    var LEGACY_CRAFT = [
      {from:'cane',   need:2},   /* 0 糖 */
      {from:'rice',   need:2},   /* 1 面粉 */
      {from:'milk',   need:3},   /* 2 黄油 */
      {from:'tomato', need:3},   /* 3 番茄酱 */
      {from:'corn',   need:3},   /* 4 玉米油（旧版要花生×3，花生已经删了，按玉米算） */
      {from:'berry',  need:2},   /* 5 草莓酱 */
      {multi:{egg:1,butter:1,lemon:1,sugar:1}},  /* 6 蛋黄酱（已删，材料照退） */
      {from:'cane',   need:2},   /* 7 重复的糖 */
      {from:'rice',   need:2}    /* 8 重复的面粉 */
    ];
    var legacySlots = [];
    if(S.craftT && typeof S.craftT==='object'){
      for(var lk in S.craftT){ if(S.craftT[lk]) legacySlots.push(parseInt(lk,10)); }
    }
    if(S.craftReady && typeof S.craftReady==='object'){
      for(var rk in S.craftReady){ if(S.craftReady[rk]) legacySlots.push(parseInt(rk,10)); }
    }
    legacySlots.forEach(function(si){
      var lc = LEGACY_CRAFT[si];
      if(!lc) return;
      if(lc.multi){
        for(var mk in lc.multi){ S.store[mk]=(S.store[mk]||0)+lc.multi[mk]; }
      }else if(lc.from && byGood(lc.from)){
        S.store[lc.from]=(S.store[lc.from]||0)+lc.need;
      }
    });

    /* ② 新格式：队伍里排着的（一般不会有，保险起见也退掉） */
    S.craftQ.forEach(function(ci){
      var c = CRAFTS[ci];
      if(!c) return;
      if(c.multi){ for(var k in c.multi){ S.store[k]=(S.store[k]||0)+c.multi[k]; } }
      else if(c.from){ S.store[c.from]=(S.store[c.from]||0)+c.need; }
    });

    S.craftQ=[]; S.craftQStart=0; S.craftDone=[];
    S.craftVer=2;
  }
  delete S.craftT; delete S.craftReady;
  S.craftQ = S.craftQ.filter(function(ci){ return !!CRAFTS[ci]; });
  if(typeof S.craftQStart!=='number') S.craftQStart=0;
  if(!S.craftQ.length) S.craftQStart=0;
  S.craftDone = S.craftDone.filter(function(id){ return !!byGood(id); });
  if(!S.poops || !S.poops.length) S.poops=[];
  S.poops = S.poops.filter(function(x){ return x>=0 && x<N && S.plots[x] && S.plots[x].u; });
  delete S.house; delete S.own; delete S.walls; delete S.floors;
}

/* 订单结构迁移（2026-09-22）：
   旧订单是「一个订单凑三样货」→ {items:[三样货], pay}
   新订单是「一个订单只要一道菜」→ {id, price, pay}
   两者结构差太多，没法原地转换，所以旧订单一律丢掉，
   下面会照新结构重新生成三个。 */
if(!S.orders || !Array.isArray(S.orders)) S.orders=[];
/* ⚠️ 2026-09-27 改：这里【不能再把空位 filter 掉】。
   因为现在订单槽交付之后会变成 null（冷却中，8~15 秒后才出新菜），
   一 filter 空位就会被删掉、后面的槽整体往前挪 —— 冷却计时就全对不上了。
   所以只把「坏数据」换成 null，位置一个都不动。 */
for(var oi=0; oi<S.orders.length; oi++){
  var oo=S.orders[oi];
  if(oo && (typeof oo.id !== 'string' || !byDish(oo.id))) S.orders[oi]=null;
}
/* 每个槽「什么时候刷新」的时间戳（2026-09-27 新增）。0 = 没有在冷却。 */
if(!Array.isArray(S.orderT)) S.orderT=[];

function money(x){ return Math.round(x*(1+S.bears*BEAR_BONUS)); }
function haveMat(k){ return k==='honey' ? S.honey : (S.store[k]||0); }
function takeMat(k,n){ if(k==='honey') S.honey-=n; else S.store[k]=(S.store[k]||0)-n; }
function animalTotal(){ return S.animals.hen+S.animals.cow+S.animals.pig; }
function animalsAngry(){ return S.poops.length>=POOP_LIMIT; }

/* ============================================================
   订单（2026-09-22 大改）
   ------------------------------------------------------------
   改之前：一个订单要凑齐三样货，农作物 / 材料 / 菜肴都可能被要。
   改之后：**一个订单 = 一道菜肴**，只要一道，
          其他任何东西（农作物、材料、纪念品）一律不出现在订单里。

   怎么交付：把锅下面成品格里的菜【拖】到左边导航栏的订单槽上，
             对得上就付钱，那个槽自己变成下一道菜 —— 全自动。

   ⚠️「用蜂蜜刷新订单」已经整块删掉（连按钮一起），
      所以订单只会「交付之后自己换」，玩家没法手动刷。
   ============================================================ */

/* 订单池：只挑「玩家已经成功做出来过」的菜（看 S.seen）。
   排除 bear（小熊料理只喂小京）和 noCook（丸子串串靠探险拿）。

   ⚠️ 新手兜底：新存档一道菜都没做成功过，池子会是空的。
      这时候固定用「蔬菜沙拉」顶上。
      （作者计划做新手指引，指引里用到的那道菜就暂时定为蔬菜沙拉；
        等新手指引真的做出来，把下面的 'salad' 换成指引要求的那道菜即可。） */
function orderPool(){
  var list=[];
  DISHES.forEach(function(d){
    if(d.bear) return;
    if(d.noCook) return;
    if(!S.seen[d.id]) return;
    list.push(d);
  });
  if(!list.length) list=[byDish('salad')];
  return list;
}

/* 生成一个订单：结构很浅，就是一道菜 {id, price, pay}
     price 是这道菜这一次的单价（特殊料理 ×1.5）
     pay   是交付时真正到手的钱（再乘 1.5~2.0 的随机浮动）
   ⚠️ pay 只能生成一次就定下来 —— 不然每次重画订单金额都在跳。 */
function makeOrder(){
  var pool = orderPool();

  /* 特殊料理：**50% 概率**进入这一轮的候选，而且价格只 **×1.2**。
     ⚠️ 2026-09-27 改：原来是 20% 概率 + ×1.5。
        用户说"special 改成出率只降低 50%，并且订单价格只提升 1.2 倍"。 */
  var cand=[];
  pool.forEach(function(d){
    if(d.special){ if(Math.random() < 0.5) cand.push(d); }
    else cand.push(d);
  });
  if(!cand.length) cand = pool;   /* 特殊菜全被骰子刷掉了 → 拿普通菜兜底 */

  /* 尽量避开另外两个槽已经在要的菜。
     但如果池子里就那么一两道（新手期只有蔬菜沙拉），允许重复。 */
  var taken={};
  S.orders.forEach(function(o){ if(o && o.id) taken[o.id]=1; });
  var fresh = cand.filter(function(d){ return !taken[d.id]; });
  var use = fresh.length ? fresh : cand;

  var d = use[Math.floor(Math.random()*use.length)];
  var price = d.special ? Math.round(d.price*1.2) : d.price;
  return { id:d.id, price:price, pay:Math.round(price*(1.5+Math.random()*0.5)) };
}

/* 订单槽要显示哪种菜（拿不到就返回 null，渲染时会跳过） */
function orderDish(o){ return (o && byDish(o.id)) || null; }

while(S.orders.length<ORDER_SLOTS) S.orders.push(makeOrder());
if(S.orders.length>ORDER_SLOTS) S.orders.length=ORDER_SLOTS;
/* 每个槽都要有一个「刷新时间戳」的位置（2026-09-27 新增） */
while(S.orderT.length<ORDER_SLOTS) S.orderT.push(0);
if(S.orderT.length>ORDER_SLOTS) S.orderT.length=ORDER_SLOTS;
/* 兜底：某个槽是空的、又没有在冷却（比如刚换新版本）→ 给它 1 秒后补一道菜，
   不然那个槽会永远挂着 ❌ 不回来。 */
for(var oi2=0; oi2<ORDER_SLOTS; oi2++){
  if(!S.orders[oi2] && !S.orderT[oi2]) S.orderT[oi2]=Date.now()+1000;
}

/* ---------- DOM 搭建 ---------- */
function $(id){return document.getElementById(id);}

    storeBox=$('store'), trayBox=$('tray'), recipeBox=$('recipes'),
    craftBox=$('crafts'), anBox=$('anBox'), shopBox=$('shop'),
    feedGrid=$('feedGrid'),
    /* 厨房（九宫格）那一块 */
    pantryBox=$('pantry'), potBox=$('pot'), potPickEl=$('potPick'),
    potRefBox=$('potRef'), outSlot=$('outSlot'), potGoBtn=$('potGo'),
    railOrders=$('railOrders');
var plotEls=[], cellState=[], storeEls=[], trayEls=[], dishEls=[],
    orderEls=[], bearNext=[], pantryEls=[], potCells=[];

for(var i=0;i<N;i++){
  (function(i){
    var b=document.createElement('button');
    b.className='plot';
    b.innerHTML='<span class="em"></span>';
    b.addEventListener('click',function(){ tapPlot(i); });

GOODS.forEach(function(g,i){

/* 种子按钮：按生长时间从短到长排（见 CROPS_SORTED 那里的说明）。
   点一下 = 选中这种种子，之后再点空地就种它。
   ⚠️ S.sel 存的是【作物 id】，不是下标 —— 下标会随数据表增删而漂移。 */
CROPS_SORTED.forEach(function(c){
  var b=document.createElement('button');
  b.className='seed';
  b.innerHTML='<span class="e">'+itemIcon(c.id,c.e)+'</span><span class="info"><span class="n">'+c.n+'</span><span class="p">🪙'+c.cost+'·'+c.grow+'秒</span></span>';
  b.addEventListener('click',function(){ S.sel=c.id; save(); paint(); });
  seedsBox.appendChild(b);
});

/* 背包抽屉里「🍲 菜肴仓库」的格子：**纯显示，不是拖拽源**。

   ⚠️ 能拖出去交订单的是【厨房最下面那排菜肴 ui】，不是这里。
      2026-09-24 我一度把拖拽源挂在了这一块，用户专门纠正过：
      "不是从背包里面拖拽，是拖拽九宫格下面的菜肴的 ui！"
      别再挂回来了。 */
DISHES.forEach(function(d){
  var s=document.createElement('div'); s.className='slot d'; trayBox.appendChild(s); trayEls.push(s);
});

CRAFTS.forEach(function(c,i){
  var b=document.createElement('button');
  b.className='seed';
  b.addEventListener('click',function(){ craft(i); });
  craftBox.appendChild(b);
});

/* 菜肴列表：**只有 icon，没有名字**，每行 5 个（用户 2026-09-24 要求）。
   点一下 = 选中它，左上角会显示它的名字、左下角显示它的九宫格菜谱。
   ⚠️ 丸子串串（noCook）也照样显示 —— 它是菜谱，只是做不出来而已。
   ⚠️ 没有名字之后，认菜全靠图标，所以图标不能做小。 */
DISHES.forEach(function(d,i){
  var b=document.createElement('button');
  b.className='dishBtn';
  b.innerHTML=itemIcon(d.id,d.e);

  /* 【2026-09-27】菜肴格子现在也是【投放区】：
     锅下面的成品直接拖到下面任意一个菜肴格上，就收进菜肴仓库（背包）。
     用户原话："成品菜不要拖入小京了，取消拖入小京的操作和渲染，
               改成直接拖到菜肴列收入背包"。
     ⚠️ 拖到【哪一格】都一样，不要求对得上这道菜 —— 它就是个"往背包里放"的口子。 */
  b.setAttribute('data-drop','dishlist');
  b.setAttribute('data-dish', d.id);

  /* 点一下 = 选中它（左上角显示名字、左下角显示它的九宫格菜谱） */
  b.addEventListener('click',function(){
    if(Date.now()<dragBlock) return;   /* 刚拖完这一下，别把松手当点击 */
    S.potSel=d.id; save(); paint();
  });

  /* 【2026-09-24】拖 = 把它交给订单槽去结算。
     ⚠️⚠️ 拖拽源就是【这里】 —— 用户原话：
         "我们把菜肴的 ui 也变成可拖拽，可以直接拖拽到订单去结算。"
         他还专门纠正过一次（我一度做到了背包抽屉里去）：
         "不是从背包里面拖拽，是拖拽九宫格下面的菜肴的 ui！"
     ⚠️ 只有背包里【真有的】才拖得动 —— dragStart 会拦掉数量为 0 的。
        哪个有货一眼就能看出来：格子是粉色的（.have 那个样式）。 */
  b.addEventListener('pointerdown',function(e){
    if((S.dish[d.id]||0)>0) dragStart(e,{kind:'bagdish', id:d.id});
  });

  recipeBox.appendChild(b);
  dishEls.push(b);
});

/* 食材区：只有 icon，没有名字也没有数量 —— 格子太小放不下。
   有货 = 正常显示，没货 = 变灰且不让放。 */
PANTRY.forEach(function(id){
  var info=ingInfo(id);
  var b=document.createElement('button');
  b.className='pantryItem';
  b.innerHTML=itemIcon(info.id,info.e);
  b.setAttribute('data-ing',id);
  b.addEventListener('pointerdown',function(e){ dragStart(e,{kind:'ing',id:id}); });
  b.addEventListener('click',function(){ tapPantry(id); });
  pantryBox.appendChild(b);
  pantryEls.push(b);
});

/* 锅：九宫格。每一格本身就是一个投放区（data-drop="pot"）。
   一个格子 = 一个食材，要几个就占几个格子。 */
for(var pk=0;pk<POT_N;pk++){
  (function(pk){
    var c=document.createElement('button');
    c.className='potCell';
    c.setAttribute('data-drop','pot');
    c.setAttribute('data-i',pk);
    /* 从锅里往外拖 = 把这格拿掉，库存会还回来（见 dragEnd） */
    c.addEventListener('pointerdown',function(e){
      if(S.pot[pk]) dragStart(e,{kind:'pot',i:pk});
    });
    potBox.appendChild(c);
    potCells.push(c);
  })(pk);
}

/* 订单槽：挂在左侧导航栏底部。
   它们【不是按钮】—— 点不开抽屉、也不是抽屉。它们做两件事：
     ① 接住拖上来的东西（成品格里的菜 / 背包里的菜）   data-drop="order"
     ② 【2026-09-24 新增】点一下 = 选中这道菜，
        等于在下面那片菜肴列表里点了它一下。
        用户原话：「点击订单图标可以直接起到点击菜肴的效果
                   （这样就不用上下翻找菜肴了）」 */
for(var k2=0;k2<ORDER_SLOTS;k2++){
  (function(k2){
    var s=document.createElement('div');
    s.className='oslot';
    s.setAttribute('data-drop','order');
    s.setAttribute('data-i',k2);
    s.addEventListener('click',function(){
      if(Date.now()<dragBlock) return;   /* 刚拖完这一下，别把松手当点击 */
      var o=S.orders[k2];
      var d=o?byDish(o.id):null;
      if(!d) return;
      S.potSel=d.id;
      save(); paint();
      toast('已经帮你选中 '+d.n);
    });
    railOrders.appendChild(s);
    orderEls.push(s);
  })(k2);
}

/* 成品格：里面那道菜可以【拖走】——
   拖给左边的订单槽 = 交货收钱；
   拖给熊头垃圾桶 = 小京吃掉（如果它是小熊料理，还真的会喂饱它）；
   拖给左边的「🧸 小京」按钮 = 收进菜肴仓库。
   ⚠️ 它自己有东西的时候不许被覆盖，「提交」是灰的（见 paintKitchen）。 */
outSlot.addEventListener('pointerdown',function(e){
  if(S.potOut) dragStart(e,{kind:'out'});
});

ANIMALS.forEach(function(a){
  var b=document.createElement('button');
  b.className='buyb';
  b.addEventListener('click',function(){ buyAnimal(a.id); });
  b.setAttribute('data-buy',a.id);
  shopBox.appendChild(b);
});

/* 投喂页按钮：只有小熊料理 */
BEAR_DISHES.forEach(function(d,i){
  var b=document.createElement('button');
  b.className='seed recipe';
  b.addEventListener('click',function(){ feedBear(d.id); });
  feedGrid.appendChild(b);
});

/* 【已删除 · 2026-09-22】needText(d) 本来在这里。
   它的作用是「把 d.need 拼成『🍅×2 🥚×1』这样的配菜提示」，
   挂在厨房的菜谱卡片上。
   菜谱卡片改成「只显示 icon + 名字」之后它没人用了，所以删掉。
   现在想知道一道菜要什么材料，看右边那个九宫格缩略图。 */

function cropOf(p){ return p.c?byId(p.c):null; }
function prog(p){ var c=cropOf(p); if(!c) return 0; return Math.min(1,(Date.now()-p.t)/(c.grow*1000)); }
function isReady(p){ var c=cropOf(p); return !!(p.c&&c&&(Date.now()-p.t)>=c.grow*1000); }

/* ---------- 渲染 ---------- */
function paint(){
  $('coins').textContent=Math.floor(S.coins);
  $('gems').textContent=S.gems;
  $('honey').textContent=S.honey;
  $('bears').textContent=S.bears;

  /* ---------- 农场页里的两行小提示（2026-09-24 从页面顶部拆下来）----------
     ① 「×N 让卖出去的东西多赚 X%」→ 挂在「小京的朋友」按钮下面
     ② 「地上有 X 坨💩……」        → 挂在田地下面、种子上面
     ② 只在有粑粑时才出现，没粑粑就整个藏起来（一点都不占地方）。

     ⚠️ ② 光靠一行小字不够 —— 粑粑攒够 6 坨动物就全体罢工，
        玩家要是不点农场页，可能半小时都发现不了。
        所以下面还会同步点亮【顶部「🌱 农场」标签上的小叹号】。 */
  var bearLine = S.bears===0
    ? '还没有小熊，价钱都是原价'
    : '×'+S.bears+' 让卖出去的东西多赚 '+Math.round(S.bears*BEAR_BONUS*100)+'%';
  if($('buff').textContent !== bearLine) $('buff').textContent = bearLine;

  var poopEl = $('poopWarn');
  var poopBad = S.poops.length >= POOP_LIMIT;
  if(S.poops.length > 0){
    var pooTxt = poopBad
      ? '地上 '+S.poops.length+' 坨💩，动物全都罢工了！快拖到左边的桶里'
      : '地上有 '+S.poops.length+' 坨💩，拖到左边的桶里';
    if(poopEl.textContent !== pooTxt) poopEl.textContent = pooTxt;
    poopEl.className = 'poopWarn' + (poopBad ? ' bad' : '');
    poopEl.style.display = '';
  }else{
    poopEl.style.display = 'none';
  }
  /* 顶部「🌱 农场」标签上的小叹号（跟工坊/小京那两个是一套东西） */
  $('farmBadge').classList.toggle('is-on', poopBad);

  GOODS.forEach(function(g,i){
    var n=S.store[g.id]||0;
    if(storeEls[i].getAttribute('data-n')!==String(n)){
      storeEls[i].className='slot'+(n?'':' zero');
      storeEls[i].innerHTML='<span>'+itemIcon(g.id,g.e)+'</span><span class="n">'+n+'</span>';
      storeEls[i].setAttribute('data-n',n);
    }
  });
  DISHES.forEach(function(d,i){
    var n=S.dish[d.id]||0;
    if(trayEls[i].getAttribute('data-n')!==String(n)){
      trayEls[i].className='slot d'+(n?'':' zero');
      trayEls[i].innerHTML='<span>'+itemIcon(d.id,d.e)+'</span><span class="n">'+n+'</span>';
      trayEls[i].setAttribute('data-n',n);
    }
  });

  var total=0;
  GOODS.forEach(function(g){ total+=money(g.price)*(S.store[g.id]||0); });
  DISHES.forEach(function(d){ total+=money(d.price)*(S.dish[d.id]||0); });
  var sb=$('sellall');
  var txt = total>0 ? '全部散卖 · 得到 🪙'+total : '仓库空空的，先去种点什么';
  if(sb.textContent!==txt) sb.textContent=txt;
  sb.disabled = total<=0;

  S.plots.forEach(function(p,i){
    var el=plotEls[i], kind, c=cropOf(p);
    var hasPoop = S.poops.indexOf(i)>=0;
    if(!p.u) kind='locked';
    else if(!p.c) kind='empty';
    else kind=isReady(p)?'ready':'growing';

    el.style.touchAction = hasPoop ? 'none' : '';

    var cs=cellState[i], key=kind+':'+(p.c||'')+':'+(hasPoop?1:0);
    if(!cs||cs.key!==key){
      el.className='plot '+(kind==='locked'?'locked':kind);
      var inner='';
      if(kind==='locked') inner='<span class="em" style="font-size:18px">🔒</span><span>'+PLOT_PRICE[i]+'</span>';
      else if(kind==='empty') inner='<span class="em">＋</span>';
      else if(kind==='ready') inner='<span class="em">'+itemIcon(c.id,c.e)+'</span>';
      else inner='<span class="em">'+itemIcon(c.id,c.e)+'</span><div class="prog"><i></i></div>';
      if(hasPoop) inner+='<span class="poop">💩</span>';
      el.innerHTML=inner;
      cellState[i]={key:key, fill:el.querySelector('.prog i')};
      cs=cellState[i];
    }
    if(cs.fill && kind==='growing') cs.fill.style.width=(prog(p)*100)+'%';
  });

  Array.prototype.forEach.call(seedsBox.children,function(b,i){
    var sc=CROPS_SORTED[i];
    if(!sc) return;
    b.classList.toggle('on', sc.id===S.sel);
    b.classList.toggle('poor', S.coins<sc.cost);
  });

  /* 工坊卡片交给独立函数画（2026-09-27 改成排队流水线之后这块变复杂了） */
  paintCrafts();

  /* 厨房整块（食材区 / 锅 / 成品格 / 菜肴列表）交给独立函数画，
     paint() 才不会被撑得又长又乱。 */
  paintKitchen();

  paintOrders();
  paintAnimals();
  paintShop();
  paintBear();

  var cb=$('bearb');
  cb.disabled = !(S.bears<BEAR_MAX && S.honey>=BEAR_HONEY);
  var bearKey=S.bears+'/'+BEAR_MAX+'/'+S.honey;
  if(cb.getAttribute('data-k')!==bearKey){
    var bearHtml=S.bears>=BEAR_MAX ? '小京的朋友已经够多了 🧸'
      : (S.bears===0 ? '请小京来帮忙收地 · '+itemIcon('honey','🍯')+BEAR_HONEY
      : '再请一只小熊 · '+itemIcon('honey','🍯')+BEAR_HONEY+'（'+S.bears+'/'+BEAR_MAX+'）');
    cb.innerHTML=bearHtml;
    cb.setAttribute('data-k',bearKey);
  }

  var fb=$('fertb');
  fb.disabled = S.dung<3;
  var ft='🪣 施肥 · 有 '+S.dung+' 坨（攒 3 坨，地里全部催熟）';
  if(fb.textContent!==ft) fb.textContent=ft;

  var ab=$('auto');
  ab.classList.toggle('on', !!S.auto);
  ab.textContent = S.auto ? '小京顺手替你补种：开着' : '小京顺手替你补种：关着';

  $('tip').textContent = S.auto && S.bears>0 ? '小京替你种地，你负责看锅' : '点土地种下去，熟了再收';

  /* 导航栏「工坊」上的小叹号：有东西加工好了还没收，就亮起来 */
  $('craftBadge').classList.toggle('is-on', anyCraftReady());
  /* 导航栏「小京」上的小叹号：探险回来了、有礼物待领 */
  $('bearBadge').classList.toggle('is-on', !!S.lootPending);

  if(isDrawerOpen()) filterDrawer(currentCat);
}

/* ============================================================
   厨房：九宫格锅的渲染（2026-09-22 新增 · 2026-09-24 左右翻面）
   ------------------------------------------------------------
   画五样东西：
     ① 食材区    —— 只显示 icon。仓库里没有的变灰
     ② 锅        —— 9 格，在【右边】（右手大拇指够得着）；有东西的格子加 .has
     ③ 左边两块  —— 上：菜谱缩略图；下：当前选中的菜（icon + 名字）
     ④ 成品格    —— 提交之前留空；有东西时「提交」变灰
     ⑤ 菜肴列表  —— 背包里有货的标粉底（.have），当前选中的标描边（.on）
   ============================================================ */
function paintKitchen(){
  /* ① 食材区：有货正常显示，没货变灰。
     ⚠️ 一律走 haveMat() —— 蜂蜜存在 S.honey 里，不在 S.store，
        直接写 S.store['honey'] 会永远是 0。 */
  PANTRY.forEach(function(id,i){
    var el=pantryEls[i];
    if(!el) return;
    el.classList.toggle('zero', haveMat(id)<=0);
  });

  /* ② 锅：哪一格有东西 */
  for(var i=0;i<POT_N;i++){
    var cell=potCells[i];
    var id=S.pot[i];
    var info=id?ingInfo(id):null;
    cell.classList.toggle('has', !!id);
    cell.innerHTML = info ? itemIcon(info.id,info.e) : '';
  }

  /* ③ 左下：当前选中的菜（icon + 名字）
     （2026-09-24 之前它在右上，现在挪到左边、而且在缩略图【下面】了） */
  var sel = S.potSel ? byDish(S.potSel) : null;
  if(sel){
    potPickEl.className='potPick';
    potPickEl.innerHTML='<span class="pe">'+itemIcon(sel.id,sel.e)+'</span>'+sel.n;
  }else{
    potPickEl.className='potPick empty';
    potPickEl.innerHTML='先选一道菜';
  }

  /* ③ 左上：菜谱缩略图（2026-09-24 挪到左边，并且挪到名字【上面】了）。
     故意做得很小 —— 用户原话：「大小要小，不要把九宫格挤没了」。

     ⚠️ 这里就是【故意剧透】的地方：选了哪道菜，就把它该摆什么告诉他。
        以后要做真正的「探索式烹饪」，改法是在这里换成剪影 / 问号，
        而不是把整张菜谱藏起来。 */
  var refKey = sel ? sel.id : 'none';
  if(potRefBox.getAttribute('data-k') !== refKey){
    var r = sel ? RECIPES[sel.id] : null;
    var mini='<div class="mini">';
    for(var k=0;k<POT_N;k++){
      var ing = (r && r[k]) ? ingInfo(r[k]) : null;
      mini+='<i>'+(ing?itemIcon(ing.id,ing.e):'')+'</i>';
    }
    mini+='</div>';
    potRefBox.innerHTML=mini;
    potRefBox.setAttribute('data-k', refKey);
  }


  /* ④ 成品格。
     ⚠️ 它有东西的时候【绝对不许被下一道菜覆盖】——
        所以「提交」这时候是灰的，玩家必须先把成品处理掉。

     三种成品的出路（2026-09-24 定稿）：
       · 正常的菜     → 拖给左侧「要它的那个订单槽」结算；或者拖给「🧸 小京」按钮进背包
                        ⚠️ 拖给熊头会被拒绝：「小京才不要吃这个呢！」
       · ☠︎ 黑暗料理 → 只能拖给熊头（小京吃掉它，但不加饱食度）
       · 小熊料理     → 拖给熊头直接喂（+feed 饱食度），或者拖给「🧸 小京」按钮进背包
     —— 也就是说，每一种成品都至少有一条出路，不会出现卡死的局面。 */
  var out=S.potOut;
  if(!out){
    outSlot.className='outSlot empty';
    outSlot.textContent='·';
  }else{
    var od = out.kind==='dark' ? DARK_DISH : byDish(out.id);
    outSlot.className='outSlot';
    outSlot.innerHTML = od ? itemIcon(od.id,od.e) : '?';
  }
  potGoBtn.disabled = !!out;
  potGoBtn.textContent = out ? '先处理成品' : '提交';

  /* ⑤ 菜肴列表的两种高亮（2026-09-24 加）。
     ⚠️ 只做「有货 = 粉底」，**绝对不做「没货 = 灰」** ——
        大部分菜背包里本来就没有存货，全灰会很难看，
        而且玩家也没法一眼看出哪道是自己有料的。
        （用户先说要加灰色，五分钟后又自己收回了：「我感觉变灰会好难看啊」） */
  DISHES.forEach(function(d,i){
    var b=dishEls[i];
    if(!b) return;
    b.classList.toggle('have', (S.dish[d.id]||0)>0);
    b.classList.toggle('on', d.id===S.potSel);
  });
}

/* ============================================================
   工坊卡片的渲染（2026-09-27 从 paint() 里拆出来，改成排队流水线）
   ------------------------------------------------------------
   一张卡片显示：图标 · 名字 · 要什么材料 · 现在有多少 · 固定 10 秒
   右上角角标 = 这个配方在队伍里排了几件。
   材料不够的卡片整个变淡（.poor），点了会提示还缺什么。
   ============================================================ */
function paintCrafts(){
  var nowBox=$('craftNow'), collectBtn=$('craftCollect');
  if(!nowBox || !collectBtn) return;

  /* ---------- 顶部：正在做的那一件 + 进度条 ----------
     ⚠️ 这里【故意不每次重建 innerHTML】：
        进度条每半秒更新一次宽度，如果每次都新建一个元素，
        它就从 0 直接跳到当前值，看不出在动。
        所以结构只搭一次（data-mode 记着），之后只改文字和宽度。 */
  var cur = S.craftQ.length ? CRAFTS[S.craftQ[0]] : null;

  if(cur){
    if(nowBox.getAttribute('data-mode') !== 'run'){
      nowBox.className = 'craftNow';
      nowBox.innerHTML = '<span class="txt"></span><span class="cq"><i></i></span>';
      nowBox.setAttribute('data-mode','run');
    }
    var cg   = byGood(cur.out);
    var used = S.craftQStart ? (Date.now()-S.craftQStart) : 0;
    var left = Math.max(0, Math.ceil((CRAFT_TIME*1000 - used)/1000));
    var pct  = Math.max(0, Math.min(100, Math.round(used/(CRAFT_TIME*10))));
    var rest = S.craftQ.length-1;

    var txtEl = nowBox.querySelector('.txt');
    var barEl = nowBox.querySelector('.cq i');
    var txt = '正在做 '+(cg?cg.n:'?')+' · 还要 '+left+' 秒'+
              (rest>0 ? ' · 后面还排着 '+rest+' 件' : '');
    var txtHTML = '正在做 '+(cg?itemIcon(cg.id,cg.e)+cg.n:'?')+' · 还要 '+left+' 秒'+
                  (rest>0 ? ' · 后面还排着 '+rest+' 件' : '');
    if(txtEl && txtEl.getAttribute('data-k') !== txt){
      txtEl.innerHTML = txtHTML;
      txtEl.setAttribute('data-k',txt);
    }
    if(barEl) barEl.style.width = pct+'%';
  }else{
    if(nowBox.getAttribute('data-mode') !== 'idle'){
      nowBox.className = 'craftNow idle';
      nowBox.innerHTML = '<span class="txt"></span><span class="cq"><i></i></span>';
      nowBox.setAttribute('data-mode','idle');
    }
    var txtEl2 = nowBox.querySelector('.txt');
    var idleTxt = '队伍空着，点下面的配方排进来（每件 '+CRAFT_TIME+' 秒）';
    if(txtEl2 && txtEl2.textContent !== idleTxt) txtEl2.textContent = idleTxt;
    var barEl2 = nowBox.querySelector('.cq i');
    if(barEl2) barEl2.style.width = '0%';
  }

  /* ---------- 一键收取按钮 ---------- */
  var dn=S.craftDone.length;
  collectBtn.disabled = (dn<=0);
  var bt = dn>0 ? ('全部收取 · 攒了 '+dn+' 件') : '全部收取（还没有做好的）';
  if(collectBtn.textContent!==bt) collectBtn.textContent=bt;

  /* ---------- 每个配方的卡片 ---------- */
  CRAFTS.forEach(function(c,i){
    var b=craftBox.children[i];
    if(!b) return;
    var og=byGood(c.out);
    var queued=craftQueuedCount(i);
    var canMake=craftCanMake(c);

    /* 卡片内容只在「材料数 / 排队数」变了的时候才重画 —— 每半秒重画一次太浪费 */
    var key=c.out+'|'+queued+'|'+craftCostText(c)+'|';
    if(c.multi){ for(var k in c.multi){ key+=(S.store[k]||0)+','; } }
    else { key+=(S.store[c.from]||0); }

    if(b.getAttribute('data-k')!==key){
      var haveTxt;
      if(c.multi){
        var hp=[];
        for(var k2 in c.multi){ hp.push((S.store[k2]||0)+'/'+c.multi[k2]); }
        haveTxt='要 '+craftCostIcons(c)+' · 有 '+hp.join(' ');
      }else{
        haveTxt='要 '+craftCostIcons(c)+' · 有 '+(S.store[c.from]||0);
      }
      b.innerHTML='<span class="e">'+(og?itemIcon(og.id,og.e):'?')+'</span>'+
        '<span class="info">'+
          '<span class="n">'+(og?og.n:c.out)+'</span>'+
          '<span class="p">'+haveTxt+' · '+CRAFT_TIME+'秒</span>'+
        '</span>'+
        (queued>0 ? '<span class="cqbadge">'+queued+'</span>' : '');
      b.setAttribute('data-k',key);
    }
    b.classList.toggle('poor', !canMake);
  });
}

/* 订单槽的渲染：只画一个菜肴 icon，**一个字都不写**。
   —— 用户原话：「显示的 icon 是当前所需菜肴，不显示名字。无名。」
       所以别往这里加文字，连 tooltip 也别加。
   （后期要在下面加进度条 / 时间条 / 叹号时，往 .oslot 里再塞元素就行，
     外面那圈粉色虚线框不受影响。） */
function paintOrders(){
  S.orders.forEach(function(o,i){
    var el=orderEls[i];
    if(!el) return;

    /* 冷却中（这个槽刚交完货，8~15 秒后才出新菜）：
       显示 ❌、框是灰色虚线、不接东西（见 zoneAccepts）。
       2026-09-27 用户要求："订单未刷新时 icon 显示 ❌" / "框是灰色虚线"。 */
    if(!o){
      el.classList.add('wait');
      if(el.getAttribute('data-k')!=='wait'){
        el.textContent='❌';
        el.setAttribute('data-k','wait');
      }
      return;
    }

    el.classList.remove('wait');
    var d=orderDish(o);
    if(!d){ el.textContent=''; el.removeAttribute('data-k'); return; }
    if(el.getAttribute('data-k')!==d.id){
        el.innerHTML=itemIcon(d.id,d.e);
      el.setAttribute('data-k',d.id);
    }
  });
}

function paintAnimals(){
  var total=animalTotal();
  var angry=animalsAngry();
  var html='';
  if(total<=0){
    html='<div class="anrow">牧场还空着，下面可以请动物来住 🐾</div>';
  }else{
    ANIMALS.forEach(function(a){
      var num=S.animals[a.id];

      html+='<div class="anrow'+(bad?' bad':'')+'" data-a="'+a.id+'">'+
        '<span class="em">'+a.e+'</span>'+a.n+' ×'+num+

    });

    anBox.innerHTML=html;
    anBox.setAttribute('data-k',html);
  }
}

function paintShop(){

    if(!b) return;
