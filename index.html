/* ============================================================
   左侧导航栏 + 仓库抽屉
   ------------------------------------------------------------
   一张表管到底：一个标签 = 一个区块。
   以后要加新分类（比如厨房大改时的「已探索配方」），
   只要往 DRAWER_TABS 里加一行、并在 HTML 里加一个 .dsec 区块，
   不用碰任何层级、也不用再写一个 if。
   ============================================================ */
var DRAWER_TABS = [
  { cat:'crop',     label:'🌱 农作物',   sec:'goods' },
  { cat:'material', label:'🥩 特殊食材', sec:'goods' },
  { cat:'craft',    label:'🍬 工坊产品', sec:'goods' },
  { cat:'dish',     label:'🍲 菜肴',     sec:'dish'  },
  { cat:'souvenir', label:'⛄ 纪念品',   sec:'goods' }
];
var currentCat = 'crop';
var drawerTabEls = document.querySelectorAll('.dtab');
var drawerSecEls = document.querySelectorAll('.dsec');

/* 一件货物显示在抽屉的哪个标签下。
   就是它的 kind，一一对应 —— **里面一个 id 特判都没有了**。

   2026-09-21 清掉了两个 id 特判（都搬回数据里去了）：
     · 小雪人：以前靠 if(g.id==='snowman') 硬认成纪念品 → 数据里写 kind:'souvenir'
     · 饱嗝  ：以前靠 if(g.id==='burp')   硬认成特殊食材 → 数据里写 kind:'material' */
function goodsCatOf(g){
  if(g.kind === 'material') return 'material';
  if(g.kind === 'craft')    return 'craft';
  if(g.kind === 'souvenir') return 'souvenir';
  if(g.kind === 'crop')     return 'crop';

  /* 【遗留行为】kind 是 'animal' 的（牛奶 / 鸡蛋 / 巧克力）没有自己的标签，
     跟在"农作物"里 —— 这是原本就有的行为，原样保留。 */
  return 'crop';
}

function tabOf(cat){
  for(var i = 0; i < DRAWER_TABS.length; i++){
    if(DRAWER_TABS[i].cat === cat) return DRAWER_TABS[i];
  }
  return DRAWER_TABS[0];
}

function filterDrawer(cat){
  var tab = tabOf(cat);
  currentCat = tab.cat;

  /* 1) 标签高亮 */
  Array.prototype.forEach.call(drawerTabEls, function(b){
    b.classList.toggle('is-on', b.getAttribute('data-cat') === tab.cat);
  });

  /* 2) 只留下这个标签对应的区块 —— 标题和内容一起进出，
        所以不会再出现「空标题孤零零挂着」那种事 */
  Array.prototype.forEach.call(drawerSecEls, function(s){
    s.classList.toggle('is-hidden', s.getAttribute('data-sec') !== tab.sec);
  });

  /* 3) 物品仓库内部再按分类筛格子 */
  GOODS.forEach(function(g, i){
    var el = storeEls[i];
    if(!el) return;
    el.classList.toggle('is-hidden', tab.sec === 'goods' && goodsCatOf(g) !== tab.cat);
  });
}

/* ---------- 抽屉：一个抽屉，三个视图 ----------
     bag   = 背包（仓库分类）
     craft = 工坊
     bear  = 小京
   左侧导航栏点哪个按钮 → 抽屉就切到哪个视图。
   再点一次当前这个按钮 = 收起来。
   以后要加第四个视图，就是：加一个 rail-btn(data-view) + 加一个 .dview。 */
var currentView = 'bag';
var railViewBtns = document.querySelectorAll('.rail-btn[data-view]');
var drawerViews  = document.querySelectorAll('.dview');

function showView(view){
  currentView = view;
  Array.prototype.forEach.call(drawerViews, function(v){
    v.classList.toggle('is-hidden', v.getAttribute('data-view') !== view);
  });
}
function isDrawerOpen(){ return $('drawer').classList.contains('is-on'); }
function setDrawer(open){
  $('drawer').classList.toggle('is-on', open);
  $('drawerMask').classList.toggle('is-on', open);
  Array.prototype.forEach.call(railViewBtns, function(b){
    b.classList.toggle('is-on', open && b.getAttribute('data-view') === currentView);
  });
}
function goDrawer(view){
  if(isDrawerOpen() && currentView === view){ setDrawer(false); return; }
  showView(view);
  setDrawer(true);
}

Array.prototype.forEach.call(railViewBtns, function(b){
  b.addEventListener('click', function(){ goDrawer(b.getAttribute('data-view')); });
});
$('drawerMask').addEventListener('click', function(){ setDrawer(false); });

Array.prototype.forEach.call(drawerTabEls, function(btn){
  btn.addEventListener('click', function(){ filterDrawer(btn.getAttribute('data-cat')); });
});

// 默认显示农作物
filterDrawer('crop');

$('lootBtn').addEventListener('click', function(){
  if(!S.lootPending) return;
  panel.innerHTML='<div class="ttl">🧸 小京探险回来啦！</div>'+
    '<div style="font-size:42px;margin:10px 0">🧸</div>'+
    '<div style="font-size:13px;line-height:1.8;color:#7d6558;font-weight:700">'+
    '它带着满满一篮子东西跑回来了：<br><br>'+
    (S.lootSummary || '')+'<br><br>'+
    '小京蹭了蹭你的手，把篮子递给你，眼睛亮亮的。'+
    '</div>'+
    '<button class="catb" id="outOk" style="margin-top:14px">摸摸它</button>';
  overlay.classList.add('on');

  $('outOk').addEventListener('click', function(){
    overlay.classList.remove('on');
    panel.innerHTML='';
    S.lootPending = false;
    S.lootSummary = '';
    save(); paint();
  });
});

$('goOut').addEventListener('click', function(){
  if(S.expedition){
    toast('小京还在' + getSeasonName(S.expedition.season) + '探险中，等它回来再出发吧 🧸');
    return;
  }
  openOuting();
});
$('bearb').addEventListener('click',function(){
  if(S.bears>=BEAR_MAX||S.honey<BEAR_HONEY) return;
  S.honey-=BEAR_HONEY;
  S.bears++;
  toast(S.bears===1?'小京收好行李住进来了，以后地它替你收'
    :'又来一只，现在卖东西能多赚 '+Math.round(S.bears*BEAR_BONUS*100)+'%');
  save(); paint();
});

$('fertb').addEventListener('click',function(){
  if(S.dung<3){ toast('堆肥还不够，要攒够 3 坨呀'); return; }
  var n=0;
  S.plots.forEach(function(p){
    if(p.c && !isReady(p)){
      p.t=Date.now()-byId(p.c).grow*1000-1000;
      n++;
    }
  });
  if(n<=0){ toast('地里没有正在长的东西呀'); return; }
  S.dung-=3;
  sfx('fert');                    /* 倒东西的"沙沙沙"——把堆肥撒出去 */
  toast('哗——'+n+' 块地一下子全熟了');
  save(); paint();
});

$('gemsPill').addEventListener('click',openWallet);

$('auto').addEventListener('click',function(){
  S.auto = S.auto?0:1;
  save(); paint();
});

/* 顶部两个标签：农场 / 厨房
   （小京原本是顶部标签，已经搬进左侧抽屉；
     订单原本也是，2026-09-22 也搬走了 —— 变成左侧导航栏里的三个订单槽） */
function showPane(t){
  $('paneFarm').classList.toggle('hide', t!=='farm');
  $('paneKitchen').classList.toggle('hide', t!=='kitchen');
  $('tabFarm').classList.toggle('on', t==='farm');
  $('tabKitchen').classList.toggle('on', t==='kitchen');
}
$('tabFarm').addEventListener('click',function(){ showPane('farm'); });
$('tabKitchen').addEventListener('click',function(){ showPane('kitchen'); });

$('reset').addEventListener('click',function(){
  if(confirm('要把小农场清空重来吗？')){
    S=fresh();
    while(S.orders.length<ORDER_SLOTS) S.orders.push(makeOrder());
    save();
    /* 缓存的「上次画成什么样」全部清空，免得新旧状态串味 */
    for(var i=0;i<N;i++) cellState[i]=null;
    bearNext=[];
    overlay.classList.remove('on'); panel.innerHTML='';
    paint();
  }
});

function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ---------- 小熊自动收地 ---------- */
setInterval(function(){
  if(S.bears<=0) return;
  var now=Date.now();
  for(var k=0;k<S.bears;k++){
    if(!bearNext[k]){ bearNext[k]=now+BEAR_SPEED; continue; }
    if(now>=bearNext[k]){
      bearNext[k]=now+BEAR_SPEED;
      var idx=-1;
      for(var i=0;i<N;i++){ if(S.plots[i].u&&isReady(S.plots[i])){ idx=i; break; } }
      if(idx>=0) harvest(idx,true);
    }
  }
},100);

/* ---------- 小熊饱食度 / 自动捡粑粑 ---------- */
var lastAutoPick=0;
setInterval(function(){
  if(S.bears<=0) return;
  var now=Date.now();
  if(!S.fullT) S.fullT=now;
  var dt=now-S.fullT;
  S.fullT=now;
  var oldPct=Math.floor(S.full||0);
  if(now < S.bubbleBuffT){
    S.full = BEAR_FULL_MAX;
  } else if(dt>0 && S.full>0) {
    S.full=Math.max(0,S.full-dt/BEAR_FULL_DECAY);
  }
  if(Math.floor(S.full)!==oldPct) save();

  if(S.full>=BEAR_FULL_OK && S.poops.length>0 && now-lastAutoPick>900){
    lastAutoPick=now;
    collectPoop(S.poops[0], true);   /* true = 小京自动捡，不出声 */
    return;
  }
    if(S.expedition && Date.now() >= S.expedition.endTime){
    finishExpedition();
  }
  paintBear();
},1000);

$('exportSave').addEventListener('click', function(){
  var data = JSON.stringify(S);
  panel.innerHTML = '<div class="ttl">📤 导出存档</div>'+
    '<textarea id="saveData" readonly style="width:100%;height:150px;font-size:12px;border-radius:12px;border:1px solid #f2dfd4;padding:8px;box-sizing:border-box;resize:none;"></textarea>'+
    '<div class="hintline">长按全选复制，或者点下面的按钮复制</div>'+
    '<button class="catb" id="copySave" style="margin-top:9px">复制存档</button>'+
    '<div class="hintline">点空白关闭</div>';
  overlay.classList.add('on');
  var ta = $('saveData');
  ta.value = data;
  ta.addEventListener('click', function(){ ta.select(); });
  $('copySave').addEventListener('click', function(){
    ta.select();
    try{
      document.execCommand('copy');
      toast('已复制存档，快去粘贴保存吧');
    }catch(e){
      toast('复制失败，请长按全选复制');
    }
  });
});

$('importSave').addEventListener('click', function(){
  panel.innerHTML = '<div class="ttl">📥 导入存档</div>'+
    '<textarea id="importData" placeholder="把导出的存档字符串粘贴到这里" style="width:100%;height:150px;font-size:12px;border-radius:12px;border:1px solid #f2dfd4;padding:8px;box-sizing:border-box;resize:none;"></textarea>'+
    '<button class="catb" id="doImport" style="margin-top:9px">确认导入</button>'+
    '<div class="hintline">导入会覆盖当前进度，请谨慎操作</div>';
  overlay.classList.add('on');
  $('doImport').addEventListener('click', function(){
    var txt = $('importData').value.trim();
    if(!txt){ toast('还没粘贴存档呢'); return; }
    try{
      var obj = JSON.parse(txt);
      if(!obj || typeof obj !== 'object' || !obj.plots){ toast('存档格式不对，请检查'); return; }
      localStorage.setItem(KEY, JSON.stringify(obj));
      toast('导入成功，正在重新加载...');
      setTimeout(function(){ location.reload(); }, 600);
    }catch(e){
      toast('解析失败，存档内容有误');
    }
  });
});

paint();
</script>
</body>
</html>
